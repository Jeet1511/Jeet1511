name: Generate Contribution Snake

on:
  schedule:
    # runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake grids
        uses: Platane/snk@v3
        with:
          github_user_name: jeet1511
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=%23D4AF37&color_dots=%23E9EAEE,%23CBD5E1,%2394A3B8,%23475569,%231E1F22
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FFD700&color_dots=%231E1F22,%2336373B,%234A4B50,%23B8860B,%23D4AF37

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
