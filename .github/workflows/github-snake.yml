name: Generate Contribution Snake

on:
  schedule:
    # runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake grids
        uses: Platane/snk@v3
        with:
          github_user_name: jeet1511
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=%23D4AF37&color_dots=%23E9EAEE,%23CBD5E1,%2394A3B8,%23475569,%231E1F22
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FFD700&color_dots=%231E1F22,%2336373B,%234A4B50,%23B8860B,%23D4AF37

      - name: Stamp "JEET" onto the snake
        run: |
          OVERLAY='<text x="50%" y="56%" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="78" letter-spacing="16" fill="#FFD700" fill-opacity="0.28" stroke="#B8860B" stroke-opacity="0.4" stroke-width="1">JEET</text></svg>'
          for f in dist/github-snake.svg dist/github-snake-dark.svg; do
            perl -0777 -pi -e "s|</svg>(?!.*</svg>)|\Q$OVERLAY\E|s" "$f"
          done

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
