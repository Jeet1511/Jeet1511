<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 60" width="890" height="60" role="img" aria-label="atmospheric transition">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.10"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="2"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="60"/></clipPath>
  </defs>
  <style>
    .tw1{animation:tw 4s ease-in-out infinite}.tw2{animation:tw 5.5s ease-in-out .8s infinite}.tw3{animation:tw 6s ease-in-out 1.6s infinite}.tw4{animation:tw 4.5s ease-in-out 2.4s infinite}.tw5{animation:tw 5s ease-in-out .4s infinite}.tw6{animation:tw 6.5s ease-in-out 1.2s infinite}
    @keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
    .glow{animation:gl 8s ease-in-out infinite alternate;transform-origin:445px 30px}
    @keyframes gl{from{opacity:.7;transform:scaleX(.96)}to{opacity:1;transform:scaleX(1.04)}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="890" height="60" fill="#06070B"/>
    <ellipse class="glow" cx="445" cy="30" rx="380" ry="22" fill="url(#glow)"/>
    <g fill="#9BA3B4">
      <circle class="tw1" cx="120" cy="22" r="1"/>
      <circle class="tw2" cx="240" cy="38" r="1.2"/>
      <circle class="tw3" cx="380" cy="18" r="0.9"/>
      <circle class="tw4" cx="520" cy="40" r="1.1"/>
      <circle class="tw5" cx="660" cy="20" r="1"/>
      <circle class="tw6" cx="780" cy="36" r="1.2"/>
    </g>
  </g>
  <rect width="890" height="60" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
