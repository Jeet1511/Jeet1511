<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410" overflow="hidden" role="img" aria-label="GitHub trophy vault">
  <defs>
    <linearGradient id="trGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="trRank" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="trShine" x1="0%" y1="0%" x2="100%" y2="0%">
