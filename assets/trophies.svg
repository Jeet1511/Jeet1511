<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="920" height="200" overflow="hidden" role="img" aria-label="GitHub trophies">
  <defs>
    <linearGradient id="trGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="trShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="trGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="trClip"><rect x="0" y="0" width="920" height="200" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#trClip)">
    <rect x="1" y="1" width="918" height="198" rx="14" fill="#1E1F22" stroke="#36373B" stroke-width="2"/>
    <rect x="1" y="1" width="918" height="198" rx="14" fill="none" stroke="#D4AF37" stroke-width="1.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="22" y="30" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="15" fill="url(#trGold)" letter-spacing="2">🏆 TROPHY VAULT</text>
    <text x="898" y="30" font-family="Consolas, monospace" font-size="10" fill="#6E6F74" text-anchor="end">rank protocol: keep shipping ▮</text>
    <line x1="22" y1="40" x2="898" y2="40" stroke="#36373B" stroke-width="1.4"/>

    <!-- trophy cells: outer g = position, inner g = pop-in scale (pivot at local 0,0) -->
    <g text-anchor="middle">
      <g transform="translate(105,112)">
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.2s" fill="freeze"/>
          <animateTransform attributeName="transform" type="scale" values="0.4;1.12;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.2s" fill="freeze"/>
          <rect x="-72" y="-52" width="144" height="118" rx="10" fill="#0A0A0B" stroke="#FFD700" stroke-width="1.6"/>
          <text y="0" font-size="30">🏆</text>
          <text y="28" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#FFD700" filter="url(#trGlow)">SSS</text>
          <text y="50" font-family="Consolas, monospace" font-size="10" fill="#E8E8E8">Commits</text>
        </g>
      </g>
      <g transform="translate(275,112)">
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.45s" fill="freeze"/>
          <animateTransform attributeName="transform" type="scale" values="0.4;1.12;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.45s" fill="freeze"/>
          <rect x="-72" y="-52" width="144" height="118" rx="10" fill="#0A0A0B" stroke="#D4AF37" stroke-width="1.6"/>
          <text y="0" font-size="30">🥇</text>
          <text y="28" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#FFD700" filter="url(#trGlow)">SS</text>
          <text y="50" font-family="Consolas, monospace" font-size="10" fill="#E8E8E8">Repos</text>
        </g>
      </g>
      <g transform="translate(445,112)">
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.7s" fill="freeze"/>
          <animateTransform attributeName="transform" type="scale" values="0.4;1.12;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.7s" fill="freeze"/>
          <rect x="-72" y="-52" width="144" height="118" rx="10" fill="#0A0A0B" stroke="#D4AF37" stroke-width="1.6"/>
          <text y="0" font-size="30">⭐</text>
          <text y="28" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#FFD700" filter="url(#trGlow)">S</text>
          <text y="50" font-family="Consolas, monospace" font-size="10" fill="#E8E8E8">Stars</text>
        </g>
      </g>
      <g transform="translate(615,112)">
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.95s" fill="freeze"/>
          <animateTransform attributeName="transform" type="scale" values="0.4;1.12;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.95s" fill="freeze"/>
          <rect x="-72" y="-52" width="144" height="118" rx="10" fill="#0A0A0B" stroke="#36373B" stroke-width="1.6"/>
          <text y="0" font-size="30">🔥</text>
          <text y="28" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#FFD700" filter="url(#trGlow)">A+</text>
          <text y="50" font-family="Consolas, monospace" font-size="10" fill="#E8E8E8">Streak</text>
        </g>
      </g>
      <g transform="translate(785,112)">
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.2s" fill="freeze"/>
          <animateTransform attributeName="transform" type="scale" values="0.4;1.12;1" keyTimes="0;0.7;1" dur="0.45s" begin="1.2s" fill="freeze"/>
          <rect x="-72" y="-52" width="144" height="118" rx="10" fill="#0A0A0B" stroke="#36373B" stroke-width="1.6"/>
          <text y="0" font-size="30">⚔️</text>
          <text y="28" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#FFD700" filter="url(#trGlow)">A</text>
          <text y="50" font-family="Consolas, monospace" font-size="10" fill="#E8E8E8">Pull Requests</text>
        </g>
      </g>
    </g>

    <!-- clipped shine sweep across whole vault -->
    <rect x="-200" y="0" width="110" height="200" fill="url(#trShine)" transform="skewX(-18)">
      <animate attributeName="x" values="-200;1080" dur="4.6s" begin="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
