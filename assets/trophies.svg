<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200" overflow="hidden" role="img" aria-label="GitHub trophies">
  <defs>
    <linearGradient id="trGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="trShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="trGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="trClip"><rect x="0" y="0" width="460" height="200" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#trClip)">
    <rect x="1" y="1" width="458" height="198" rx="14" fill="#1E1F22" stroke="#36373B" stroke-width="2"/>
    <rect x="1" y="1" width="458" height="198" rx="14" fill="none" stroke="#D4AF37" stroke-width="1.4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="22" y="30" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="15" fill="url(#trGold)" letter-spacing="2">🏆 TROPHY VAULT</text>
    <line x1="22" y1="40" x2="438" y2="40" stroke="#36373B" stroke-width="1.4"/>

    <!-- trophy cells popping in -->
    <g text-anchor="middle">
      <g opacity="0" transform="translate(80,110) scale(0.4)">
        <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.3s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0.4;1.12;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.3s" additive="replace" fill="freeze"/>
        <rect x="-52" y="-56" width="104" height="122" rx="10" fill="#0A0A0B" stroke="#FFD700" stroke-width="1.6"/>
        <text y="4" font-size="34">🏆</text>
        <text y="32" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="12" fill="#FFD700" filter="url(#trGlow)">SSS</text>
        <text y="52" font-family="Consolas, monospace" font-size="9.5" fill="#E8E8E8">Commits</text>
      </g>
      <g opacity="0" transform="translate(190,110) scale(0.4)">
        <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.6s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0.4;1.12;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.6s" additive="replace" fill="freeze"/>
        <rect x="-52" y="-56" width="104" height="122" rx="10" fill="#0A0A0B" stroke="#D4AF37" stroke-width="1.6"/>
        <text y="4" font-size="34">🥇</text>
        <text y="32" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="12" fill="#FFD700" filter="url(#trGlow)">SS</text>
        <text y="52" font-family="Consolas, monospace" font-size="9.5" fill="#E8E8E8">Repos</text>
      </g>
      <g opacity="0" transform="translate(300,110) scale(0.4)">
        <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.9s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0.4;1.12;1" keyTimes="0;0.7;1" dur="0.45s" begin="0.9s" additive="replace" fill="freeze"/>
        <rect x="-52" y="-56" width="104" height="122" rx="10" fill="#0A0A0B" stroke="#D4AF37" stroke-width="1.6"/>
        <text y="4" font-size="34">⭐</text>
        <text y="32" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="12" fill="#FFD700" filter="url(#trGlow)">S</text>
        <text y="52" font-family="Consolas, monospace" font-size="9.5" fill="#E8E8E8">Stars</text>
      </g>
      <g opacity="0" transform="translate(410,110) scale(0.4)">
        <animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="scale" values="0.4;1.12;1" keyTimes="0;0.7;1" dur="0.45s" begin="1.2s" additive="replace" fill="freeze"/>
        <rect x="-42" y="-56" width="84" height="122" rx="10" fill="#0A0A0B" stroke="#36373B" stroke-width="1.6"/>
        <text y="4" font-size="34">🔥</text>
        <text y="32" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="12" fill="#FFD700" filter="url(#trGlow)">A+</text>
        <text y="52" font-family="Consolas, monospace" font-size="9.5" fill="#E8E8E8">Streak</text>
      </g>
    </g>

    <!-- clipped shine sweep across whole vault -->
    <rect x="-160" y="0" width="90" height="200" fill="url(#trShine)" transform="skewX(-18)">
      <animate attributeName="x" values="-160;560" dur="3.8s" begin="1.8s" repeatCount="indefinite"/>
    </rect>

    <text x="230" y="190" font-family="Consolas, monospace" font-size="9" fill="#6E6F74" text-anchor="middle">// rank protocol: keep shipping to unlock more</text>
  </g>
</svg>
