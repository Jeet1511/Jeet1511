    </g>

    <text x="26" y="190" font-family="Consolas, monospace" font-size="9" fill="#6E6F74">jeet1511@github:~$ analyze --stack MERN <tspan fill="#FFD700">█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan></text>
      <rect x="-150" y="0" width="70" height="200" fill="url(#lgShine)" transform="skewX(-18)"><animate attributeName="x" values="-740;480" dur="6s" repeatCount="indefinite"/></rect>
