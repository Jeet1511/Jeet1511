<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200" overflow="hidden" role="img" aria-label="Most used languages">
  <defs>
    <linearGradient id="lgShine" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFD700" stop-opacity="0"/><stop offset="50%" stop-color="#FFD700" stop-opacity="0.22"/><stop offset="100%" stop-color="#FFD700" stop-opacity="0"/></linearGradient>
    <linearGradient id="lgGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="lgClip"><rect x="0" y="0" width="460" height="200" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#lgClip)">
