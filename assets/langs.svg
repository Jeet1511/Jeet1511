<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200" overflow="hidden">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#36373B" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="460" height="200" rx="12" fill="#1E1F22"/>
  
  <!-- Animated grid background -->
  <rect x="0" y="0" width="460" height="200" rx="12" fill="url(#grid)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Pulsing gold border glow -->
  <rect x="0" y="0" width="460" height="200" rx="12" fill="none" stroke="#D4AF37" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Corner accents -->
  <path d="M 2 14 L 2 6 Q 2 2 6 2 L 14 2" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
  <path d="M 446 2 L 454 2 Q 458 2 458 6 L 458 14" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
  <path d="M 2 186 L 2 194 Q 2 198 6 198 L 14 198" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
  <path d="M 446 198 L 454 198 Q 458 198 458 194 L 458 186" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Title -->
  <text x="230" y="28" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="16" fill="#E0E0E0" letter-spacing="2">TOP LANGUAGES</text>
  
  <!-- Terminal header -->
  <text x="20" y="50" font-family="'Courier New', monospace" font-size="11" fill="#D4AF37" opacity="0.8">&gt; language_analysis --top</text>
  
  <!-- Language bars -->
  <!-- React 30% -->
  <g>
    <text x="20" y="72" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6a6a6e">React</text>
    <rect x="90" y="64" width="0" height="10" rx="2" fill="#61DAFB" opacity="0.8">
      <animate attributeName="width" values="0;102;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="64" width="340" height="10" rx="2" fill="none" stroke="#36373B" stroke-width="0.5"/>
    <text x="430" y="73" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#E0E0E0">30%</text>
  </g>
  
  <!-- JavaScript 25% -->
  <g>
    <text x="20" y="92" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6a6a6e">JavaScript</text>
    <rect x="90" y="84" width="0" height="10" rx="2" fill="#F7DF1E" opacity="0.8">
      <animate attributeName="width" values="0;85;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="84" width="340" height="10" rx="2" fill="none" stroke="#36373B" stroke-width="0.5"/>
    <text x="430" y="93" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#E0E0E0">25%</text>
  </g>
  
  <!-- Python 18% -->
  <g>
    <text x="20" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6a6a6e">Python</text>
    <rect x="90" y="104" width="0" height="10" rx="2" fill="#3776AB" opacity="0.8">
      <animate attributeName="width" values="0;61;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="104" width="340" height="10" rx="2" fill="none" stroke="#36373B" stroke-width="0.5"/>
    <text x="430" y="113" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#E0E0E0">18%</text>
  </g>
  
  <!-- Java 12% -->
  <g>
    <text x="20" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6a6a6e">Java</text>
    <rect x="90" y="124" width="0" height="10" rx="2" fill="#ED8B00" opacity="0.8">
      <animate attributeName="width" values="0;41;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="124" width="340" height="10" rx="2" fill="none" stroke="#36373B" stroke-width="0.5"/>
    <text x="430" y="133" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#E0E0E0">12%</text>
  </g>
  
  <!-- MERN 8% -->
  <g>
    <text x="20" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6a6a6e">MERN</text>
    <rect x="90" y="144" width="0" height="10" rx="2" fill="#68A063" opacity="0.8">
      <animate attributeName="width" values="0;27;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="144" width="340" height="10" rx="2" fill="none" stroke="#36373B" stroke-width="0.5"/>
    <text x="430" y="153" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#E0E0E0">8%</text>
  </g>
  
  <!-- C 4% -->
  <g>
    <text x="20" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6a6a6e">C</text>
    <rect x="90" y="164" width="0" height="10" rx="2" fill="#A8B9CC" opacity="0.8">
      <animate attributeName="width" values="0;14;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="164" width="340" height="10" rx="2" fill="none" stroke="#36373B" stroke-width="0.5"/>
    <text x="430" y="173" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#E0E0E0">4%</text>
  </g>
  
  <!-- Shell 3% -->
  <g>
    <text x="20" y="192" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6a6a6e">Shell</text>
    <rect x="90" y="184" width="0" height="10" rx="2" fill="#89E051" opacity="0.8">
      <animate attributeName="width" values="0;10;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="184" width="340" height="10" rx="2" fill="none" stroke="#36373B" stroke-width="0.5"/>
    <text x="430" y="193" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#E0E0E0">3%</text>
  </g>
</svg>
