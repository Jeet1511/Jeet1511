      </rect>
      <text x="438" y="117" fill="#E8E8E8" text-anchor="end" opacity="0">17%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="2s" fill="freeze"/></text>

      <text x="26" y="144" fill="#E76F00">Java</text>
      <rect x="130" y="134" width="252" height="11" rx="3" fill="#0A0A0B" stroke="#36373B" stroke-width="0.8"/>
      <rect x="132" y="136" width="0" height="7" rx="2" fill="#E76F00">
        <animate attributeName="width" values="0;59" dur="1.2s" begin="1.2s" calcMode="spline" keySplines="0.25 0.1 0.25 1" fill="freeze"/>
      </rect>
      <text x="438" y="144" fill="#E8E8E8" text-anchor="end" opacity="0">12%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.3s" fill="freeze"/></text>

      <text x="26" y="171" fill="#4EAA25">C / Shell</text>
      <rect x="130" y="161" width="252" height="11" rx="3" fill="#0A0A0B" stroke="#36373B" stroke-width="0.8"/>
      <rect x="132" y="163" width="0" height="7" rx="2" fill="#4EAA25">
        <animate attributeName="width" values="0;40" dur="1.2s" begin="1.5s" calcMode="spline" keySplines="0.25 0.1 0.25 1" fill="freeze"/>
