<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" overflow="hidden">
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C5A028"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Segoe UI', system-ui, Arial, sans-serif; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinR { to { transform: rotate(-360deg); } }
      @keyframes glowPulse { 0%,100% { opacity: 0.15; } 50% { opacity: 0.5; } }
      .ring1 { transform-origin: 300px 200px; animation: spin 20s linear infinite; }
      .ring2 { transform-origin: 300px 200px; animation: spinR 30s linear infinite; }
      .ring3 { transform-origin: 300px 200px; animation: spin 40s linear infinite; }
      .core-pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 300px 200px; }
      .glow-line { animation: glowPulse 2.5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#0A0A0B" rx="16"/>

  <!-- Header -->
  <text x="24" y="30" font-family="'Courier New', monospace" font-size="11" fill="#36373B" letter-spacing="3">03 · TECH STACK</text>
  <text x="576" y="30" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#36373B">7 tools in orbit</text>

  <!-- Glow -->
  <circle cx="300" cy="200" r="120" fill="url(#coreGlow)"/>

  <!-- Orbital rings (Amber/Gunmetal) -->
  <circle cx="300" cy="200" r="80" fill="none" stroke="#36373B" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="300" cy="200" r="120" fill="none" stroke="#1E1F22" stroke-width="1" stroke-dasharray="3 8" opacity="0.5"/>
  <circle cx="300" cy="200" r="160" fill="none" stroke="#36373B" stroke-width="1" stroke-dasharray="5 5" opacity="0.4"/>

  <!-- Rotating group with tech elements -->
  <g class="ring1">
    <!-- Connecting lines from core to inner nodes -->
    <line x1="300" y1="200" x2="380" y2="200" stroke="#D4AF37" stroke-width="0.7" filter="url(#lineGlow)" class="glow-line"/>
    <line x1="300" y1="200" x2="240" y2="92" stroke="#D4AF37" stroke-width="0.7" filter="url(#lineGlow)" class="glow-line" style="animation-delay: 0.4s"/>
    <line x1="300" y1="200" x2="240" y2="308" stroke="#D4AF37" stroke-width="0.7" filter="url(#lineGlow)" class="glow-line" style="animation-delay: 0.8s"/>
    <!-- React at 0° (380, 200) -->
    <g transform="translate(380, 200)">
      <circle r="20" fill="#1E1F22" stroke="#61DAFB" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-size="9" fill="#61DAFB" font-weight="bold">React</text>
    </g>
    <!-- Python at 120° -->
    <g transform="translate(240, 92)">
      <circle r="20" fill="#1E1F22" stroke="#3776AB" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-size="9" fill="#3776AB" font-weight="bold">Python</text>
    </g>
    <!-- Java at 240° -->
    <g transform="translate(240, 308)">
      <circle r="20" fill="#1E1F22" stroke="#ED8B00" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-size="9" fill="#ED8B00" font-weight="bold">Java</text>
    </g>
  </g>

  <g class="ring2">
    <!-- Connecting lines from core to middle nodes -->
    <line x1="300" y1="200" x2="420" y2="104" stroke="#D4AF37" stroke-width="0.5" filter="url(#lineGlow)" class="glow-line" style="animation-delay: 1.2s"/>
    <line x1="300" y1="200" x2="140" y2="200" stroke="#D4AF37" stroke-width="0.5" filter="url(#lineGlow)" class="glow-line" style="animation-delay: 1.6s"/>
    <line x1="300" y1="200" x2="420" y2="296" stroke="#D4AF37" stroke-width="0.5" filter="url(#lineGlow)" class="glow-line" style="animation-delay: 2s"/>
    <!-- JavaScript at 60° -->
    <g transform="translate(420, 104)">
      <circle r="18" fill="#1E1F22" stroke="#F7DF1E" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-size="8" fill="#F7DF1E" font-weight="bold">JS</text>
    </g>
    <!-- MERN at 180° -->
    <g transform="translate(140, 200)">
      <circle r="18" fill="#1E1F22" stroke="#68A063" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-size="8" fill="#68A063" font-weight="bold">MERN</text>
    </g>
    <!-- C at 300° -->
    <g transform="translate(420, 296)">
      <circle r="18" fill="#1E1F22" stroke="#A8B9CC" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-size="8" fill="#A8B9CC" font-weight="bold">C</text>
    </g>
  </g>

  <g class="ring3">
    <!-- Connecting line from core to outer node -->
    <line x1="300" y1="200" x2="300" y2="40" stroke="#D4AF37" stroke-width="0.5" filter="url(#lineGlow)" class="glow-line" style="animation-delay: 0.6s"/>
    <!-- Shell at 90° -->
    <g transform="translate(300, 40)">
      <circle r="16" fill="#1E1F22" stroke="#89E051" stroke-width="1.5"/>
      <text y="4" text-anchor="middle" font-size="8" fill="#89E051" font-weight="bold">Shell</text>
    </g>
  </g>

  <!-- Central core -->
  <g class="core-pulse">
    <circle cx="300" cy="200" r="30" fill="url(#coreGrad)" opacity="0.9"/>
    <circle cx="300" cy="200" r="30" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  </g>
  <text x="300" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#0A0A0B">&lt;/&gt;</text>

  <!-- Footer -->
  <text x="24" y="385" font-family="'Courier New', monospace" font-size="10" fill="#36373B">// always learning, always building</text>
</svg>
