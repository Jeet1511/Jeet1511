<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="480" viewBox="0 0 1280 480" overflow="hidden">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#C5A028"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#D4AF37">
        <animate attributeName="stop-color" values="#D4AF37;#C5A028;#D4AF37" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#CBD5E1" stroke-width="0.5" opacity="0.15"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="20s" repeatCount="indefinite"/>
    </pattern>
    <filter id="blobBlur"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="charShadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/></filter>
    <clipPath id="charClip"><rect x="650" y="0" width="630" height="480"/></clipPath>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="150">
        <animate attributeName="width" from="0" to="520" dur="4s" begin="2.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </rect>
    </clipPath>
    <clipPath id="nameClip"><text x="40" y="240" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="72" letter-spacing="4">JEET MONDAL</text></clipPath>
  </defs>

  <style>
    .term-text { font-family: 'Courier New', Courier, monospace; }
    .name-font { font-family: 'Arial Black', Impact, sans-serif; font-weight: 900; }
  </style>

  <!-- Background -->
  <rect width="1280" height="480" fill="#F5F5F7"/>

  <!-- Blob 1: Slate -->
  <path d="M100 80 Q300 20 500 180 Q600 340 400 400 Q200 460 50 280Z" fill="#E2E8F0" opacity="0.35" filter="url(#blobBlur)">
    <animateTransform attributeName="transform" type="translate" values="0 0;60 40;-40 60;0 0" dur="14s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.12;0.94;1" dur="11s" repeatCount="indefinite" additive="sum"/>
  </path>

  <!-- Blob 2: Faint Gold -->
  <path d="M700 40 Q950 80 1080 220 Q1160 380 940 420 Q720 460 660 280Z" fill="#D4AF37" opacity="0.03" filter="url(#blobBlur)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-50 30;40 -40;0 0" dur="17s" repeatCount="indefinite"/>
  </path>

  <!-- Blob 3: Light slate -->
  <path d="M300 200 Q500 140 700 240 Q800 360 600 420 Q400 470 250 340Z" fill="#E2E8F0" opacity="0.2" filter="url(#blobBlur)">
    <animateTransform attributeName="transform" type="translate" values="0 0;30 -50;-60 20;0 0" dur="19s" repeatCount="indefinite"/>
  </path>

  <!-- Grid overlay -->
  <rect width="1280" height="480" fill="url(#grid)"/>

  <!-- Matrix Data Rain -->
  <g font-family="'Courier New', monospace" font-size="10" fill="#D4AF37" opacity="0.12">
    <text x="80" y="0">0<tspan><animate attributeName="y" from="-20" to="500" dur="4s" repeatCount="indefinite"/></tspan></text>
    <text x="160" y="0">1<tspan><animate attributeName="y" from="-40" to="500" dur="5.5s" repeatCount="indefinite"/></tspan></text>
    <text x="240" y="0">F<tspan><animate attributeName="y" from="-10" to="500" dur="3.8s" repeatCount="indefinite"/></tspan></text>
    <text x="320" y="0">0<tspan><animate attributeName="y" from="-60" to="500" dur="6.2s" repeatCount="indefinite"/></tspan></text>
    <text x="400" y="0">1<tspan><animate attributeName="y" from="-30" to="500" dur="4.7s" repeatCount="indefinite"/></tspan></text>
    <text x="480" y="0">F<tspan><animate attributeName="y" from="-50" to="500" dur="5s" repeatCount="indefinite"/></tspan></text>
    <text x="700" y="0">0<tspan><animate attributeName="y" from="-20" to="500" dur="4.3s" repeatCount="indefinite"/></tspan></text>
    <text x="800" y="0">1<tspan><animate attributeName="y" from="-45" to="500" dur="5.8s" repeatCount="indefinite"/></tspan></text>
    <text x="900" y="0">F<tspan><animate attributeName="y" from="-15" to="500" dur="3.5s" repeatCount="indefinite"/></tspan></text>
    <text x="1000" y="0">0<tspan><animate attributeName="y" from="-55" to="500" dur="6.5s" repeatCount="indefinite"/></tspan></text>
    <text x="1100" y="0">1<tspan><animate attributeName="y" from="-25" to="500" dur="4.1s" repeatCount="indefinite"/></tspan></text>
    <text x="1200" y="0">F<tspan><animate attributeName="y" from="-35" to="500" dur="5.3s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- ==================== LEFT SIDE ==================== -->

  <!-- 1. Living Terminal -->
  <g transform="translate(40,40)">
    <!-- Terminal bg -->
    <rect width="520" height="140" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Title bar -->
    <rect width="520" height="24" rx="8" fill="#FFFFFF"/>
    <rect y="16" width="520" height="8" fill="#FFFFFF"/>
    <line x1="0" y1="24" x2="520" y2="24" stroke="#E2E8F0" stroke-width="0.5"/>
    <!-- Dots -->
    <circle cx="16" cy="12" r="5" fill="#FF5F56"/>
    <circle cx="34" cy="12" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="12" r="5" fill="#27C93F"/>

    <!-- Phase 1: Boot lines (0-2s) -->
    <text x="14" y="46" class="term-text" font-size="11" fill="#475569" opacity="0">
      > initializing core systems...
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="290" y="46" class="term-text" font-size="11" fill="#D4AF37" opacity="0">
      [OK]
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>
    </text>

    <text x="14" y="62" class="term-text" font-size="11" fill="#475569" opacity="0">
      > establishing secure uplink...
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="280" y="62" class="term-text" font-size="11" fill="#D4AF37" opacity="0">
      [SECURE]
      <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- Phase 2: Prompt (2-4s) -->
    <text x="14" y="82" class="term-text" font-size="11" fill="#1E3A5F" opacity="0">
      admin@grid:~$ execute profile.md
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
    </text>
    <!-- Blinking cursor -->
    <rect x="260" y="72" width="7" height="12" fill="#D4AF37" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.01s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" begin="2.7s" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Phase 3: Living Logs (4s+) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="4s" dur="0.5s" fill="freeze"/>
      <clipPath id="logClipLight"><rect x="0" y="90" width="520" height="46"/></clipPath>
      <g clip-path="url(#logClipLight)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -60" dur="4s" repeatCount="indefinite"/>
          <!-- Set 1 -->
          <text x="14" y="102" class="term-text" font-size="10" fill="#475569" opacity="0.2">compiling modules... [##########] 100%</text>
          <text x="14" y="114" class="term-text" font-size="10" fill="#475569" opacity="0.2">pinging node 42... latency 12ms</text>
          <text x="14" y="126" class="term-text" font-size="10" fill="#475569" opacity="0.2">allocating memory block 0xAF...</text>
          <text x="14" y="138" class="term-text" font-size="10" fill="#475569" opacity="0.2">syncing repositories... done</text>
          <text x="14" y="150" class="term-text" font-size="10" fill="#475569" opacity="0.2">optimizing build pipeline...</text>
          <!-- Set 2 (duplicate for seamless loop) -->
          <text x="14" y="162" class="term-text" font-size="10" fill="#475569" opacity="0.2">compiling modules... [##########] 100%</text>
          <text x="14" y="174" class="term-text" font-size="10" fill="#475569" opacity="0.2">pinging node 42... latency 12ms</text>
          <text x="14" y="186" class="term-text" font-size="10" fill="#475569" opacity="0.2">allocating memory block 0xAF...</text>
          <text x="14" y="198" class="term-text" font-size="10" fill="#475569" opacity="0.2">syncing repositories... done</text>
          <text x="14" y="210" class="term-text" font-size="10" fill="#475569" opacity="0.2">optimizing build pipeline...</text>
        </g>
      </g>
    </g>
  </g>

  <!-- 2. Name -->
  <text x="40" y="240" class="name-font" font-size="72" fill="url(#nameGrad)" letter-spacing="4">JEET MONDAL</text>
  <g clip-path="url(#nameClip)">
    <rect x="-200" y="170" width="120" height="90" fill="url(#shineGrad)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="900 0" dur="3.5s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <!-- 3. Subtitle -->
  <text x="40" y="275" font-family="'Courier New', Courier, monospace" font-size="14" fill="#475569">Full Stack Dev // MERN Architect</text>

  <!-- 4. Code Editor -->
  <g transform="translate(40,300)">
    <!-- Editor bg -->
    <rect width="520" height="150" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Title bar -->
    <rect width="520" height="24" rx="8" fill="#FFFFFF"/>
    <rect y="16" width="520" height="8" fill="#FFFFFF"/>
    <line x1="0" y1="24" x2="520" y2="24" stroke="#E2E8F0" stroke-width="0.5"/>
    <!-- Dots -->
    <circle cx="16" cy="12" r="5" fill="#FF5F56"/>
    <circle cx="34" cy="12" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="12" r="5" fill="#27C93F"/>

    <!-- JSX lines -->
    <g clip-path="url(#typeClip)">
      <text x="14" y="46" class="term-text" font-size="12" fill="#1E3A5F">
        <tspan fill="#475569">const</tspan> architect = {
      </text>
      <text x="14" y="62" class="term-text" font-size="12">
        <tspan fill="#475569">  name: </tspan><tspan fill="#D4AF37">'Jeet Mondal'</tspan><tspan fill="#475569">,</tspan>
      </text>
      <text x="14" y="78" class="term-text" font-size="12">
        <tspan fill="#475569">  stack: </tspan><tspan fill="#D4AF37">['React', 'Node']</tspan><tspan fill="#475569">,</tspan>
      </text>
      <text x="14" y="94" class="term-text" font-size="12">
        <tspan fill="#475569">  focus: </tspan><tspan fill="#C5A028">Infinity</tspan>
      </text>
      <text x="14" y="110" class="term-text" font-size="12" fill="#475569">
        }; <tspan fill="#1E3A5F">return</tspan> &lt;System status=<tspan fill="#D4AF37">'online'</tspan> /&gt;;
      </text>
    </g>

    <!-- Audio Equalizer -->
    <g transform="translate(14, 130)">
      <rect x="0" y="0" width="6" height="10" fill="#D4AF37" rx="2">
        <animate attributeName="height" values="4;18;6;14;4" dur="0.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;-8;4;-4;6" dur="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="0" width="6" height="10" fill="#D4AF37" rx="2">
        <animate attributeName="height" values="8;20;4;16;8" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;-10;6;-6;2" dur="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="0" width="6" height="10" fill="#D4AF37" rx="2">
        <animate attributeName="height" values="12;6;18;8;12" dur="0.35s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-2;4;-8;2;-2" dur="0.35s" repeatCount="indefinite"/>
      </rect>
      <rect x="30" y="0" width="6" height="10" fill="#D4AF37" rx="2">
        <animate attributeName="height" values="6;16;4;20;6" dur="0.55s" repeatCount="indefinite"/>
        <animate attributeName="y" values="4;-6;6;-10;4" dur="0.55s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="0" width="6" height="10" fill="#D4AF37" rx="2">
        <animate attributeName="height" values="14;4;12;8;14" dur="0.45s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-4;6;-2;2;-4" dur="0.45s" repeatCount="indefinite"/>
      </rect>
      <rect x="50" y="0" width="6" height="10" fill="#D4AF37" rx="2">
        <animate attributeName="height" values="8;18;6;14;8" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="2;-8;4;-4;2" dur="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="60" y="0" width="6" height="10" fill="#D4AF37" rx="2">
        <animate attributeName="height" values="16;8;20;4;16" dur="0.38s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-6;2;-10;6;-6" dur="0.38s" repeatCount="indefinite"/>
      </rect>
      <rect x="70" y="0" width="6" height="10" fill="#D4AF37" rx="2">
        <animate attributeName="height" values="4;14;8;18;4" dur="0.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="6;-4;2;-8;6" dur="0.7s" repeatCount="indefinite"/>
      </rect>
      <rect x="80" y="0" width="6" height="10" fill="#D4AF37" rx="2">
        <animate attributeName="height" values="10;20;6;12;10" dur="0.42s" repeatCount="indefinite"/>
        <animate attributeName="y" values="0;-10;4;-2;0" dur="0.42s" repeatCount="indefinite"/>
      </rect>
      <rect x="90" y="0" width="6" height="10" fill="#D4AF37" rx="2">
        <animate attributeName="height" values="18;6;14;8;18" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="-8;4;-4;2;-8" dur="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE ==================== -->

  <!-- Character with scan reveal -->
  <g clip-path="url(#charClip)">
    <rect x="650" y="0" width="630" height="480" fill="#F5F5F7"/>
    <!-- Radar Pulse -->
    <circle cx="965" cy="240" r="20" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0">
      <animate attributeName="r" values="20;200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="965" cy="240" r="20" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0">
      <animate attributeName="r" values="20;200" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="965" cy="240" r="20" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0">
      <animate attributeName="r" values="20;200" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <image href="assets/avatar.png" x="650" y="0" width="630" height="480" preserveAspectRatio="xMidYMax slice" filter="url(#charShadow)"/>
    <rect x="650" y="0" width="630" height="120" fill="url(#scanGrad)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="0 -120" to="0 480" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <line x1="650" y1="120" x2="1280" y2="120" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" from="0 -120" to="0 480" dur="3.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- BUILD WITH PURPOSE -->
  <g transform="translate(900, 50)">
    <rect width="240" height="40" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="120" y="26" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" font-weight="bold" fill="#1E3A5F" letter-spacing="2">BUILD WITH PURPOSE</text>
  </g>
</svg>