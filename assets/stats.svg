<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="460" height="200" overflow="hidden">
  <defs>
    <!-- Grid pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2C2C2E" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    
    <!-- Gold glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Rank ring gradient -->
    <linearGradient id="rankGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="460" height="200" rx="12" fill="#1A1A1E"/>
  
  <!-- Animated grid background -->
  <rect x="0" y="0" width="460" height="200" rx="12" fill="url(#grid)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Pulsing gold border glow -->
  <rect x="0" y="0" width="460" height="200" rx="12" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Corner accents -->
  <path d="M 2 14 L 2 6 Q 2 2 6 2 L 14 2" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
  <path d="M 446 2 L 454 2 Q 458 2 458 6 L 458 14" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
  <path d="M 2 186 L 2 194 Q 2 198 6 198 L 14 198" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
  <path d="M 446 198 L 454 198 Q 458 198 458 194 L 458 186" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Title -->
  <text x="230" y="32" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="16" fill="#FFF8DC" letter-spacing="2">GITHUB STATS</text>
  <line x1="160" y1="40" x2="300" y2="40" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
  
  <!-- Rank ring on left -->
  <g transform="translate(70, 115)">
    <!-- Outer ring track -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#2C2C2E" stroke-width="4"/>
    <!-- Animated rank ring -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#rankGrad)" stroke-width="4" stroke-dasharray="251.2" stroke-dashoffset="251.2" stroke-linecap="round" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="251.2" to="62.8" dur="1.5s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <!-- Rank letter -->
    <text x="0" y="6" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="24" fill="#FFD700">A+</text>
  </g>
  
  <!-- Stat rows -->
  <!-- Row 1: Repositories -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="500 0" to="0 0" dur="0.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <text x="150" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#6a6a6e" letter-spacing="1">REPOSITORIES</text>
    <text x="400" y="85" text-anchor="end" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="18" fill="#FFF8DC">24</text>
    <line x1="150" y1="92" x2="410" y2="92" stroke="#2C2C2E" stroke-width="0.5"/>
  </g>
  
  <!-- Row 2: Followers -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="500 0" to="0 0" dur="0.6s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <text x="150" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#6a6a6e" letter-spacing="1">FOLLOWERS</text>
    <text x="400" y="125" text-anchor="end" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="18" fill="#FFF8DC">128</text>
    <line x1="150" y1="132" x2="410" y2="132" stroke="#2C2C2E" stroke-width="0.5"/>
  </g>
  
  <!-- Row 3: Stars -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="500 0" to="0 0" dur="0.6s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    <text x="150" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#6a6a6e" letter-spacing="1">STARS</text>
    <text x="400" y="165" text-anchor="end" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="18" fill="#FFF8DC">342</text>
    <line x1="150" y1="172" x2="410" y2="172" stroke="#2C2C2E" stroke-width="0.5"/>
  </g>
</svg>
