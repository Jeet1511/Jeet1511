<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 110" width="890" height="110" role="img" aria-label="Selected Work">
  <defs>
    <radialGradient id="mesh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.07"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="9"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="110"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.22,.61,.36,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.26s}.d3{animation-delay:.42s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .div{stroke-dasharray:760;stroke-dashoffset:760;animation:draw 2s cubic-bezier(.22,.61,.36,1) .4s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .glo{animation:glo 5s ease-in-out infinite alternate}
    @keyframes glo{from{opacity:.5}to{opacity:1}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="890" height="110" fill="#06070B"/>
    <circle cx="445" cy="55" r="220" fill="url(#mesh)"/>
    <text x="826" y="78" text-anchor="end" font-size="80" font-weight="700" fill="#0E1016" opacity="0.5" letter-spacing="-3">04</text>
    <g class="rise d1">
      <rect x="64" y="40" width="22" height="2" fill="#4EA7FF"/>
      <text x="94" y="48" font-size="11" letter-spacing="3" fill="#9BA3B4">SELECTED WORK</text>
    </g>
    <text class="rise d2" x="62" y="82" font-size="28" font-weight="600" letter-spacing="-.4" fill="#F4F6FB">Projects</text>
    <text class="rise d3" x="826" y="82" text-anchor="end" font-size="12" fill="#5C6473">Four products, end to end</text>
    <line class="div glo" x1="64" y1="98" x2="826" y2="98" stroke="#1C2030" stroke-width="1"/>
  </g>
  <rect width="890" height="110" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
