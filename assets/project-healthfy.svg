<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" overflow="hidden" role="img" aria-label="Project: Healthfy">
  <defs>
    <linearGradient id="p2Gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="p2Shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="p2Clip"><rect x="0" y="0" width="400" height="200" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#p2Clip)">
    <rect x="1" y="1" width="398" height="198" rx="12" fill="#1E1F22" stroke="#36373B" stroke-width="2"/>
    <rect x="1" y="1" width="398" height="198" rx="12" fill="none" stroke="#D4AF37" stroke-width="1.2">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.4s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <!-- ambient gold fx -->
    <g fill="#FFE9A0">
      <circle cx="322" r="1.2" cy="205"><animate attributeName="cy" values="205;-5" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.45;0" keyTimes="0;0.12;0.85;1" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="356" r="1" cy="205" fill="#D4AF37"><animate attributeName="cy" values="205;-5" dur="13s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.4;0" keyTimes="0;0.12;0.85;1" dur="13s" begin="-5s" repeatCount="indefinite"/></circle>
      <circle cx="380" r="1.3" cy="205"><animate attributeName="cy" values="205;-5" dur="11.5s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.45;0" keyTimes="0;0.12;0.85;1" dur="11.5s" begin="-2.5s" repeatCount="indefinite"/></circle>
      <g transform="translate(334,58)"><path d="M0,-2.6 L0.7,-0.7 L2.6,0 L0.7,0.7 L0,2.6 L-0.7,0.7 L-2.6,0 L-0.7,-0.7 Z"/><animate attributeName="opacity" values="0;0.6;0" dur="3.4s" repeatCount="indefinite"/></g>
      <g transform="translate(372,96)"><path d="M0,-2.6 L0.7,-0.7 L2.6,0 L0.7,0.7 L0,2.6 L-0.7,0.7 L-2.6,0 L-0.7,-0.7 Z"/><animate attributeName="opacity" values="0;0.55;0" dur="4.3s" begin="-1.9s" repeatCount="indefinite"/></g>
      <g transform="translate(306,148)"><path d="M0,-2.6 L0.7,-0.7 L2.6,0 L0.7,0.7 L0,2.6 L-0.7,0.7 L-2.6,0 L-0.7,-0.7 Z"/><animate attributeName="opacity" values="0;0.5;0" dur="3.7s" begin="-2.6s" repeatCount="indefinite"/></g>
    </g>
    <rect x="1" y="1" width="398" height="30" fill="#0A0A0B"/>
    <circle cx="20" cy="16" r="4" fill="#FF5F56"/><circle cx="34" cy="16" r="4" fill="#FFBD2E"/><circle cx="48" cy="16" r="4" fill="#27C93F"/>
    <text x="390" y="20" font-family="Consolas, monospace" font-size="10" fill="#6E6F74" text-anchor="end">~/projects/healthfy</text>

    <!-- icon : heart + live ECG pulse -->
    <g transform="translate(44, 92)">
      <path d="M0,22 C-4,16 -26,4 -26,-9 C-26,-19 -18,-25 -10,-25 C-5,-25 -1,-22 0,-18 C1,-22 5,-25 10,-25 C18,-25 26,-19 26,-9 C26,4 4,16 0,22 Z" fill="none" stroke="#FF5F56" stroke-width="2.2">
        <animate attributeName="stroke-width" values="2.2;3.4;2.2" dur="1.1s" repeatCount="indefinite"/>
      </path>
      <polyline points="-20,-4 -10,-4 -6,-12 -1,6 3,-8 7,-4 20,-4" fill="none" stroke="#FFD700" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70" stroke-dashoffset="70">
        <animate attributeName="stroke-dashoffset" values="70;0;-70" dur="2.2s" repeatCount="indefinite"/>
      </polyline>
    </g>

    <text x="92" y="66" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="21" fill="url(#p2Gold)">HEALTHFY</text>
    <text x="92" y="90" font-family="Consolas, monospace" font-size="11" fill="#E8E8E8">MERN health companion — track vitals,</text>
    <text x="92" y="106" font-family="Consolas, monospace" font-size="11" fill="#E8E8E8">book care &amp; stay battle-ready.</text>

    <!-- tech tags -->
    <g font-family="Consolas, monospace" font-size="10" text-anchor="middle">
      <rect x="92" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#47A248" stroke-width="1"/><text x="123" y="136" fill="#47A248">Mongo</text>
      <rect x="162" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#61DAFB" stroke-width="1"/><text x="193" y="136" fill="#61DAFB">React</text>
      <rect x="232" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#339933" stroke-width="1"/><text x="263" y="136" fill="#339933">Express</text>
    </g>

    <!-- footer -->
    <line x1="16" y1="158" x2="384" y2="158" stroke="#36373B" stroke-width="1"/>
    <text x="20" y="180" font-family="Consolas, monospace" font-size="10" fill="#6E6F74">$ npm run heartbeat <tspan fill="#FFD700">█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan></text>
    <text x="384" y="180" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="10" fill="#D4AF37" text-anchor="end">VIEW REPO →</text>

    <!-- shine sweep (clipped) -->
    <rect x="-140" y="0" width="70" height="200" fill="url(#p2Shine)" transform="skewX(-18)">
      <animate attributeName="x" values="-540;540" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
