<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230" role="img" aria-label="healthfy">
  <style>svg:hover{transform:scale(1.05);filter:drop-shadow(0 0 15px rgba(212,175,55,0.6));transition:transform .3s ease,filter .3s ease}</style>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#070a1c"/>
    </linearGradient>
    <radialGradient id="hscene" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#fb7185" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <filter id="hglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="hclip"><rect x="4" y="4" width="432" height="222" rx="18"/></clipPath>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .ecg{animation:ecgA 2.6s linear infinite}
      @keyframes ecgA{to{stroke-dashoffset:-460}}
      .pu{animation:puA 1.3s ease-in-out infinite;transform-origin:64px 54px}
      @keyframes puA{0%,100%{transform:scale(1)}30%{transform:scale(1.14)}45%{transform:scale(1)}}
      .tw{animation:twA 2.4s ease-in-out infinite}
      @keyframes twA{0%,100%{opacity:.15}50%{opacity:1}}
    </style>
  </defs>

  <rect x="4" y="4" width="432" height="222" rx="18" fill="url(#hbg)" stroke="#1b2340"/>
  <g clip-path="url(#hclip)">
    <rect x="4" y="4" width="432" height="104" fill="url(#hscene)"/>
    <g stroke="#fb7185" stroke-opacity=".08" stroke-width="1">
      <line x1="4" y1="30" x2="436" y2="30"/><line x1="4" y1="56" x2="436" y2="56"/><line x1="4" y1="82" x2="436" y2="82"/>
      <line x1="60" y1="4" x2="60" y2="108"/><line x1="140" y1="4" x2="140" y2="108"/><line x1="220" y1="4" x2="220" y2="108"/><line x1="300" y1="4" x2="300" y2="108"/><line x1="380" y1="4" x2="380" y2="108"/>
    </g>
    <circle class="tw" cx="70" cy="26" r="1.5" fill="#fecdd3"/>
    <circle class="tw" cx="180" cy="80" r="1.3" fill="#fecdd3" style="animation-delay:-.9s"/>
    <circle class="tw" cx="410" cy="30" r="1.4" fill="#fecdd3" style="animation-delay:-1.5s"/>

    <!-- ECG base + travelling pulse -->
    <path d="M24,56 H120 l12,-22 l14,44 l12,-32 l9,10 H416" fill="none" stroke="#fb7185" stroke-opacity=".25" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path class="ecg" d="M24,56 H120 l12,-22 l14,44 l12,-32 l9,10 H416" fill="none" stroke="#fb7185" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="60 400" filter="url(#hglow)"/>

    <!-- pulsing heart-cross -->
    <g class="pu">
      <circle cx="64" cy="54" r="20" fill="#0a0f24" fill-opacity=".9" stroke="#fb7185" stroke-width="1.6"/>
      <path d="M64,45 v18 M55,54 h18" stroke="#fb7185" stroke-width="3.4" stroke-linecap="round"/>
    </g>

    <!-- status badge -->
    <rect x="330" y="18" width="92" height="24" rx="12" fill="#450a0a" fill-opacity=".7" stroke="#fb7185" stroke-opacity=".55"/>
    <circle cx="346" cy="30" r="3" fill="#fb7185"/>
    <text x="356" y="34" font-size="10.5" font-weight="600" fill="#fda4af">ACTIVE</text>
  </g>
  <line x1="4" y1="108" x2="436" y2="108" stroke="#1b2340" stroke-width="1"/>

  <text x="24" y="140" font-size="19" font-weight="750" fill="#f1f5f9">healthfy</text>
  <text x="24" y="162" font-size="12" fill="#94a3b8">AI-assisted healthcare companion for symptom</text>
  <text x="24" y="179" font-size="12" fill="#94a3b8">guidance, wellness tracking and health resources.</text>

  <g font-size="10.5" fill="#cbd5e1">
    <rect x="24" y="192" width="62" height="20" rx="10" fill="#e2e8f0" fill-opacity=".06" stroke="#94a3b8" stroke-opacity=".4"/>
    <circle cx="36" cy="202" r="2.4" fill="#e2e8f0"/><text x="44" y="206">Next.js</text>
    <rect x="94" y="192" width="82" height="20" rx="10" fill="#3178c6" fill-opacity=".08" stroke="#3178c6" stroke-opacity=".4"/>
    <circle cx="106" cy="202" r="2.4" fill="#3178c6"/><text x="114" y="206">TypeScript</text>
    <rect x="184" y="192" width="64" height="20" rx="10" fill="#ffd43b" fill-opacity=".08" stroke="#ffd43b" stroke-opacity=".35"/>
    <circle cx="196" cy="202" r="2.4" fill="#ffd43b"/><text x="204" y="206">Python</text>
  </g>

  <circle cx="404" cy="202" r="14" fill="none" stroke="#334155" stroke-width="1.2"/>
  <text x="404" y="207" text-anchor="middle" font-size="12" fill="#94a3b8">&#8599;</text>
</svg>
