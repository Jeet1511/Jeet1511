<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 64" width="890" height="64" role="img" aria-label="Featured Projects">
  <defs>
    <linearGradient id="hpbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#070a1c"/>
    </linearGradient>
    <linearGradient id="hpline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .mono{font-family:'Cascadia Code','Fira Code',Consolas,monospace}
      .scan{animation:scanA 5s linear infinite}
      @keyframes scanA{0%{transform:translateX(0);opacity:0}8%{opacity:1}60%{transform:translateX(600px);opacity:1}70%{opacity:0}100%{transform:translateX(600px);opacity:0}}
    </style>
  </defs>
  <rect x="4" y="10" width="882" height="44" rx="12" fill="url(#hpbg)" stroke="#1b2340"/>
  <rect x="24" y="30" width="120" height="2" fill="url(#hpline)"/>
  <rect class="scan" x="24" y="29" width="26" height="4" fill="#67e8f9" opacity=".8"/>
  <text x="28" y="26" class="mono" font-size="11" letter-spacing="3" fill="#475569">04</text>
  <text x="170" y="41" font-size="17" font-weight="750" fill="#e2e8f0">FEATURED <tspan fill="#22d3ee">PROJECTS</tspan></text>
  <text x="862" y="41" text-anchor="end" class="mono" font-size="11" fill="#475569">github.com/JEET1511 &#8599;</text>
</svg>
