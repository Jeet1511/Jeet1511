<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 280" width="890" height="280" role="img" aria-label="About Jeet Mondal">
  <defs>
    <radialGradient id="mesh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.10"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#9BC4FF" stop-opacity="0.04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="3"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="280"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.22,.61,.36,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.26s}.d3{animation-delay:.42s}.d4{animation-delay:.58s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .mesh{animation:mx 24s ease-in-out infinite alternate}
    @keyframes mx{from{opacity:.6;transform:translate(0,0)}to{opacity:1;transform:translate(14px,-8px)}}
    .sw{animation:sw 19s ease-in-out 1.6s forwards}
    @keyframes sw{0%{transform:translateX(-360px) skewX(-12deg)}60%{transform:translateX(1200px) skewX(-12deg)}100%{transform:translateX(1200px) skewX(-12deg)}}
    .sig{animation:sig 6s ease-in-out infinite alternate}
    @keyframes sig{from{opacity:.7}to{opacity:1}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="890" height="280" fill="#06070B"/>
    <circle class="mesh" cx="720" cy="140" r="240" fill="url(#mesh)"/>
    <text x="826" y="184" text-anchor="end" font-size="140" font-weight="700" fill="#0E1016" opacity="0.6" letter-spacing="-4">02</text>
    <g class="rise d1">
      <rect x="64" y="48" width="22" height="2" fill="#4EA7FF"/>
      <text x="94" y="56" font-size="11" letter-spacing="3" fill="#9BA3B4">ABOUT</text>
    </g>
    <g class="rise d2">
      <text x="62" y="120" font-size="30" font-weight="500" letter-spacing="-.4" fill="#F4F6FB">I'm Jeet &#8212; a full stack developer &amp; AI engineer</text>
      <text x="62" y="158" font-size="30" font-weight="500" letter-spacing="-.4" fill="#F4F6FB">who cares how software feels, not just how it works.</text>
    </g>
    <g class="rise d3">
      <text x="64" y="200" font-size="15" fill="#9BA3B4">Building AI-powered products with craft, restraint, and intent.</text>
      <text x="64" y="223" font-size="13" fill="#5C6473">Bachelor of Computer Applications &#183; 2023 &#8212; 2027</text>
    </g>
    <g class="rise d4">
      <line x1="64" y1="250" x2="96" y2="250" stroke="#4EA7FF" stroke-width="1.5"/>
      <text x="104" y="254" font-size="13" fill="#9BA3B4" class="sig">Jeet Mondal</text>
    </g>
    <rect class="sw" x="-220" y="0" width="170" height="280" fill="url(#sweep)"/>
  </g>
  <rect width="890" height="280" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
