<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230" role="img" aria-label="ExpressBasket">
  <style>svg:hover{transform:scale(1.05);filter:drop-shadow(0 0 15px rgba(212,175,55,0.6));transition:transform .3s ease,filter .3s ease}</style>
  <defs>
    <linearGradient id="ebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#070a1c"/>
    </linearGradient>
    <radialGradient id="escene" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#10b981" stop-opacity=".22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="eglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eclip"><rect x="4" y="4" width="432" height="222" rx="18"/></clipPath>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .fl{animation:flA 4s ease-in-out infinite}
      @keyframes flA{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .cart{animation:cartA 3.4s ease-in-out infinite}
      @keyframes cartA{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
      .tw{animation:twA 2.4s ease-in-out infinite}
      @keyframes twA{0%,100%{opacity:.15}50%{opacity:1}}
    </style>
  </defs>

  <rect x="4" y="4" width="432" height="222" rx="18" fill="url(#ebg)" stroke="#1b2340"/>
  <g clip-path="url(#eclip)">
    <rect x="4" y="4" width="432" height="104" fill="url(#escene)"/>
    <circle class="tw" cx="60" cy="30" r="1.5" fill="#a7f3d0"/>
    <circle class="tw" cx="120" cy="66" r="1.3" fill="#a7f3d0" style="animation-delay:-.8s"/>
    <circle class="tw" cx="330" cy="26" r="1.5" fill="#a7f3d0" style="animation-delay:-1.4s"/>
    <circle class="tw" cx="386" cy="70" r="1.3" fill="#a7f3d0" style="animation-delay:-.4s"/>

    <!-- floating produce -->
    <circle class="fl" cx="150" cy="42" r="5" fill="#f97316" filter="url(#eglow)"/>
    <circle class="fl" cx="262" cy="30" r="4.4" fill="#84cc16" style="animation-delay:-1.2s"/>
    <circle class="fl" cx="292" cy="62" r="4.8" fill="#fbbf24" style="animation-delay:-2.2s"/>
    <circle class="fl" cx="128" cy="70" r="3.8" fill="#34d399" style="animation-delay:-.7s"/>

    <!-- cart -->
    <g class="cart">
      <path d="M186,40 L196,46 L204,84 L248,84 L256,52 L198,52" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="206" y1="62" x2="250" y2="62" stroke="#34d399" stroke-width="1.2" stroke-opacity=".5"/>
      <line x1="208" y1="72" x2="246" y2="72" stroke="#34d399" stroke-width="1.2" stroke-opacity=".5"/>
      <circle cx="210" cy="92" r="4" fill="#0a0f24" stroke="#34d399" stroke-width="1.8"/>
      <circle cx="242" cy="92" r="4" fill="#0a0f24" stroke="#34d399" stroke-width="1.8"/>
    </g>
    <path d="M168,88 h10 M160,94 h10" stroke="#34d399" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>

    <!-- status badge -->
    <rect x="318" y="18" width="104" height="24" rx="12" fill="#022c22" fill-opacity=".85" stroke="#34d399" stroke-opacity=".55"/>
    <circle cx="334" cy="30" r="3" fill="#34d399"/>
    <text x="344" y="34" font-size="10.5" font-weight="600" fill="#6ee7b7">COMPLETED</text>
  </g>
  <line x1="4" y1="108" x2="436" y2="108" stroke="#1b2340" stroke-width="1"/>

  <text x="24" y="140" font-size="19" font-weight="750" fill="#f1f5f9">ExpressBasket</text>
  <text x="24" y="162" font-size="12" fill="#94a3b8">Modern grocery delivery platform with seamless</text>
  <text x="24" y="179" font-size="12" fill="#94a3b8">shopping cart, ordering and order management.</text>

  <g font-size="10.5" fill="#cbd5e1">
    <rect x="24" y="192" width="58" height="20" rx="10" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-opacity=".35"/>
    <circle cx="36" cy="202" r="2.4" fill="#38bdf8"/><text x="44" y="206">React</text>
    <rect x="90" y="192" width="66" height="20" rx="10" fill="#6cc24a" fill-opacity=".08" stroke="#6cc24a" stroke-opacity=".35"/>
    <circle cx="102" cy="202" r="2.4" fill="#6cc24a"/><text x="110" y="206">Node.js</text>
    <rect x="164" y="192" width="76" height="20" rx="10" fill="#47a248" fill-opacity=".08" stroke="#47a248" stroke-opacity=".35"/>
    <circle cx="176" cy="202" r="2.4" fill="#47a248"/><text x="184" y="206">MongoDB</text>
  </g>

  <circle cx="404" cy="202" r="14" fill="none" stroke="#334155" stroke-width="1.2"/>
  <text x="404" y="207" text-anchor="middle" font-size="12" fill="#94a3b8">&#8599;</text>
</svg>
