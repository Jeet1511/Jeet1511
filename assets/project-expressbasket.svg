<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" overflow="hidden" role="img" aria-label="Project: ExpressBasket">
  <defs>
    <linearGradient id="p3Gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="p3Shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="p3Clip"><rect x="0" y="0" width="400" height="200" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#p3Clip)">
    <rect x="1" y="1" width="398" height="198" rx="12" fill="#1E1F22" stroke="#36373B" stroke-width="2"/>
    <rect x="1" y="1" width="398" height="198" rx="12" fill="none" stroke="#D4AF37" stroke-width="1.2">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <!-- ambient gold fx -->
    <g fill="#FFE9A0">
      <circle cx="322" r="1.2" cy="205"><animate attributeName="cy" values="205;-5" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.45;0" keyTimes="0;0.12;0.85;1" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="356" r="1" cy="205" fill="#D4AF37"><animate attributeName="cy" values="205;-5" dur="13s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.4;0" keyTimes="0;0.12;0.85;1" dur="13s" begin="-5s" repeatCount="indefinite"/></circle>
      <circle cx="380" r="1.3" cy="205"><animate attributeName="cy" values="205;-5" dur="11.5s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.45;0" keyTimes="0;0.12;0.85;1" dur="11.5s" begin="-2.5s" repeatCount="indefinite"/></circle>
      <g transform="translate(334,58)"><path d="M0,-2.6 L0.7,-0.7 L2.6,0 L0.7,0.7 L0,2.6 L-0.7,0.7 L-2.6,0 L-0.7,-0.7 Z"/><animate attributeName="opacity" values="0;0.6;0" dur="3.4s" repeatCount="indefinite"/></g>
      <g transform="translate(372,96)"><path d="M0,-2.6 L0.7,-0.7 L2.6,0 L0.7,0.7 L0,2.6 L-0.7,0.7 L-2.6,0 L-0.7,-0.7 Z"/><animate attributeName="opacity" values="0;0.55;0" dur="4.3s" begin="-1.9s" repeatCount="indefinite"/></g>
      <g transform="translate(306,148)"><path d="M0,-2.6 L0.7,-0.7 L2.6,0 L0.7,0.7 L0,2.6 L-0.7,0.7 L-2.6,0 L-0.7,-0.7 Z"/><animate attributeName="opacity" values="0;0.5;0" dur="3.7s" begin="-2.6s" repeatCount="indefinite"/></g>
    </g>
    <rect x="1" y="1" width="398" height="30" fill="#0A0A0B"/>
    <circle cx="20" cy="16" r="4" fill="#FF5F56"/><circle cx="34" cy="16" r="4" fill="#FFBD2E"/><circle cx="48" cy="16" r="4" fill="#27C93F"/>
    <text x="390" y="20" font-family="Consolas, monospace" font-size="10" fill="#6E6F74" text-anchor="end">~/projects/expressbasket</text>

    <!-- icon : shopping cart rolling -->
    <g transform="translate(44, 92)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="-3 0; 3 0; -3 0" dur="2.6s" repeatCount="indefinite"/>
        <path d="M-24,-20 L-16,-20 L-10,8 L16,8 L22,-10 L-13,-10" fill="none" stroke="#D4AF37" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-6" cy="17" r="4.5" fill="none" stroke="#FFD700" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" values="0 -6 17; 360 -6 17" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="12" cy="17" r="4.5" fill="none" stroke="#FFD700" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" values="0 12 17; 360 12 17" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <line x1="-9" y1="17" x2="-3" y2="17" stroke="#FFD700" stroke-width="2" opacity="0"/>
        <rect x="-8" y="-18" width="7" height="7" rx="1" fill="#61DAFB" opacity="0.9">
          <animate attributeName="y" values="-30;-18" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9" dur="1.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="3" y="-18" width="7" height="7" rx="1" fill="#47A248" opacity="0.9">
          <animate attributeName="y" values="-32;-18" dur="1.4s" begin="0.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.9;0.9" dur="1.4s" begin="0.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <text x="92" y="66" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="21" fill="url(#p3Gold)">EXPRESSBASKET</text>
    <text x="92" y="90" font-family="Consolas, monospace" font-size="11" fill="#E8E8E8">Full-stack e-commerce engine — carts,</text>
    <text x="92" y="106" font-family="Consolas, monospace" font-size="11" fill="#E8E8E8">payments &amp; orders at express speed.</text>

    <!-- tech tags -->
    <g font-family="Consolas, monospace" font-size="10" text-anchor="middle">
      <rect x="92" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#339933" stroke-width="1"/><text x="123" y="136" fill="#339933">Express</text>
      <rect x="162" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#47A248" stroke-width="1"/><text x="193" y="136" fill="#47A248">Mongo</text>
      <rect x="232" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#F7DF1E" stroke-width="1"/><text x="263" y="136" fill="#F7DF1E">JS</text>
    </g>

    <!-- footer -->
    <line x1="16" y1="158" x2="384" y2="158" stroke="#36373B" stroke-width="1"/>
    <text x="20" y="180" font-family="Consolas, monospace" font-size="10" fill="#6E6F74">$ checkout --fast <tspan fill="#FFD700">█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan></text>
    <text x="384" y="180" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="10" fill="#D4AF37" text-anchor="end">VIEW REPO →</text>

    <!-- shine sweep (clipped) -->
    <rect x="-140" y="0" width="70" height="200" fill="url(#p3Shine)" transform="skewX(-18)">
      <animate attributeName="x" values="-205;875" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
