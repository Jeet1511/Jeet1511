  </g>
  <polygon points="178,155 149,205 91,205 62,155 91,105 149,105" fill="url(#avG)" stroke="#22d3ee" stroke-opacity=".7" stroke-width="1.4" filter="url(#glow2)"/>
  <text x="120" y="174" text-anchor="middle" font-size="46" font-weight="800" fill="#f8fafc">J</text>

  <!-- name + role -->
  <text x="210" y="118" font-size="30" font-weight="750" fill="#f8fafc">Jeet Mondal</text>
  <text x="212" y="142" class="mono" font-size="13" fill="#22d3ee">@JEET1511</text>
  <text x="210" y="166" font-size="13.5" fill="#94a3b8">Student &#8226; Full Stack Developer &#8226; AI Engineer</text>

  <!-- details grid -->
