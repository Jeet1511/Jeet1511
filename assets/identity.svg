    <path d="M120 0C53.7 0 0 53.7 0 120c0 53 34.4 98 82 113.8 6 1.2 8.2-2.6 8.2-5.8 0-2.8-.1-12.2-.2-22.2-33.4 7.2-40.4-14.2-40.4-14.2-5.4-13.8-13.3-17.5-13.3-17.5-10.8-7.4.8-7.2.8-7.2 12 .8 18.4 12.4 18.4 12.4 10.7 18.3 28 13 34.8 9.9 1-7.7 4.1-13 7.6-16-26.6-3-54.6-13.3-54.6-59.2 0-13.1 4.7-23.8 12.3-32.2-1.2-3-5.3-15.2 1.2-31.7 0 0 10-3.2 32.9 12.3a114 114 0 0 1 59.8 0c22.8-15.5 32.8-12.3 32.8-12.3 6.5 16.5 2.4 28.7 1.2 31.7 7.7 8.4 12.3 19.1 12.3 32.2 0 46-28.1 56.1-54.8 59.1 4.3 3.7 8.1 11 8.1 22.2 0 16-.2 29-.2 33 0 3.2 2.2 7 8.3 5.8A120.2 120.2 0 0 0 240 120C240 53.7 186.3 0 120 0z"/>
