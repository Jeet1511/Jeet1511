<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 280" width="890" height="280" role="img" aria-label="Jeet Mondal - Identity">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#070a1c"/>
    </linearGradient>
    <linearGradient id="avG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset=".5" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="halo2" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .mono{font-family:'Cascadia Code','Fira Code',Consolas,monospace}
      @keyframes sp{to{transform:rotate(360deg)}}
      .tw2{animation:twa 2.4s ease-in-out infinite}
      @keyframes twa{0%,100%{opacity:.15}50%{opacity:1}}
      .blink{animation:blk 1.6s ease-in-out infinite}
      @keyframes blk{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>

  <rect x="4" y="4" width="882" height="272" rx="20" fill="url(#pbg)" stroke="#1b2340"/>

