<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" overflow="hidden">
  <defs>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#36373B"/>
      <stop offset="100%" stop-color="#1E1F22"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2B2E"/>
      <stop offset="50%" stop-color="#4a4d56"/>
      <stop offset="100%" stop-color="#1A1B1F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#C5A028"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="50" y="140" width="300" height="380" rx="12"/></clipPath>
    <clipPath id="faceCrop"><circle cx="200" cy="220" r="80"/></clipPath>
    <filter id="goldGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <g transform="translate(200, 0)">
    <!-- Phase 2: Infinite Sway -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 0 0; 2 0 0; -2 0 0" keyTimes="0; 0.5; 1" dur="4s" begin="2.1s" repeatCount="indefinite"/>
      <!-- Phase 1: Drop & Swing -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -20 0 0; 15 0 0; -10 0 0; 5 0 0; 0 0 0" keyTimes="0; 0.15; 0.3; 0.5; 0.7; 1" dur="2.1s" fill="freeze"/>
        <!-- Gravity Drop -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -400; 0 0" keyTimes="0; 1" calcMode="spline" keySplines="0.5 0 1 1" dur="0.3s" fill="freeze"/>

          <!-- Strap -->
          <rect x="-12" y="0" width="24" height="140" rx="4" fill="url(#strapGrad)"/>
          <!-- Stitched text on strap -->
          <text x="0" y="70" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#D4AF37" opacity="0.5" transform="rotate(90 0 70)">JEET1511</text>

          <!-- Clasp -->
          <rect x="-18" y="130" width="36" height="16" rx="3" fill="#36373B" stroke="#D4AF37" stroke-width="1"/>

          <!-- Metal Ring -->
          <circle cx="0" cy="140" r="15" fill="none" stroke="#36373B" stroke-width="4"/>

          <!-- Card content -->
          <g transform="translate(-150, 140)">
            <!-- Card Base -->
            <rect x="0" y="0" width="300" height="380" rx="12" fill="#1E1F22" stroke="#D4AF37" stroke-width="2"/>
            <!-- Raised surface -->
            <rect x="10" y="10" width="280" height="360" rx="8" fill="url(#metalGrad)" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.5"/>

            <!-- Holographic Shine (clipped to card) -->
            <g clip-path="url(#cardClip)">
              <rect x="-250" y="-50" width="100" height="500" fill="url(#shineGrad)" transform="skewX(-20)">
                <animateTransform attributeName="transform" type="translate" from="-250 0" to="350 0" dur="4s" repeatCount="indefinite"/>
              </rect>
            </g>

            <!-- Avatar Face Crop -->
            <image href="assets/id-pfp.png" x="0" y="0" width="300" height="300" clip-path="url(#faceCrop)" preserveAspectRatio="xMidYMid slice"/>

            <!-- Glowing Avatar Ring -->
            <circle cx="150" cy="80" r="85" fill="none" stroke="#D4AF37" stroke-width="2" filter="url(#goldGlow)">
              <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
            </circle>

            <!-- Targeting Brackets -->
            <path d="M60,10 L60,0 L70,0 M230,0 L240,0 L240,10 M60,150 L60,160 L70,160 M230,160 L240,160 L240,150" stroke="#D4AF37" stroke-width="2" fill="none"/>

            <!-- Holographic Seal -->
            <g transform="translate(230, 130)">
              <polygon points="0,-18 5,-15 12,-16 15,-10 20,-6 17,0 20,6 15,10 12,16 5,15 0,18 -5,15 -12,16 -15,10 -20,6 -17,0 -20,-6 -15,-10 -12,-16 -5,-15" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.7">
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
              </polygon>
              <circle r="10" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5">
                <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
              </circle>
              <circle r="4" fill="#D4AF37" opacity="0.6"/>
            </g>

            <!-- Name -->
            <text x="150" y="200" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#E0E0E0" font-weight="bold" letter-spacing="2">JEET MONDAL</text>
            <!-- Title -->
            <text x="150" y="230" text-anchor="middle" font-size="13" fill="#D4AF37" letter-spacing="3">FULL STACK ARCHITECT</text>
            <!-- Handle -->
            <text x="150" y="250" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#888888">@jeet1511</text>

            <!-- CLEARANCE: OMEGA with glitch -->
            <text x="30" y="290" font-family="'Courier New', monospace" font-size="11" fill="#D4AF37" font-weight="bold" letter-spacing="2">
              CLEARANCE: OMEGA
              <animate attributeName="x" values="30;32;29;30;30;31;30" keyTimes="0;0.1;0.2;0.3;0.6;0.8;1" dur="2.5s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="1;0.7;1;0.9;1" dur="0.3s" repeatCount="indefinite"/>
            </text>

            <!-- Barcode -->
            <g transform="translate(170, 270)">
              <rect x="0" y="0" width="2" height="20" fill="#E0E0E0"/>
              <rect x="4" y="0" width="3" height="20" fill="#E0E0E0"/>
              <rect x="9" y="0" width="1" height="20" fill="#E0E0E0"/>
              <rect x="12" y="0" width="4" height="20" fill="#E0E0E0"/>
              <rect x="18" y="0" width="2" height="20" fill="#E0E0E0"/>
              <rect x="22" y="0" width="1" height="20" fill="#E0E0E0"/>
              <rect x="25" y="0" width="3" height="20" fill="#E0E0E0"/>
              <rect x="30" y="0" width="2" height="20" fill="#E0E0E0"/>
              <rect x="34" y="0" width="4" height="20" fill="#E0E0E0"/>
              <rect x="40" y="0" width="1" height="20" fill="#E0E0E0"/>
              <rect x="43" y="0" width="3" height="20" fill="#E0E0E0"/>
              <rect x="48" y="0" width="2" height="20" fill="#E0E0E0"/>
              <rect x="52" y="0" width="1" height="20" fill="#E0E0E0"/>
              <rect x="55" y="0" width="4" height="20" fill="#E0E0E0"/>
              <rect x="61" y="0" width="2" height="20" fill="#E0E0E0"/>
              <rect x="65" y="0" width="3" height="20" fill="#E0E0E0"/>
              <rect x="70" y="0" width="1" height="20" fill="#E0E0E0"/>
              <rect x="73" y="0" width="2" height="20" fill="#E0E0E0"/>
              <rect x="77" y="0" width="4" height="20" fill="#E0E0E0"/>
              <rect x="83" y="0" width="1" height="20" fill="#E0E0E0"/>
              <rect x="86" y="0" width="3" height="20" fill="#E0E0E0"/>
              <rect x="91" y="0" width="2" height="20" fill="#E0E0E0"/>
              <rect x="95" y="0" width="1" height="20" fill="#E0E0E0"/>
              <rect x="98" y="0" width="4" height="20" fill="#E0E0E0"/>
              <rect x="104" y="0" width="2" height="20" fill="#E0E0E0"/>
              <rect x="108" y="0" width="3" height="20" fill="#E0E0E0"/>
              <rect x="113" y="0" width="1" height="20" fill="#E0E0E0"/>
              <rect x="116" y="0" width="2" height="20" fill="#E0E0E0"/>
              <rect x="120" y="0" width="4" height="20" fill="#E0E0E0"/>
            </g>

            <!-- Edge glow pulse -->
            <rect x="0" y="0" width="300" height="380" rx="12" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3">
              <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
            </rect>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
