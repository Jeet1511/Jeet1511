<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 600" width="400" height="600" overflow="hidden" role="img" aria-label="Jeet Mondal workshop ID badge">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1F22"/>
      <stop offset="30%" stop-color="#36373B"/>
      <stop offset="50%" stop-color="#4A4B50"/>
      <stop offset="70%" stop-color="#36373B"/>
      <stop offset="100%" stop-color="#1E1F22"/>
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="45%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="holoShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#FFF3B0" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2B2F"/>
      <stop offset="12%" stop-color="#1E1F22"/>
      <stop offset="100%" stop-color="#141517"/>
    </linearGradient>
    <filter id="badgeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- clips (anti-bleed) -->
    <clipPath id="faceCrop"><circle cx="0" cy="220" r="80"/></clipPath>
    <clipPath id="cardClip"><rect x="-150" y="140" width="300" height="380" rx="12"/></clipPath>
  </defs>

  <!-- ================= PHYSICS RIG (exact nested structure) ================= -->
  <g transform="translate(200, 0)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 0 0; 2 0 0; -2 0 0" keyTimes="0; 0.5; 1" dur="4s" begin="2.1s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -20 0 0; 15 0 0; -10 0 0; 5 0 0; 0 0 0" keyTimes="0; 0.15; 0.3; 0.5; 0.7; 1" dur="2.1s" fill="freeze"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -400; 0 0" keyTimes="0; 1" calcMode="spline" keySplines="0.5 0 1 1" dur="0.3s" fill="freeze"/>

          <!-- ============ STRAP (y=0 to 120) ============ -->
          <rect x="-24" y="-8" width="48" height="128" rx="4" fill="url(#strapGrad)"/>
          <line x1="-17" y1="-4" x2="-17" y2="116" stroke="#0A0A0B" stroke-width="1.4" stroke-dasharray="4 3"/>
          <line x1="17" y1="-4" x2="17" y2="116" stroke="#0A0A0B" stroke-width="1.4" stroke-dasharray="4 3"/>
          <text x="8" y="0" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="9" fill="#D4AF37" letter-spacing="3" transform="rotate(90)" opacity="0.9">FORGE • DEV</text>

          <!-- ============ CLASP + METAL RING ============ -->
          <rect x="-15" y="94" width="30" height="18" rx="3" fill="url(#strapGrad)" stroke="#0A0A0B" stroke-width="1"/>
          <rect x="-9" y="99" width="18" height="3" rx="1.5" fill="#D4AF37" opacity="0.8"/>
          <circle cx="0" cy="120" r="15" fill="none" stroke="#36373B" stroke-width="4"/>
          <circle cx="0" cy="120" r="15" fill="none" stroke="#4A4B50" stroke-width="1.4" stroke-dasharray="6 5"/>

          <!-- ============ CARD BASE ============ -->
          <rect x="-150" y="140" width="300" height="380" rx="12" fill="#1E1F22" stroke="#D4AF37" stroke-width="1.6"/>
          <g clip-path="url(#cardClip)">
            <rect x="-150" y="140" width="300" height="380" fill="url(#cardSheen)"/>
            <!-- subtle inner grid -->
            <g stroke="#36373B" stroke-width="0.5" opacity="0.35">
              <line x1="-150" y1="310" x2="150" y2="310"/>
              <line x1="-150" y1="404" x2="150" y2="404"/>
            </g>

            <!-- ============ AVATAR FACE CROP ============ -->
            <circle cx="0" cy="220" r="84" fill="#0A0A0B"/>
            <image href="assets/id-card.png" x="-100" y="70" width="200" height="300" clip-path="url(#faceCrop)" preserveAspectRatio="xMidYMid slice"/>
            <!-- pulsing gold ring -->
            <circle cx="0" cy="220" r="82" fill="none" stroke="#D4AF37" stroke-width="2.5" filter="url(#badgeGlow)">
              <animate attributeName="stroke-width" values="2.5;4.5;2.5" dur="2.2s" repeatCount="indefinite"/>
              <animate attributeName="stroke" values="#D4AF37;#FFD700;#D4AF37" dur="2.2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="0" cy="220" r="92" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5" stroke-dasharray="10 8">
              <animateTransform attributeName="transform" type="rotate" values="0 0 220; 360 0 220" dur="14s" repeatCount="indefinite"/>
            </circle>
            <!-- targeting brackets -->
            <g stroke="#FFD700" stroke-width="2.5" fill="none" stroke-linecap="round">
              <path d="M-96,146 L-104,146 L-104,154"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/></path>
              <path d="M96,146 L104,146 L104,154"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" begin="0.45s" repeatCount="indefinite"/></path>
              <path d="M104,286 L104,294 L96,294"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></path>
              <path d="M-96,294 L-104,294 L-104,286"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" begin="1.35s" repeatCount="indefinite"/></path>
            </g>

            <!-- ============ IDENTITY TEXT ============ -->
            <text x="0" y="316" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="9" fill="#6E6F74" text-anchor="middle" letter-spacing="4">⬢ WORKSHOP ACCESS ⬢</text>
            <text x="0" y="340" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="27" fill="url(#badgeGold)" text-anchor="middle" letter-spacing="1">JEET MONDAL</text>
            <text x="0" y="370" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="13" fill="#E8E8E8" text-anchor="middle" letter-spacing="3">FULL STACK ARCHITECT</text>
            <text x="0" y="390" font-family="Consolas, monospace" font-size="13" fill="#6E6F74" text-anchor="middle">@jeet1511</text>

            <!-- ============ CLEARANCE (glitch) ============ -->
            <g font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="2">
              <text x="0" y="430" fill="#FF3B3B" opacity="0">CLEARANCE: OMEGA
                <animate attributeName="opacity" values="0;0;0.7;0;0;0.6;0;0" keyTimes="0;0.42;0.45;0.48;0.72;0.75;0.78;1" dur="3.4s" repeatCount="indefinite"/>
                <animate attributeName="x" values="0;-3;2;0" dur="0.24s" begin="1.4s;2.5s" repeatCount="1"/>
              </text>
              <text x="0" y="430" fill="#3BD0FF" opacity="0">CLEARANCE: OMEGA
                <animate attributeName="opacity" values="0;0;0.7;0;0;0.6;0;0" keyTimes="0;0.44;0.47;0.5;0.74;0.77;0.8;1" dur="3.4s" repeatCount="indefinite"/>
                <animate attributeName="x" values="0;3;-2;0" dur="0.24s" begin="1.45s;2.55s" repeatCount="1"/>
              </text>
              <text x="0" y="430" fill="#FFD700">CLEARANCE: OMEGA
                <animate attributeName="opacity" values="1;1;0.4;1;1;0.5;1;1" keyTimes="0;0.42;0.46;0.5;0.72;0.76;0.8;1" dur="3.4s" repeatCount="indefinite"/>
              </text>
            </g>
            <rect x="-92" y="440" width="184" height="1.4" fill="#36373B"/>

            <!-- ============ STAMPED BARCODE ============ -->
            <g fill="#6E6F74">
              <rect x="-90" y="456" width="4" height="36"/><rect x="-83" y="456" width="2" height="36"/>
              <rect x="-77" y="456" width="5" height="36"/><rect x="-69" y="456" width="2" height="36"/>
              <rect x="-63" y="456" width="3" height="36"/><rect x="-56" y="456" width="6" height="36"/>
              <rect x="-47" y="456" width="2" height="36"/><rect x="-42" y="456" width="4" height="36"/>
              <rect x="-35" y="456" width="2" height="36"/><rect x="-30" y="456" width="5" height="36"/>
              <rect x="-22" y="456" width="3" height="36"/><rect x="-16" y="456" width="2" height="36"/>
              <rect x="-11" y="456" width="6" height="36"/><rect x="-2" y="456" width="2" height="36"/>
              <rect x="3" y="456" width="4" height="36"/><rect x="10" y="456" width="2" height="36"/>
              <rect x="15" y="456" width="5" height="36"/><rect x="23" y="456" width="3" height="36"/>
              <rect x="29" y="456" width="2" height="36"/><rect x="34" y="456" width="6" height="36"/>
              <rect x="43" y="456" width="2" height="36"/><rect x="48" y="456" width="4" height="36"/>
              <rect x="55" y="456" width="2" height="36"/><rect x="60" y="456" width="5" height="36"/>
              <rect x="68" y="456" width="3" height="36"/><rect x="74" y="456" width="2" height="36"/>
              <rect x="79" y="456" width="6" height="36"/><rect x="88" y="456" width="2" height="36"/>
            </g>
            <text x="0" y="506" font-family="Consolas, monospace" font-size="9" fill="#6E6F74" text-anchor="middle" letter-spacing="4">ID-1511-MERN-OMEGA</text>

            <!-- ============ HOLOGRAPHIC SHINE (clipped to card) ============ -->
            <rect x="-320" y="120" width="90" height="420" fill="url(#holoShine)" transform="skewX(-18)">
              <animate attributeName="x" values="-320;260" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
            </rect>
          </g>


        </g>
      </g>
    </g>
  </g>
</svg>
