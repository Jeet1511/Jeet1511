<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" overflow="hidden">
  <defs>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2B2E"/>
      <stop offset="50%" stop-color="#4a4d56"/>
      <stop offset="100%" stop-color="#1A1B1F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#C5A028"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="50" y="120" width="300" height="400" rx="12"/></clipPath>
    <clipPath id="faceCrop"><circle cx="200" cy="200" r="80"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="#0A0A0B"/>

  <!-- Physics animation nested structure -->
  <g transform="translate(200, 0)">
    <!-- Drop animation (outermost) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -600; 0 0" keyTimes="0; 1" calcMode="spline" keySplines="0.25 0.1 0.25 1" dur="0.8s" fill="freeze"/>

      <!-- STRAP — stays fixed, outside rotate group -->
      <rect x="-10" y="0" width="20" height="120" fill="#0A0A0B"/>
      <circle cx="0" cy="120" r="15" fill="none" stroke="#36373B" stroke-width="4"/>

      <!-- CARD — has its own rotate group -->
      <g transform="translate(200, 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-2 0 0; 2 0 0; -2 0 0" keyTimes="0; 0.5; 1" dur="4s" begin="0.8s" repeatCount="indefinite"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="0 0 0; -20 0 0; 15 0 0; -10 0 0; 5 0 0; 0 0 0" keyTimes="0; 0.15; 0.3; 0.5; 0.7; 1" dur="2.1s" fill="freeze"/>
            <g transform="translate(-200, 0)">

              <!-- Card Base at translate(-150, 120) -->
              <g transform="translate(-150, 120)">
                <rect x="0" y="0" width="300" height="400" rx="12" fill="#1E1F22" stroke="#D4AF37" stroke-width="2"/>
                <rect x="10" y="10" width="280" height="380" rx="8" fill="url(#metalGrad)" stroke="#D4AF37" stroke-width="1"/>

                <!-- Shine sweep clipped to card -->
                <g clip-path="url(#cardClip)">
                  <rect x="-250" y="-50" width="100" height="500" fill="url(#shineGrad)" transform="skewX(-20)">
                    <animateTransform attributeName="transform" type="translate" from="-250 0" to="350 0" dur="4s" repeatCount="indefinite"/>
                  </rect>
                </g>

                <!-- Hex bolts at corners -->
                <polygon points="20,20 26,17 32,20 32,26 26,29 20,26" fill="#36373B" stroke="#D4AF37" stroke-width="0.5"/>
                <polygon points="268,20 274,17 280,20 280,26 274,29 268,26" fill="#36373B" stroke="#D4AF37" stroke-width="0.5"/>
                <polygon points="20,374 26,371 32,374 32,380 26,383 20,380" fill="#36373B" stroke="#D4AF37" stroke-width="0.5"/>
                <polygon points="268,374 274,371 280,374 280,380 274,383 268,380" fill="#36373B" stroke="#D4AF37" stroke-width="0.5"/>

                <!-- Title -->
                <text x="150" y="45" text-anchor="middle" font-size="11" fill="#D4AF37" font-weight="bold" letter-spacing="3">TACTICAL DATA-SHARD</text>
                <line x1="30" y1="55" x2="270" y2="55" stroke="#36373B" stroke-width="1"/>

                <!-- AVATAR FACE CROP -->
                <image href="assets/id-pfp.png" x="0" y="20" width="300" height="300" clip-path="url(#faceCrop)" preserveAspectRatio="xMidYMid slice"/>

                <!-- Targeting brackets around face crop -->
                <path d="M70,10 L70,0 L80,0 M220,0 L230,0 L230,10 M70,150 L70,160 L80,160 M220,160 L230,160 L230,150" stroke="#D4AF37" stroke-width="2" fill="none"/>

                <!-- HUD aperture ring -->
                <circle cx="150" cy="80" r="85" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
                <circle cx="150" cy="80" r="90" fill="none" stroke="#36373B" stroke-width="1" stroke-dasharray="8 4">
                  <animateTransform attributeName="transform" type="rotate" from="0 150 80" to="360 150 80" dur="15s" repeatCount="indefinite"/>
                </circle>

                <!-- Name and title text -->
                <text x="150" y="310" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#E0E0E0" font-weight="bold" letter-spacing="2">JEET MONDAL</text>
                <text x="150" y="340" text-anchor="middle" font-size="13" fill="#D4AF37" letter-spacing="3">FULL STACK ARCHITECT</text>
                <text x="150" y="360" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#888888">@jeet1511</text>

                <!-- CLEARANCE: OMEGA with glitch -->
                <text x="40" y="400" font-family="'Courier New', monospace" font-size="11" fill="#D4AF37" font-weight="bold" letter-spacing="2">
                  CLEARANCE: OMEGA
                  <animate attributeName="x" values="40;42;39;40;40;41;40" keyTimes="0;0.1;0.2;0.3;0.6;0.8;1" dur="2.5s" repeatCount="indefinite"/>
                  <animate attributeName="opacity" values="1;0.7;1;0.9;1" dur="0.3s" repeatCount="indefinite"/>
                </text>

                <!-- Barcode -->
                <g transform="translate(180, 375)">
                  <rect x="0" y="0" width="2" height="20" fill="#E0E0E0"/>
                  <rect x="4" y="0" width="3" height="20" fill="#E0E0E0"/>
                  <rect x="9" y="0" width="1" height="20" fill="#E0E0E0"/>
                  <rect x="12" y="0" width="4" height="20" fill="#E0E0E0"/>
                  <rect x="18" y="0" width="2" height="20" fill="#E0E0E0"/>
                  <rect x="22" y="0" width="1" height="20" fill="#E0E0E0"/>
                  <rect x="25" y="0" width="3" height="20" fill="#E0E0E0"/>
                  <rect x="30" y="0" width="2" height="20" fill="#E0E0E0"/>
                  <rect x="34" y="0" width="4" height="20" fill="#E0E0E0"/>
                  <rect x="40" y="0" width="1" height="20" fill="#E0E0E0"/>
                  <rect x="43" y="0" width="3" height="20" fill="#E0E0E0"/>
                  <rect x="48" y="0" width="2" height="20" fill="#E0E0E0"/>
                  <rect x="52" y="0" width="1" height="20" fill="#E0E0E0"/>
                  <rect x="55" y="0" width="4" height="20" fill="#E0E0E0"/>
                  <rect x="61" y="0" width="2" height="20" fill="#E0E0E0"/>
                  <rect x="65" y="0" width="3" height="20" fill="#E0E0E0"/>
                  <rect x="70" y="0" width="1" height="20" fill="#E0E0E0"/>
                  <rect x="73" y="0" width="2" height="20" fill="#E0E0E0"/>
                  <rect x="77" y="0" width="4" height="20" fill="#E0E0E0"/>
                  <rect x="83" y="0" width="1" height="20" fill="#E0E0E0"/>
                  <rect x="86" y="0" width="3" height="20" fill="#E0E0E0"/>
                  <rect x="91" y="0" width="2" height="20" fill="#E0E0E0"/>
                  <rect x="95" y="0" width="1" height="20" fill="#E0E0E0"/>
                  <rect x="98" y="0" width="4" height="20" fill="#E0E0E0"/>
                  <rect x="104" y="0" width="2" height="20" fill="#E0E0E0"/>
                  <rect x="108" y="0" width="3" height="20" fill="#E0E0E0"/>
                  <rect x="113" y="0" width="1" height="20" fill="#E0E0E0"/>
                  <rect x="116" y="0" width="2" height="20" fill="#E0E0E0"/>
                  <rect x="120" y="0" width="4" height="20" fill="#E0E0E0"/>
                </g>

                <!-- Amber edge glow pulse -->
                <rect x="0" y="0" width="300" height="400" rx="12" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3">
                  <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
                </rect>
              </g>

            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
