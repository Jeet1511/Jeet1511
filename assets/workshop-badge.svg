<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="600" viewBox="0 0 400 600" overflow="hidden">
  <defs>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#36373B"/>
      <stop offset="100%" stop-color="#1E1F22"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2B2E"/>
      <stop offset="50%" stop-color="#4a4d56"/>
      <stop offset="100%" stop-color="#1A1B1F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="50" y="140" width="300" height="380" rx="12"/></clipPath>
    <clipPath id="faceCrop"><circle cx="200" cy="220" r="80"/></clipPath>
    <filter id="goldGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <g transform="translate(200, 0)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 0 0; 2 0 0; -2 0 0" keyTimes="0; 0.5; 1" dur="4s" begin="2.1s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -20 0 0; 15 0 0; -10 0 0; 5 0 0; 0 0 0" keyTimes="0; 0.15; 0.3; 0.5; 0.7; 1" dur="2.1s" fill="freeze"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 -400; 0 0" keyTimes="0; 1" calcMode="spline" keySplines="0.5 0 1 1" dur="0.3s" fill="freeze"/>

          <!-- Strap -->
          <rect x="-10" y="0" width="20" height="140" rx="4" fill="url(#strapGrad)"/>
          <text x="0" y="70" text-anchor="middle" font-family="'Courier New', monospace" font-size="6" fill="#D4AF37" opacity="0.6" transform="rotate(90 0 70)">JEET1511</text>

          <!-- Clasp -->
          <rect x="-18" y="128" width="36" height="14" rx="3" fill="#36373B" stroke="#D4AF37" stroke-width="1"/>

          <!-- Metal Ring -->
          <circle cx="0" cy="140" r="15" fill="none" stroke="#36373B" stroke-width="4"/>
          <animateTransform attributeName="transform" type="rotate" from="0 0 140" to="360 0 140" dur="20s" repeatCount="indefinite" additive="sum"/>

          <!-- Card content group -->
          <g transform="translate(-150, 140)">
            <!-- Card Base -->
            <rect x="0" y="0" width="300" height="380" rx="12" fill="#1E1F22" stroke="url(#goldGrad)" stroke-width="2"/>
            <!-- Raised inner surface -->
            <rect x="10" y="10" width="280" height="360" rx="8" fill="url(#metalGrad)" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.4"/>

            <!-- Holographic Shine -->
            <g clip-path="url(#cardClip)">
              <rect x="-100" y="-50" width="80" height="500" fill="url(#shineGrad)" transform="skewX(-20)">
                <animateTransform attributeName="transform" type="translate" from="-100 0" to="400 0" dur="4s" repeatCount="indefinite" additive="sum"/>
              </rect>
            </g>

            <!-- Hex bolts at corners -->
            <polygon points="20,20 26,17 32,20 32,26 26,29 20,26" fill="#36373B" stroke="#D4AF37" stroke-width="0.5"/>
            <polygon points="268,20 274,17 280,20 280,26 274,29 268,26" fill="#36373B" stroke="#D4AF37" stroke-width="0.5"/>
            <polygon points="20,354 26,351 32,354 32,360 26,363 20,360" fill="#36373B" stroke="#D4AF37" stroke-width="0.5"/>
            <polygon points="268,354 274,351 280,354 280,360 274,363 268,360" fill="#36373B" stroke="#D4AF37" stroke-width="0.5"/>

            <!-- Title -->
            <text x="150" y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#D4AF37" font-weight="bold" letter-spacing="3">TACTICAL DATA-SHARD</text>
            <line x1="30" y1="52" x2="270" y2="52" stroke="#36373B" stroke-width="1"/>

            <!-- Avatar Face Crop -->
            <image href="assets/id-pfp.png" x="0" y="0" width="300" height="300" clip-path="url(#faceCrop)" preserveAspectRatio="xMidYMid slice"/>

            <!-- Glowing Avatar Ring -->
            <circle cx="150" cy="80" r="85" fill="none" stroke="#D4AF37" stroke-width="2" filter="url(#goldGlow)">
              <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
            </circle>

            <!-- Rotating dashed ring -->
            <circle cx="150" cy="80" r="90" fill="none" stroke="#36373B" stroke-width="1" stroke-dasharray="8 4">
              <animateTransform attributeName="transform" type="rotate" from="0 150 80" to="360 150 80" dur="15s" repeatCount="indefinite"/>
            </circle>

            <!-- Targeting Brackets -->
            <path d="M65,10 L65,0 L75,0" fill="none" stroke="#D4AF37" stroke-width="2"/>
            <path d="M225,0 L235,0 L235,10" fill="none" stroke="#D4AF37" stroke-width="2"/>
            <path d="M65,150 L65,160 L75,160" fill="none" stroke="#D4AF37" stroke-width="2"/>
            <path d="M225,160 L235,160 L235,150" fill="none" stroke="#D4AF37" stroke-width="2"/>

            <!-- Holographic Seal -->
            <g transform="translate(230, 130)">
              <polygon points="0,-14 4,-12 10,-13 12,-7 16,-4 13,0 16,4 12,7 10,13 4,12 0,14 -4,12 -10,13 -12,7 -16,4 -13,0 -16,-4 -12,-7 -10,-13 -4,-12" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.7">
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
              </polygon>
              <circle r="8" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5">
                <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
              </circle>
              <circle r="3" fill="#D4AF37" opacity="0.8"/>
            </g>

            <!-- Name and title text -->
            <text x="150" y="200" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="22" fill="#FFF8DC" font-weight="900" letter-spacing="2">JEET MONDAL</text>
            <text x="150" y="230" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#D4AF37" letter-spacing="3">FULL STACK ARCHITECT</text>
            <text x="150" y="250" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#888888">@jeet1511</text>

            <!-- CLEARANCE: OMEGA with glitch -->
            <text x="30" y="290" font-family="'Courier New', monospace" font-size="10" fill="#D4AF37" font-weight="bold" letter-spacing="2">
              CLEARANCE: OMEGA
              <animate attributeName="x" values="30;32;29;30;30;31;30" keyTimes="0;0.1;0.2;0.3;0.6;0.8;1" dur="2.5s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="1;0.7;1;0.9;1" dur="0.3s" repeatCount="indefinite"/>
            </text>

            <!-- Barcode -->
            <g transform="translate(170, 270)">
              <rect x="0" y="0" width="2" height="20" fill="#FFF8DC"/>
              <rect x="4" y="0" width="3" height="20" fill="#FFF8DC"/>
              <rect x="9" y="0" width="1" height="20" fill="#FFF8DC"/>
              <rect x="12" y="0" width="4" height="20" fill="#FFF8DC"/>
              <rect x="18" y="0" width="2" height="20" fill="#FFF8DC"/>
              <rect x="22" y="0" width="1" height="20" fill="#FFF8DC"/>
              <rect x="25" y="0" width="3" height="20" fill="#FFF8DC"/>
              <rect x="30" y="0" width="2" height="20" fill="#FFF8DC"/>
              <rect x="34" y="0" width="4" height="20" fill="#FFF8DC"/>
              <rect x="40" y="0" width="1" height="20" fill="#FFF8DC"/>
              <rect x="43" y="0" width="3" height="20" fill="#FFF8DC"/>
              <rect x="48" y="0" width="2" height="20" fill="#FFF8DC"/>
              <rect x="52" y="0" width="1" height="20" fill="#FFF8DC"/>
              <rect x="55" y="0" width="4" height="20" fill="#FFF8DC"/>
              <rect x="61" y="0" width="2" height="20" fill="#FFF8DC"/>
              <rect x="65" y="0" width="3" height="20" fill="#FFF8DC"/>
              <rect x="70" y="0" width="1" height="20" fill="#FFF8DC"/>
              <rect x="73" y="0" width="2" height="20" fill="#FFF8DC"/>
              <rect x="77" y="0" width="4" height="20" fill="#FFF8DC"/>
              <rect x="83" y="0" width="1" height="20" fill="#FFF8DC"/>
              <rect x="86" y="0" width="3" height="20" fill="#FFF8DC"/>
              <rect x="91" y="0" width="2" height="20" fill="#FFF8DC"/>
              <rect x="95" y="0" width="1" height="20" fill="#FFF8DC"/>
              <rect x="98" y="0" width="4" height="20" fill="#FFF8DC"/>
              <rect x="104" y="0" width="2" height="20" fill="#FFF8DC"/>
              <rect x="108" y="0" width="3" height="20" fill="#FFF8DC"/>
              <rect x="113" y="0" width="1" height="20" fill="#FFF8DC"/>
              <rect x="116" y="0" width="2" height="20" fill="#FFF8DC"/>
              <rect x="120" y="0" width="4" height="20" fill="#FFF8DC"/>
            </g>

            <!-- Edge glow pulse -->
            <rect x="0" y="0" width="300" height="380" rx="12" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3">
              <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
            </rect>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
