<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" overflow="hidden">
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family: 'Segoe UI', system-ui, Arial, sans-serif; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinR { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
      .ring1 { transform-origin: 300px 200px; animation: spin 20s linear infinite; }
      .ring2 { transform-origin: 300px 200px; animation: spinR 30s linear infinite; }
      .ring3 { transform-origin: 300px 200px; animation: spin 40s linear infinite; }
      .core-pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 300px 200px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#0A0A0B" rx="16"/>

  <!-- Header -->
  <text x="24" y="30" font-family="'Courier New', monospace" font-size="11" fill="#36373B" letter-spacing="3">03 · TECH STACK</text>
  <text x="576" y="30" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#36373B">7 tools in orbit</text>

  <!-- Core Glow -->
  <circle cx="300" cy="200" r="120" fill="url(#coreGlow)"/>

  <!-- Orbital Rings -->
  <circle cx="300" cy="200" r="70" fill="none" stroke="#36373B" stroke-width="1" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="300" cy="200" r="110" fill="none" stroke="#1E1F22" stroke-width="1" stroke-dasharray="3 8" opacity="0.5"/>
  <circle cx="300" cy="200" r="155" fill="none" stroke="#36373B" stroke-width="1" stroke-dasharray="5 5" opacity="0.4"/>

  <!-- Inner Ring (CW, r=70) — React, Python, Java -->
  <g class="ring1">
    <!-- React at 0° -->
    <g transform="translate(370, 200)">
      <circle r="20" fill="#1E1F22" stroke="#61DAFB" stroke-width="1.5" filter="url(#nodeGlow)"/>
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#61DAFB" stroke-width="1"/>
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#61DAFB" stroke-width="1" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="10" ry="4" fill="none" stroke="#61DAFB" stroke-width="1" transform="rotate(120)"/>
      <circle r="2" fill="#61DAFB"/>
      <text y="30" text-anchor="middle" font-size="8" fill="#61DAFB">React</text>
    </g>
    <!-- Python at 120° -->
    <g transform="translate(265, 139)">
      <circle r="20" fill="#1E1F22" stroke="#3776AB" stroke-width="1.5" filter="url(#nodeGlow)"/>
      <path d="M-6,-4 Q-6,-10 0,-10 Q6,-10 6,-4 L6,0 L-6,0Z" fill="#3776AB" opacity="0.8"/>
      <path d="M6,4 Q6,10 0,10 Q-6,10 -6,4 L-6,0 L6,0Z" fill="#FFD43B" opacity="0.8"/>
      <circle cx="-3" cy="-6" r="1.5" fill="#FFF"/>
      <circle cx="3" cy="6" r="1.5" fill="#FFF"/>
      <text y="30" text-anchor="middle" font-size="8" fill="#3776AB">Python</text>
    </g>
    <!-- Java at 240° -->
    <g transform="translate(265, 261)">
      <circle r="20" fill="#1E1F22" stroke="#ED8B00" stroke-width="1.5" filter="url(#nodeGlow)"/>
      <path d="M-6,-6 L6,-6 L6,4 Q6,8 2,8 L-2,8 Q-6,8 -6,4Z" fill="none" stroke="#ED8B00" stroke-width="1.2"/>
      <path d="M6,-2 Q10,-2 10,2 Q10,5 6,5" fill="none" stroke="#ED8B00" stroke-width="1"/>
      <path d="M-3,-9 Q-1,-12 1,-9" fill="none" stroke="#ED8B00" stroke-width="0.8" opacity="0.6"/>
      <path d="M0,-10 Q2,-13 4,-10" fill="none" stroke="#ED8B00" stroke-width="0.8" opacity="0.6"/>
      <text y="30" text-anchor="middle" font-size="8" fill="#ED8B00">Java</text>
    </g>
  </g>

  <!-- Middle Ring (CCW, r=110) — JavaScript, MERN, C -->
  <g class="ring2">
    <!-- JS at ~60° -->
    <g transform="translate(395, 105)">
      <circle r="20" fill="#1E1F22" stroke="#F7DF1E" stroke-width="1.5" filter="url(#nodeGlow)"/>
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#F7DF1E"/>
      <text x="0" y="4" text-anchor="middle" font-size="10" font-weight="bold" fill="#000">JS</text>
      <text y="30" text-anchor="middle" font-size="8" fill="#F7DF1E">JavaScript</text>
    </g>
    <!-- MERN at 180° -->
    <g transform="translate(190, 200)">
      <circle r="20" fill="#1E1F22" stroke="#68A063" stroke-width="1.5" filter="url(#nodeGlow)"/>
      <text x="0" y="4" text-anchor="middle" font-size="8" font-weight="bold" fill="#68A063">MERN</text>
      <text y="30" text-anchor="middle" font-size="8" fill="#68A063">MERN</text>
    </g>
    <!-- C at ~300° -->
    <g transform="translate(395, 295)">
      <circle r="20" fill="#1E1F22" stroke="#A8B9CC" stroke-width="1.5" filter="url(#nodeGlow)"/>
      <text x="0" y="5" text-anchor="middle" font-size="14" font-weight="bold" fill="#A8B9CC">C</text>
      <text y="30" text-anchor="middle" font-size="8" fill="#A8B9CC">C</text>
    </g>
  </g>

  <!-- Outer Ring (CW, r=155) — Shell -->
  <g class="ring3">
    <!-- Shell at 90° -->
    <g transform="translate(300, 45)">
      <circle r="20" fill="#1E1F22" stroke="#89E051" stroke-width="1.5" filter="url(#nodeGlow)"/>
      <text x="0" y="1" text-anchor="middle" font-size="8" font-weight="bold" fill="#89E051">&gt;_</text>
      <text y="30" text-anchor="middle" font-size="8" fill="#89E051">Shell</text>
    </g>
  </g>

  <!-- Central Core -->
  <g class="core-pulse">
    <polygon points="300,170 326,185 326,215 300,230 274,215 274,185" fill="url(#coreGrad)" opacity="0.9"/>
    <polygon points="300,170 326,185 326,215 300,230 274,215 274,185" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5"/>
  </g>
  <text x="300" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0A0A0B">CORE</text>

  <!-- Footer -->
  <text x="24" y="385" font-family="'Courier New', monospace" font-size="10" fill="#36373B">// always learning, always building</text>
</svg>
