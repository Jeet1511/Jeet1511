<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 400" width="600" height="400" overflow="hidden" role="img" aria-label="Jeet Mondal tech stack orbit">
  <defs>
    <linearGradient id="tsGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="45%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="tsMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#36373B"/>
      <stop offset="50%" stop-color="#1E1F22"/>
      <stop offset="100%" stop-color="#2A2B2F"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="tsGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tsClip"><rect x="0" y="0" width="600" height="400"/></clipPath>
  </defs>

  <g clip-path="url(#tsClip)">
    <!-- transparent tactical backdrop -->
    <g stroke="#2E2F33" stroke-width="0.6" opacity="0.5">
      <line x1="0" y1="100" x2="600" y2="100"/><line x1="0" y1="200" x2="600" y2="200"/><line x1="0" y1="300" x2="600" y2="300"/>
      <line x1="150" y1="0" x2="150" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/><line x1="450" y1="0" x2="450" y2="400"/>
    </g>
    <text x="14" y="24" font-family="Consolas, monospace" font-size="11" fill="#6E6F74">[ ARSENAL // ONLINE ]</text>
    <text x="586" y="388" font-family="Consolas, monospace" font-size="11" fill="#6E6F74" text-anchor="end">SYS.ORBIT v1.5.1.1</text>

    <!-- ============ CONCENTRIC DASHED ORBITS ============ -->
    <circle cx="300" cy="200" r="65"  fill="none" stroke="#55575E" stroke-width="1.6" stroke-dasharray="8 6"/>
    <circle cx="300" cy="200" r="110" fill="none" stroke="#55575E" stroke-width="1.6" stroke-dasharray="10 8"/>
    <circle cx="300" cy="200" r="155" fill="none" stroke="#55575E" stroke-width="1.6" stroke-dasharray="12 10"/>
    <!-- gold ticks on orbits -->
    <circle cx="300" cy="200" r="65"  fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-dasharray="3 120" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 300 200; 360 300 200" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="200" r="110" fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-dasharray="3 200" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" values="360 300 200; 0 300 200" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="200" r="155" fill="none" stroke="#D4AF37" stroke-width="1.6" stroke-dasharray="3 280" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" values="0 300 200; 360 300 200" dur="15s" repeatCount="indefinite"/>
    </circle>

    <!-- ============ CENTRAL HEX CORE ============ -->
    <circle cx="300" cy="200" r="58" fill="url(#coreGlow)">
      <animate attributeName="r" values="52;62;52" dur="3s" repeatCount="indefinite"/>
    </circle>
    <polygon points="300,162 333,181 333,219 300,238 267,219 267,181" fill="url(#tsMetal)" stroke="url(#tsGold)" stroke-width="2" filter="url(#tsGlow)">
      <animate attributeName="stroke-width" values="2;3.4;2" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="300,170 326,185 326,215 300,230 274,215 274,185" fill="none" stroke="#36373B" stroke-width="1"/>
    <text x="300" y="206" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="16" fill="url(#tsGold)" text-anchor="middle" letter-spacing="2">CORE</text>

    <!-- ============ INNER RING (clockwise, 20s) : REACT + JS ============ -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 300 200; 360 300 200" dur="20s" repeatCount="indefinite"/>
      <!-- REACT node @ (300,135) -->
      <g>
        <circle cx="300" cy="135" r="21" fill="#0A0A0B" stroke="#61DAFB" stroke-width="1.6" filter="url(#tsGlow)"/>
        <g transform="translate(300,135)">
          <animateTransform attributeName="transform" type="rotate" values="360 0 0; 0 0 0" additive="sum" dur="20s" repeatCount="indefinite"/>
          <circle cx="0" cy="0" r="2.6" fill="#61DAFB"/>
          <ellipse cx="0" cy="0" rx="12" ry="4.6" fill="none" stroke="#61DAFB" stroke-width="1.3"/>
          <ellipse cx="0" cy="0" rx="12" ry="4.6" fill="none" stroke="#61DAFB" stroke-width="1.3" transform="rotate(60)"/>
          <ellipse cx="0" cy="0" rx="12" ry="4.6" fill="none" stroke="#61DAFB" stroke-width="1.3" transform="rotate(120)"/>
        </g>
      </g>
      <!-- JS node @ (300,265) -->
      <g>
        <circle cx="300" cy="265" r="21" fill="#0A0A0B" stroke="#F7DF1E" stroke-width="1.6" filter="url(#tsGlow)"/>
        <g transform="translate(300,265)">
          <animateTransform attributeName="transform" type="rotate" values="360 0 0; 0 0 0" additive="sum" dur="20s" repeatCount="indefinite"/>
          <path d="M-11,-11 h22 v22 h-22 z" fill="#F7DF1E"/>
          <path d="M1.2,6.5 c0.9,1.5 2.1,2.6 4.2,2.6 1.8,0 2.9,-0.9 2.9,-2.1 0,-1.5 -1.2,-2 -3.1,-2.9 l-1.1,-0.5 c-3.1,-1.3 -5.1,-3 -5.1,-6.4 0,-3.2 2.4,-5.6 6.2,-5.6 2.7,0 4.6,0.9 6,3.4 l-3.3,2.1 c-0.7,-1.3 -1.5,-1.8 -2.7,-1.8 -1.2,0 -2,0.8 -2,1.8 0,1.3 0.8,1.8 2.6,2.6 l1.1,0.5 c3.6,1.5 5.6,3.1 5.6,6.6 0,3.9 -3,6 -7.1,6 -4,0 -6.5,-1.9 -7.8,-4.4 z M-10.5,6.9 c0.7,1.2 1.3,2.2 2.8,2.2 1.4,0 2.3,-0.6 2.3,-2.8 v-14.9 h4.2 v15 c0,4.4 -2.6,6.4 -6.3,6.4 -3.4,0 -5.4,-1.8 -6.4,-3.9 z" fill="#0A0A0B" transform="scale(0.52) translate(1,1)"/>
        </g>
      </g>
    </g>

    <!-- ============ MIDDLE RING (counter-clockwise, 28s) : PYTHON + JAVA + MONGODB ============ -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="360 300 200; 0 300 200" dur="28s" repeatCount="indefinite"/>
      <!-- PYTHON node @ (300,90) -->
      <g>
        <circle cx="300" cy="90" r="22" fill="#0A0A0B" stroke="#3776AB" stroke-width="1.6" filter="url(#tsGlow)"/>
        <g transform="translate(300,90)">
          <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" additive="sum" dur="28s" repeatCount="indefinite"/>
          <g transform="scale(1.05)">
            <path d="M-0.3,-13 c-6.6,0 -6.2,2.9 -6.2,2.9 v3 h6.4 v0.9 h-8.9 c0,0 -4.3,-0.5 -4.3,6.3 0,6.8 3.7,6.5 3.7,6.5 h2.2 v-3.1 c0,0 -0.1,-3.7 3.7,-3.7 h6.3 c0,0 3.5,0.1 3.5,-3.4 v-5.7 c0,0 0.6,-3.7 -6.4,-3.7 z m-3.5,2 a1.15,1.15 0 1 1 0,2.3 1.15,1.15 0 0 1 0,-2.3 z" fill="#3776AB"/>
            <path d="M0.3,13 c6.6,0 6.2,-2.9 6.2,-2.9 v-3 h-6.4 v-0.9 h8.9 c0,0 4.3,0.5 4.3,-6.3 0,-6.8 -3.7,-6.5 -3.7,-6.5 h-2.2 v3.1 c0,0 0.1,3.7 -3.7,3.7 h-6.3 c0,0 -3.5,-0.1 -3.5,3.4 v5.7 c0,0 -0.6,3.7 6.4,3.7 z m3.5,-2 a1.15,1.15 0 1 1 0,-2.3 1.15,1.15 0 0 1 0,2.3 z" fill="#FFD43B"/>
          </g>
        </g>
      </g>
      <!-- JAVA node @ (395,255) -->
      <g>
        <circle cx="395" cy="255" r="22" fill="#0A0A0B" stroke="#E76F00" stroke-width="1.6" filter="url(#tsGlow)"/>
        <g transform="translate(395,255)">
          <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" additive="sum" dur="28s" repeatCount="indefinite"/>
          <path d="M-9,4 c0,0 -1.7,1 1.2,1.4 3.5,0.4 5.3,0.3 9.2,-0.4 0,0 1,0.6 2.4,1.2 -8.7,3.7 -19.6,-0.2 -12.8,-2.2 z M-10.1,-0.7 c0,0 -1.9,1.4 1,1.7 3.7,0.4 6.7,0.4 11.8,-0.6 0,0 0.7,0.7 1.8,1.1 -10.4,3.1 -22,0.3 -14.6,-2.2 z" fill="#5382A1"/>
          <path d="M-1.4,-2.8 c2.1,2.5 -0.6,4.7 -0.6,4.7 0,0 5.4,-2.8 2.9,-6.3 -2.3,-3.2 -4.1,-4.9 5.5,-10.4 0,0 -15.1,3.8 -7.8,12 z" fill="#E76F00"/>
          <path d="M6.9,7.5 c0,0 1.3,1 -1.4,1.9 -5.1,1.5 -21.3,2 -25.8,0.1 -1.6,-0.7 1.4,-1.7 2.4,-1.9 1,-0.2 1.6,-0.2 1.6,-0.2 -1.8,-1.3 -11.6,2.5 -5,3.6 18.1,2.9 33,-1.3 28.2,-3.5 z M-8.1,-5.6 c0,0 -8.2,2 -2.9,2.7 2.2,0.3 6.7,0.2 10.8,-0.1 3.4,-0.3 6.8,-0.9 6.8,-0.9 0,0 -1.2,0.5 -2.1,1.1 -8.4,2.2 -24.6,1.2 -19.9,-1.1 3.9,-1.9 7.3,-1.7 7.3,-1.7 z" fill="#5382A1"/>
          <path d="M4.9,-14.9 c0,0 4.9,4.9 -4.7,12.4 -7.7,6 -1.8,9.5 0,13.4 -4.5,-4.1 -7.8,-7.6 -5.6,-11 3.3,-4.9 12.3,-7.2 10.3,-14.8 z" fill="#E76F00" transform="translate(0,-1)"/>
        </g>
      </g>
      <!-- MONGODB node @ (205,255) -->
      <g>
        <circle cx="205" cy="255" r="22" fill="#0A0A0B" stroke="#47A248" stroke-width="1.6" filter="url(#tsGlow)"/>
        <g transform="translate(205,255)">
          <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" additive="sum" dur="28s" repeatCount="indefinite"/>
          <path d="M0,-13 c0,0 -7.5,6.2 -7.5,13.3 0,5.2 3.2,8.9 6.4,10.6 l0.6,3.1 h1 l0.6,-3.1 c3.2,-1.7 6.4,-5.4 6.4,-10.6 0,-7.1 -7.5,-13.3 -7.5,-13.3 z" fill="#47A248"/>
          <path d="M0,-11 l0,22" stroke="#FFFFFF" stroke-width="0.9" opacity="0.7"/>
        </g>
      </g>
    </g>

    <!-- ============ OUTER RING (clockwise, 36s) : NODE + C + SHELL ============ -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 300 200; 360 300 200" dur="36s" repeatCount="indefinite"/>
      <!-- NODE node @ (300,355) -->
      <g>
        <circle cx="300" cy="355" r="22" fill="#0A0A0B" stroke="#339933" stroke-width="1.6" filter="url(#tsGlow)"/>
        <g transform="translate(300,355)">
          <animateTransform attributeName="transform" type="rotate" values="360 0 0; 0 0 0" additive="sum" dur="36s" repeatCount="indefinite"/>
          <path d="M0,-13.5 L11.7,-6.75 L11.7,6.75 L0,13.5 L-11.7,6.75 L-11.7,-6.75 Z" fill="#339933"/>
          <text x="0" y="4.5" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="10" fill="#0A0A0B" text-anchor="middle">N</text>
        </g>
      </g>
      <!-- C node @ (166,122) -->
      <g>
        <circle cx="166" cy="122" r="22" fill="#0A0A0B" stroke="#5C6BC0" stroke-width="1.6" filter="url(#tsGlow)"/>
        <g transform="translate(166,122)">
          <animateTransform attributeName="transform" type="rotate" values="360 0 0; 0 0 0" additive="sum" dur="36s" repeatCount="indefinite"/>
          <path d="M0,-13.5 L11.7,-6.75 L11.7,6.75 L0,13.5 L-11.7,6.75 L-11.7,-6.75 Z" fill="#5C6BC0"/>
          <path d="M5.2,3.1 A6,6 0 1 1 5.2,-3.1 L9.5,-5.6 A11,11 0 1 0 9.5,5.6 Z" fill="#FFFFFF"/>
        </g>
      </g>
      <!-- SHELL node @ (434,122) -->
      <g>
        <circle cx="434" cy="122" r="22" fill="#0A0A0B" stroke="#4EAA25" stroke-width="1.6" filter="url(#tsGlow)"/>
        <g transform="translate(434,122)">
          <animateTransform attributeName="transform" type="rotate" values="360 0 0; 0 0 0" additive="sum" dur="36s" repeatCount="indefinite"/>
          <rect x="-12" y="-10" width="24" height="20" rx="3" fill="#1E1F22" stroke="#4EAA25" stroke-width="1.2"/>
          <path d="M-8,-4 L-3,0 L-8,4" fill="none" stroke="#4EAA25" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="0" y1="5" x2="7" y2="5" stroke="#4EAA25" stroke-width="1.8" stroke-linecap="round">
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
          </line>
        </g>
      </g>
    </g>

    <!-- corner brackets -->
    <path d="M8,26 L8,8 L26,8" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M574,8 L592,8 L592,26" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M592,374 L592,392 L574,392" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M26,392 L8,392 L8,374" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
