<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230" role="img" aria-label="VM-Manager">
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#070a1c"/>
    </linearGradient>
    <radialGradient id="vscene" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".24"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="vclip"><rect x="4" y="4" width="432" height="222" rx="18"/></clipPath>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .led{animation:ledA 1.8s ease-in-out infinite}
      @keyframes ledA{0%,100%{opacity:.2}50%{opacity:1}}
      .fl{animation:flA 4.4s ease-in-out infinite}
      @keyframes flA{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      .tw{animation:twA 2.4s ease-in-out infinite}
      @keyframes twA{0%,100%{opacity:.15}50%{opacity:1}}
    </style>
  </defs>

  <rect x="4" y="4" width="432" height="222" rx="18" fill="url(#vbg)" stroke="#1b2340"/>
  <g clip-path="url(#vclip)">
    <rect x="4" y="4" width="432" height="104" fill="url(#vscene)"/>
    <circle class="tw" cx="60" cy="26" r="1.5" fill="#bfdbfe"/>
    <circle class="tw" cx="370" cy="30" r="1.4" fill="#bfdbfe" style="animation-delay:-1.1s"/>
    <circle class="tw" cx="330" cy="80" r="1.3" fill="#bfdbfe" style="animation-delay:-.6s"/>

    <!-- server rack -->
    <g>
      <rect x="146" y="24" width="118" height="20" rx="4" fill="#3b82f6" fill-opacity=".1" stroke="#60a5fa" stroke-width="1.4"/>
      <rect x="146" y="50" width="118" height="20" rx="4" fill="#3b82f6" fill-opacity=".1" stroke="#60a5fa" stroke-width="1.4"/>
      <rect x="146" y="76" width="118" height="20" rx="4" fill="#3b82f6" fill-opacity=".1" stroke="#60a5fa" stroke-width="1.4"/>
      <line x1="156" y1="31" x2="156" y2="37" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="163" y1="31" x2="163" y2="37" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="156" y1="57" x2="156" y2="63" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="163" y1="57" x2="163" y2="63" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="156" y1="83" x2="156" y2="89" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="163" y1="83" x2="163" y2="89" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round"/>
      <circle class="led" cx="250" cy="34" r="2.6" fill="#34d399"/>
      <circle class="led" cx="250" cy="60" r="2.6" fill="#fbbf24" style="animation-delay:-.6s"/>
      <circle class="led" cx="250" cy="86" r="2.6" fill="#22d3ee" style="animation-delay:-1.2s"/>
    </g>

    <!-- connections -->
    <path d="M264,44 C292,44 292,36 306,36 M264,60 C296,60 300,62 314,62 M264,86 C292,86 296,90 318,88" fill="none" stroke="#60a5fa" stroke-opacity=".4" stroke-width="1.2" stroke-dasharray="3 4"/>

    <!-- floating containers -->
    <rect class="fl" x="306" y="30" width="13" height="13" rx="2.5" fill="#60a5fa" fill-opacity=".18" stroke="#60a5fa" stroke-width="1.3"/>
    <rect class="fl" x="318" y="56" width="13" height="13" rx="2.5" fill="#60a5fa" fill-opacity=".3" stroke="#60a5fa" stroke-width="1.3" style="animation-delay:-1.5s"/>
    <rect class="fl" x="322" y="82" width="13" height="13" rx="2.5" fill="#60a5fa" fill-opacity=".18" stroke="#60a5fa" stroke-width="1.3" style="animation-delay:-2.8s"/>

    <!-- status badge -->
    <rect x="18" y="18" width="110" height="24" rx="12" fill="#172554" fill-opacity=".75" stroke="#60a5fa" stroke-opacity=".55"/>
    <circle cx="34" cy="30" r="3" fill="#fbbf24"/>
    <text x="44" y="34" font-size="10.5" font-weight="600" fill="#93c5fd">FEATURED</text>
  </g>
  <line x1="4" y1="108" x2="436" y2="108" stroke="#1b2340" stroke-width="1"/>

  <text x="24" y="140" font-size="19" font-weight="750" fill="#f1f5f9">VM-Manager</text>
  <text x="24" y="162" font-size="12" fill="#94a3b8">Lightweight control panel to create, monitor and</text>
  <text x="24" y="179" font-size="12" fill="#94a3b8">manage virtual machines from one clean dashboard.</text>

  <g font-size="10.5" fill="#cbd5e1">
    <rect x="24" y="192" width="64" height="20" rx="10" fill="#ffd43b" fill-opacity=".08" stroke="#ffd43b" stroke-opacity=".35"/>
    <circle cx="36" cy="202" r="2.4" fill="#ffd43b"/><text x="44" y="206">Python</text>
    <rect x="96" y="192" width="64" height="20" rx="10" fill="#0db7ed" fill-opacity=".08" stroke="#0db7ed" stroke-opacity=".4"/>
    <circle cx="108" cy="202" r="2.4" fill="#0db7ed"/><text x="116" y="206">Docker</text>
    <rect x="168" y="192" width="46" height="20" rx="10" fill="#f05033" fill-opacity=".08" stroke="#f05033" stroke-opacity=".4"/>
    <circle cx="180" cy="202" r="2.4" fill="#f05033"/><text x="188" y="206">Git</text>
  </g>

  <circle cx="404" cy="202" r="14" fill="none" stroke="#334155" stroke-width="1.2"/>
  <text x="404" y="207" text-anchor="middle" font-size="12" fill="#94a3b8">&#8599;</text>
</svg>
