<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" overflow="hidden" role="img" aria-label="Project: VM Manager">
  <defs>
    <linearGradient id="p1Gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="p1Shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="p1Clip"><rect x="0" y="0" width="400" height="200" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#p1Clip)">
    <rect x="1" y="1" width="398" height="198" rx="12" fill="#1E1F22" stroke="#36373B" stroke-width="2"/>
    <rect x="1" y="1" width="398" height="198" rx="12" fill="none" stroke="#D4AF37" stroke-width="1.2">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="398" height="30" fill="#0A0A0B"/>
    <circle cx="20" cy="16" r="4" fill="#FF5F56"/><circle cx="34" cy="16" r="4" fill="#FFBD2E"/><circle cx="48" cy="16" r="4" fill="#27C93F"/>
    <text x="390" y="20" font-family="Consolas, monospace" font-size="10" fill="#6E6F74" text-anchor="end">~/projects/vm-manager</text>

    <!-- icon : server / VM stack -->
    <g transform="translate(44, 92)">
      <rect x="-22" y="-26" width="44" height="15" rx="3" fill="#0A0A0B" stroke="#D4AF37" stroke-width="1.4"/>
      <rect x="-22" y="-7" width="44" height="15" rx="3" fill="#0A0A0B" stroke="#D4AF37" stroke-width="1.4"/>
      <rect x="-22" y="12" width="44" height="15" rx="3" fill="#0A0A0B" stroke="#D4AF37" stroke-width="1.4"/>
      <circle cx="-14" cy="-18.5" r="2.5" fill="#27C93F"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="-14" cy="0.5" r="2.5" fill="#27C93F"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="-14" cy="19.5" r="2.5" fill="#FFD700"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle>
      <line x1="4" y1="-18.5" x2="16" y2="-18.5" stroke="#36373B" stroke-width="2"/>
      <line x1="4" y1="0.5" x2="16" y2="0.5" stroke="#36373B" stroke-width="2"/>
      <line x1="4" y1="19.5" x2="16" y2="19.5" stroke="#36373B" stroke-width="2"/>
    </g>

    <text x="92" y="66" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="21" fill="url(#p1Gold)">VM MANAGER</text>
    <text x="92" y="90" font-family="Consolas, monospace" font-size="11" fill="#E8E8E8">Virtual machine command center —</text>
    <text x="92" y="106" font-family="Consolas, monospace" font-size="11" fill="#E8E8E8">provision, monitor &amp; control at scale.</text>

    <!-- tech tags -->
    <g font-family="Consolas, monospace" font-size="10" text-anchor="middle">
      <rect x="92" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#61DAFB" stroke-width="1"/><text x="123" y="136" fill="#61DAFB">React</text>
      <rect x="162" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#339933" stroke-width="1"/><text x="193" y="136" fill="#339933">Node</text>
      <rect x="232" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#4EAA25" stroke-width="1"/><text x="263" y="136" fill="#4EAA25">Shell</text>
    </g>

    <!-- footer -->
    <line x1="16" y1="158" x2="384" y2="158" stroke="#36373B" stroke-width="1"/>
    <text x="20" y="180" font-family="Consolas, monospace" font-size="10" fill="#6E6F74">$ vm --deploy --all <tspan fill="#FFD700">█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan></text>
    <text x="384" y="180" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="10" fill="#D4AF37" text-anchor="end">VIEW REPO →</text>

    <!-- shine sweep (clipped) -->
    <rect x="-140" y="0" width="70" height="200" fill="url(#p1Shine)" transform="skewX(-18)">
      <animate attributeName="x" values="-140;480" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
