<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 140" width="890" height="140" role="img" aria-label="Jeet Mondal — footer">
  <defs>
    <radialGradient id="mesh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.06"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="41"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="140"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.22,.61,.36,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.26s}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .tw1{animation:tw 4s ease-in-out infinite}.tw2{animation:tw 5s ease-in-out .8s infinite}.tw3{animation:tw 6s ease-in-out 1.6s infinite}.tw4{animation:tw 4.5s ease-in-out 2.2s infinite}.tw5{animation:tw 5.5s ease-in-out .4s infinite}
    @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .con{stroke-dasharray:300;stroke-dashoffset:300;animation:draw 3s cubic-bezier(.22,.61,.36,1) .6s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="890" height="140" fill="#06070B"/>
    <circle cx="445" cy="40" r="200" fill="url(#mesh)"/>

    <!-- constellation -->
    <g stroke="#1C2030" stroke-width="1" fill="none">
      <path class="con" d="M120,44 L200,28 L286,52 L372,30 L458,48 L544,26 L630,50 L716,32 L802,46"/>
    </g>
    <g fill="#9BA3B4">
      <circle class="tw1" cx="120" cy="44" r="1.6"/>
      <circle class="tw2" cx="200" cy="28" r="2"/>
      <circle class="tw3" cx="286" cy="52" r="1.4"/>
      <circle class="tw4" cx="372" cy="30" r="1.8"/>
      <circle class="tw5" cx="458" cy="48" r="1.4"/>
      <circle class="tw1" cx="544" cy="26" r="2"/>
      <circle class="tw2" cx="630" cy="50" r="1.4"/>
      <circle class="tw3" cx="716" cy="32" r="1.8"/>
      <circle class="tw4" cx="802" cy="46" r="1.4"/>
    </g>
    <g fill="#4EA7FF">
      <circle class="pulse" cx="200" cy="28" r="1"/>
      <circle class="pulse" cx="544" cy="26" r="1"/>
    </g>

    <line x1="64" y1="78" x2="826" y2="78" stroke="#1C2030"/>
    <g class="rise d1">
      <text x="64" y="108" font-size="14" font-weight="600" fill="#F4F6FB">Jeet Mondal</text>
      <text x="168" y="108" font-size="13" fill="#5C6473">&#8212; Building AI-powered products that solve real-world problems.</text>
    </g>
    <g class="rise d2">
      <circle class="pulse" cx="818" cy="104" r="3" fill="#4EA7FF"/>
      <text x="806" y="108" text-anchor="end" font-size="12" fill="#5C6473">&#169; 2026</text>
    </g>
  </g>
  <rect width="890" height="140" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
