<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="480" viewBox="0 0 1280 480" overflow="hidden">
  <defs>
    <!-- Premium metallic gold gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F0D060"/>
      <stop offset="100%" stop-color="#C5A028"/>
    </linearGradient>

    <!-- Name gradient: Gunmetal to Metallic Gold -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36373B"/>
      <stop offset="100%" stop-color="#D4AF37">
        <animate attributeName="stop-color" values="#D4AF37;#C5A028;#D4AF37" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Scan line gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <!-- Shine gradient for name sweep -->
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#36373B" stroke-width="0.5" opacity="0.2"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="20s" repeatCount="indefinite"/>
    </pattern>

    <!-- ClipPaths -->
    <clipPath id="charClip"><rect x="650" y="0" width="630" height="480"/></clipPath>
    <clipPath id="nameClip">
      <text x="40" y="240" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="72" letter-spacing="4">JEET MONDAL</text>
    </clipPath>

    <!-- Blur filter for liquid blobs -->
    <filter id="blobBlur"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1280" height="480" fill="#0A0A0B"/>

  <!-- Liquid gold blob 1 -->
  <path d="M 200 100 Q 400 50 600 200 Q 700 350 500 400 Q 300 450 100 300 Z" fill="#1E1F22" opacity="0.3" filter="url(#blobBlur)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 50 30; -30 50; 0 0" dur="15s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="1; 1.1; 0.95; 1" dur="12s" repeatCount="indefinite" additive="sum"/>
  </path>

  <!-- Liquid gold blob 2 -->
  <path d="M 800 50 Q 1000 100 1100 250 Q 1150 400 950 420 Q 750 440 700 300 Z" fill="#D4AF37" opacity="0.06" filter="url(#blobBlur)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -40 20; 30 -30; 0 0" dur="18s" repeatCount="indefinite"/>
  </path>

  <!-- Subtle diagonal grid overlay -->
  <rect width="1280" height="480" fill="url(#grid)"/>

  <!-- ===== LEFT SIDE ===== -->

  <!-- Terminal window -->
  <g transform="translate(40, 40)">
    <rect width="520" height="140" rx="8" fill="#1E1F22" stroke="#36373B" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect width="520" height="28" rx="8" fill="#1E1F22"/>
    <rect y="20" width="520" height="8" fill="#1E1F22"/>
    <line x1="0" y1="28" x2="520" y2="28" stroke="#36373B" stroke-width="0.5"/>
    <!-- 3 dots -->
    <circle cx="16" cy="14" r="5" fill="#FF5F56"/>
    <circle cx="34" cy="14" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="14" r="5" fill="#27C93F"/>
    <text x="260" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#888888">terminal</text>

    <!-- Scrolling grey logs (faded) -->
    <g opacity="0.25">
      <text x="12" y="50" font-family="monospace" font-size="11" fill="#888888">[info] loading modules...</text>
      <text x="12" y="64" font-family="monospace" font-size="11" fill="#888888">[ok] renderer initialized</text>
      <text x="12" y="78" font-family="monospace" font-size="11" fill="#888888">[ok] theme: architect-forge</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="8s" repeatCount="indefinite"/>
    </g>

    <!-- Boot sequence lines -->
    <text x="12" y="96" font-family="monospace" font-size="12" fill="#D4AF37">
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.4s" fill="freeze"/>
      > initializing core systems... <tspan fill="#27C93F">[OK]</tspan>
    </text>
    <text x="12" y="112" font-family="monospace" font-size="12" fill="#D4AF37">
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.4s" fill="freeze"/>
      > establishing secure uplink... <tspan fill="#27C93F">[SECURE]</tspan>
    </text>
    <text x="12" y="130" font-family="monospace" font-size="12" fill="#888888">
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze"/>
      admin@grid:~$ execute profile.md
    </text>
    <!-- Blinking cursor -->
    <rect x="248" y="120" width="8" height="14" fill="#D4AF37">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Name -->
  <text x="40" y="240" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="72" fill="url(#nameGrad)" letter-spacing="4">JEET MONDAL</text>
  <!-- Shine sweep over name -->
  <g clip-path="url(#nameClip)">
    <rect x="-200" y="170" width="120" height="90" fill="url(#shineGrad)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" from="-200 0" to="900 0" dur="3.5s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <!-- Subtitle -->
  <text x="40" y="275" font-family="Arial, sans-serif" font-size="18" fill="#888888" letter-spacing="1">Full Stack Dev // MERN Architect</text>

  <!-- Code editor -->
  <g transform="translate(40, 300)">
    <rect width="520" height="150" rx="8" fill="#1E1F22" stroke="#36373B" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect width="520" height="28" rx="8" fill="#1A1A1C"/>
    <rect y="20" width="520" height="8" fill="#1A1A1C"/>
    <line x1="0" y1="28" x2="520" y2="28" stroke="#36373B" stroke-width="0.5"/>
    <!-- 3 dots -->
    <circle cx="16" cy="14" r="5" fill="#FF5F56"/>
    <circle cx="34" cy="14" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="14" r="5" fill="#27C93F"/>
    <text x="260" y="18" text-anchor="middle" font-family="monospace" font-size="11" fill="#888888">profile.js</text>

    <!-- Code lines typed one by one -->
    <text x="12" y="50" font-family="monospace" font-size="13" fill="#D4AF37">
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.3s" fill="freeze"/>
      <tspan fill="#C5A028">const</tspan> <tspan fill="#E2E8F0">architect</tspan> <tspan fill="#888888">=</tspan> <tspan fill="#E2E8F0">{</tspan>
    </text>
    <text x="12" y="68" font-family="monospace" font-size="13" fill="#E2E8F0">
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.3s" fill="freeze"/>
      <tspan fill="#888888">  name:</tspan> <tspan fill="#D4915D">'Jeet Mondal'</tspan><tspan fill="#888888">,</tspan>
    </text>
    <text x="12" y="86" font-family="monospace" font-size="13" fill="#E2E8F0">
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/>
      <tspan fill="#888888">  stack:</tspan> <tspan fill="#888888">[</tspan><tspan fill="#D4915D">'React'</tspan><tspan fill="#888888">,</tspan> <tspan fill="#D4915D">'Node'</tspan><tspan fill="#888888">],</tspan>
    </text>
    <text x="12" y="104" font-family="monospace" font-size="13" fill="#E2E8F0">
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/>
      <tspan fill="#888888">  focus:</tspan> <tspan fill="#C5A028">Infinity</tspan>
    </text>
    <text x="12" y="122" font-family="monospace" font-size="13" fill="#E2E8F0">
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
      <tspan fill="#888888">};</tspan> <tspan fill="#C5A028">return</tspan> <tspan fill="#888888">&lt;</tspan><tspan fill="#D4AF37">System</tspan> <tspan fill="#D4915D">status</tspan><tspan fill="#888888">=</tspan><tspan fill="#D4915D">'online'</tspan> <tspan fill="#888888">/&gt;;</tspan>
    </text>
  </g>

  <!-- ===== RIGHT SIDE ===== -->

  <!-- Character image with scan reveal -->
  <g clip-path="url(#charClip)">
    <rect x="650" y="0" width="630" height="480" fill="#0A0A0B"/>
    <image href="assets/avatar.png" x="650" y="0" width="630" height="480" preserveAspectRatio="xMidYMax slice"/>
    <!-- Scan line -->
    <rect x="650" y="0" width="630" height="120" fill="url(#scanGrad)" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" from="0 -120" to="0 480" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <!-- Scan edge line -->
    <line x1="650" y1="120" x2="1280" y2="120" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8">
      <animateTransform attributeName="transform" type="translate" from="0 -120" to="0 480" dur="3.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- "BUILD WITH PURPOSE" badge -->
  <g transform="translate(900, 50)">
    <rect width="240" height="40" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="120" y="26" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" font-weight="bold" fill="url(#goldGrad)" letter-spacing="2">BUILD WITH PURPOSE</text>
  </g>

</svg>
