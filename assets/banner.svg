<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" overflow="hidden">
  <defs>
    <!-- Blueprint grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#36373B" stroke-width="0.5" opacity="0.3"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="20s" repeatCount="indefinite"/>
    </pattern>

    <!-- CRT scanlines pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="1280" y2="0" stroke="white" stroke-width="1" opacity="0.06"/>
    </pattern>

    <!-- Breathing forge glow gradient -->
    <radialGradient id="forgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4915D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D4915D" stop-opacity="0"/>
    </radialGradient>

    <!-- Name gradient: Gunmetal to Amber -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36373B"/>
      <stop offset="100%" stop-color="#D4915D">
        <animate attributeName="stop-color" values="#D4915D;#36373B;#D4915D" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shine gradient for name sweep -->
    <linearGradient id="textShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="45%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Right panel clip -->
    <clipPath id="rightClip">
      <rect x="650" y="0" width="630" height="480"/>
    </clipPath>

    <!-- Name text clip for shine -->
    <clipPath id="nameClip">
      <text x="60" y="270" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="72" letter-spacing="4">JEET MONDAL</text>
    </clipPath>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Terminal background gradient -->
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1F22"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
  </defs>

  <!-- ===== BACKGROUND ===== -->
  <rect width="1280" height="480" fill="#0A0A0B"/>

  <!-- Kinetic grid -->
  <rect width="1280" height="480" fill="url(#grid)"/>

  <!-- CRT scanlines -->
  <rect width="1280" height="480" fill="url(#scanlines)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 4" dur="0.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Breathing forge glow -->
  <circle cx="300" cy="240" r="280" fill="url(#forgeGlow)" filter="url(#glow)">
    <animate attributeName="r" values="280;350;280" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating particles -->
  <circle cx="100" cy="400" r="2" fill="#D4915D" opacity="0.6">
    <animate attributeName="cy" values="400;100;400" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="450" r="1.5" fill="#36373B" opacity="0.4">
    <animate attributeName="cy" values="450;150;450" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="380" r="2.5" fill="#D4915D" opacity="0.5">
    <animate attributeName="cy" values="380;80;380" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="420" r="1" fill="#D4915D" opacity="0.3">
    <animate attributeName="cy" values="420;200;420" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580" cy="350" r="2" fill="#36373B" opacity="0.5">
    <animate attributeName="cy" values="350;50;350" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== LEFT SIDE (x=40 to 600) ===== -->

  <!-- Terminal Box -->
  <g transform="translate(40, 30)">
    <rect width="520" height="150" rx="8" fill="url(#termBg)" stroke="#36373B" stroke-width="1"/>

    <!-- Terminal header dots -->
    <circle cx="16" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="16" r="5" fill="#28c840"/>

    <!-- Terminal prompt text -->
    <text x="20" y="50" font-family="'Courier New', monospace" font-size="13" fill="#D4915D">
      <tspan>admin@grid:~$ </tspan>
      <tspan fill="#e0e0e0">execute profile.md</tspan>
    </text>

    <!-- Blinking cursor -->
    <rect x="215" y="38" width="10" height="16" fill="#D4915D">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Scrolling background logs -->
    <g opacity="0.3" font-family="'Courier New', monospace" font-size="10" fill="#8a8a8e">
      <text x="20" y="75">pinging node 42... latency 12ms</text>
      <text x="20" y="90">allocating memory block 0xAF...</text>
      <text x="20" y="105">compiling modules... [##########] 100%</text>
      <text x="20" y="120">pinging node 42... latency 12ms</text>
      <text x="20" y="135">allocating memory block 0xAF...</text>
      <text x="20" y="150">compiling modules... [##########] 100%</text>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -30" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Name "JEET MONDAL" -->
  <g>
    <!-- Main name text with gradient fill -->
    <text x="60" y="270" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="72" fill="url(#nameGrad)" letter-spacing="4">JEET MONDAL</text>

    <!-- Skewed shine sweep clipped to text -->
    <g clip-path="url(#nameClip)">
      <rect x="-200" y="200" width="100" height="80" fill="url(#textShine)" transform="skewX(-20)">
        <animateTransform attributeName="transform" type="translate" from="-100 0" to="900 0" dur="3s" repeatCount="indefinite" additive="sum"/>
      </rect>
    </g>
  </g>

  <!-- Subtitle / Role -->
  <text x="60" y="300" font-family="'Courier New', monospace" font-size="14" fill="#8a8a8e" letter-spacing="2">System Architect // Full Stack Tactician</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(60, 320)">
    <!-- React -->
    <rect x="0" y="0" width="70" height="26" rx="4" fill="#1E1F22" stroke="#D4915D" stroke-width="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze"/>
    </rect>
    <text x="35" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e0e0e0" opacity="0">
      React
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1s" fill="freeze"/>
    </text>

    <!-- JavaScript -->
    <rect x="80" y="0" width="90" height="26" rx="4" fill="#1E1F22" stroke="#D4915D" stroke-width="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
    </rect>
    <text x="125" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e0e0e0" opacity="0">
      JavaScript
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.2s" fill="freeze"/>
    </text>

    <!-- Python -->
    <rect x="180" y="0" width="75" height="26" rx="4" fill="#1E1F22" stroke="#D4915D" stroke-width="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
    </rect>
    <text x="217" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e0e0e0" opacity="0">
      Python
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
    </text>

    <!-- Java -->
    <rect x="265" y="0" width="60" height="26" rx="4" fill="#1E1F22" stroke="#D4915D" stroke-width="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
    </rect>
    <text x="295" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e0e0e0" opacity="0">
      Java
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
    </text>

    <!-- MERN -->
    <rect x="335" y="0" width="65" height="26" rx="4" fill="#1E1F22" stroke="#D4915D" stroke-width="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
    </rect>
    <text x="367" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e0e0e0" opacity="0">
      MERN
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
    </text>

    <!-- C -->
    <rect x="410" y="0" width="40" height="26" rx="4" fill="#1E1F22" stroke="#D4915D" stroke-width="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
    </rect>
    <text x="430" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e0e0e0" opacity="0">
      C
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2s" fill="freeze"/>
    </text>

    <!-- Shell -->
    <rect x="460" y="0" width="60" height="26" rx="4" fill="#1E1F22" stroke="#D4915D" stroke-width="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
    </rect>
    <text x="490" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#e0e0e0" opacity="0">
      Shell
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
    </text>
  </g>

  <!-- Code Editor Card -->
  <g transform="translate(40, 370)">
    <rect width="520" height="100" rx="8" fill="#0A0A0B" stroke="#36373B" stroke-width="1"/>
    <!-- Editor header -->
    <rect width="520" height="24" rx="8" fill="#1E1F22"/>
    <circle cx="14" cy="12" r="4" fill="#ff5f57"/>
    <circle cx="30" cy="12" r="4" fill="#ffbd2e"/>
    <circle cx="46" cy="12" r="4" fill="#28c840"/>

    <!-- Code lines typing effect -->
    <text x="16" y="44" font-family="'Courier New', monospace" font-size="12" opacity="0">
      <tspan fill="#c678dd">const</tspan><tspan fill="#e0e0e0"> architect = {</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.5s" fill="freeze"/>
    </text>
    <text x="16" y="60" font-family="'Courier New', monospace" font-size="12" opacity="0">
      <tspan fill="#e0e0e0">  name: </tspan><tspan fill="#98c379">'Jeet Mondal'</tspan><tspan fill="#e0e0e0">,</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.8s" fill="freeze"/>
    </text>
    <text x="16" y="76" font-family="'Courier New', monospace" font-size="12" opacity="0">
      <tspan fill="#e0e0e0">  stack: [</tspan><tspan fill="#98c379">'React'</tspan><tspan fill="#e0e0e0">, </tspan><tspan fill="#98c379">'Node'</tspan><tspan fill="#e0e0e0">],</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.1s" fill="freeze"/>
    </text>
    <text x="16" y="92" font-family="'Courier New', monospace" font-size="12" opacity="0">
      <tspan fill="#e0e0e0">  focus: </tspan><tspan fill="#d19a66">Infinity</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.4s" fill="freeze"/>
    </text>
    <text x="16" y="108" font-family="'Courier New', monospace" font-size="12" opacity="0">
      <tspan fill="#e0e0e0">}; return </tspan><tspan fill="#c678dd">&lt;System</tspan><tspan fill="#e0e0e0"> status=</tspan><tspan fill="#98c379">'online'</tspan><tspan fill="#c678dd"> /&gt;</tspan><tspan fill="#e0e0e0">;</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.7s" fill="freeze"/>
    </text>
  </g>

  <!-- ===== RIGHT SIDE (x=650 to 1240) ===== -->

  <!-- Character Image -->
  <g clip-path="url(#rightClip)">
    <image href="assets/avatar.png" x="650" y="0" width="630" height="480" preserveAspectRatio="xMidYMax slice"/>
  </g>

  <!-- Amber scanning line sweep -->
  <g clip-path="url(#rightClip)">
    <line x1="650" y1="0" x2="1280" y2="0" stroke="#D4915D" stroke-width="2" opacity="0.6" filter="url(#glow)">
      <animate attributeName="y1" values="-100;480" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-100;480" dur="3.5s" repeatCount="indefinite"/>
    </line>
    <rect x="650" y="0" width="630" height="20" fill="#D4915D" opacity="0.05">
      <animate attributeName="y" values="-110;470" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- "BUILD WITH PURPOSE" marquee sign -->
  <g transform="translate(870, 20)">
    <rect width="260" height="36" rx="4" fill="#36373B" stroke="#D4915D" stroke-width="1" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2s" fill="freeze"/>
    </rect>
    <text x="130" y="24" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="16" fill="#D4915D" letter-spacing="3" opacity="0">
      BUILD WITH PURPOSE
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2s" fill="freeze"/>
    </text>
  </g>

</svg>
