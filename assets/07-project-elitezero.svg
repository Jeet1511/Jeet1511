<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 420" width="890" height="420" role="img" aria-label="EliteZero — AI-powered Discord bot">
  <defs>
    <radialGradient id="mesh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.07"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="shm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#9BC4FF" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="22"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="420"/></clipPath>
    <clipPath id="embed"><rect x="244" y="146" width="380" height="52" rx="4"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.22,.61,.36,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.26s}.d3{animation-delay:.42s}.d4{animation-delay:.58s}.d5{animation-delay:.74s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .cur{animation:cur 1.1s steps(2) infinite}
    @keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .shm{animation:shm 4.8s ease-in-out infinite}
    @keyframes shm{0%{transform:translateX(-170px)}55%,100%{transform:translateX(430px)}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="890" height="420" fill="#06070B"/>
    <circle cx="445" cy="150" r="300" fill="url(#mesh)"/>
    <text x="826" y="300" text-anchor="end" font-size="120" font-weight="700" fill="#0E1016" opacity="0.5" letter-spacing="-4">07</text>

    <!-- Discord mock window -->
    <rect x="64" y="44" width="762" height="216" rx="12" fill="#0E1016" stroke="#1C2030"/>
    <!-- server rail -->
    <rect x="64" y="44" width="36" height="216" rx="12" fill="#06070B"/>
    <rect x="72" y="52" width="20" height="20" rx="10" fill="#4EA7FF" fill-opacity="0.22" stroke="#4EA7FF" stroke-opacity="0.5"/>
    <text x="82" y="66" text-anchor="middle" font-size="8" font-weight="700" fill="#9BC4FF">EZ</text>
    <line x1="72" y1="80" x2="92" y2="80" stroke="#1C2030"/>
    <rect x="74" y="88" width="16" height="16" rx="8" fill="#14171F"/>
    <rect x="74" y="110" width="16" height="16" rx="8" fill="#14171F"/>
    <rect x="74" y="132" width="16" height="16" rx="8" fill="none" stroke="#1C2030" stroke-dasharray="2 2"/>
    <line x1="100" y1="44" x2="100" y2="260" stroke="#1C2030"/>

    <!-- channel sidebar -->
    <text x="110" y="62" font-size="9" font-weight="700" fill="#F4F6FB">EliteZero HQ</text>
    <text x="110" y="80" font-size="6.5" letter-spacing="1" fill="#5C6473">TEXT CHANNELS</text>
    <rect x="106" y="86" width="100" height="15" rx="4" fill="#4EA7FF" fill-opacity="0.12"/>
    <text x="113" y="97" font-size="8.5" font-weight="600" fill="#F4F6FB"># general</text>
    <text x="113" y="115" font-size="8.5" fill="#5C6473"># commands</text>
    <text x="113" y="131" font-size="8.5" fill="#5C6473"># logs</text>
    <text x="110" y="151" font-size="6.5" letter-spacing="1" fill="#5C6473">VOICE</text>
    <text x="113" y="167" font-size="8.5" fill="#5C6473">&#128266; Lounge</text>
    <line x1="214" y1="44" x2="214" y2="260" stroke="#1C2030"/>

    <!-- chat header -->
    <text x="226" y="62" font-size="11" font-weight="700" fill="#F4F6FB"># general</text>
    <text x="294" y="62" font-size="8.5" fill="#5C6473">&#183; 1,284 members</text>
    <line x1="214" y1="72" x2="826" y2="72" stroke="#1C2030"/>

    <!-- user message -->
    <circle cx="230" cy="90" r="8" fill="#14171F" stroke="#1C2030"/>
    <text x="244" y="88" font-size="9" font-weight="600" fill="#9BA3B4">Member</text>
    <text x="286" y="88" font-size="7.5" fill="#5C6473">Today at 14:02</text>
    <text x="244" y="101" font-size="9.5" fill="#9BA3B4">automate onboarding for new members</text>

    <!-- bot message -->
    <rect x="221" y="115" width="18" height="18" rx="9" fill="#4EA7FF" fill-opacity="0.16" stroke="#4EA7FF" stroke-opacity="0.55"/>
    <text x="230" y="128" text-anchor="middle" font-size="7" font-weight="700" fill="#9BC4FF">EZ</text>
    <text x="245" y="125" font-size="9.5" font-weight="700" fill="#F4F6FB">EliteZero</text>
    <rect x="300" y="116" width="22" height="11" rx="3" fill="#4EA7FF" fill-opacity="0.18"/>
    <text x="311" y="124" text-anchor="middle" font-size="6.5" font-weight="700" letter-spacing="0.5" fill="#9BC4FF">BOT</text>
    <circle class="pulse" cx="330" cy="121" r="3" fill="#4EA7FF"/>
    <text x="245" y="139" font-size="9.5" fill="#9BA3B4">On it. Here's the workflow I just configured:</text>

    <!-- embed card -->
    <rect x="244" y="146" width="380" height="52" rx="4" fill="#0E1016" stroke="#1C2030"/>
    <rect x="244" y="146" width="3" height="52" fill="#4EA7FF"/>
    <g clip-path="url(#embed)"><rect class="shm" x="244" y="146" width="120" height="52" fill="url(#shm)"/></g>
    <circle cx="260" cy="160" r="3" fill="#4EA7FF"/>
    <text x="268" y="163" font-size="9" font-weight="700" fill="#F4F6FB">Onboarding Automation</text>
    <text x="260" y="177" font-size="8" fill="#9BA3B4">Auto-assigns @Member role on join</text>
    <text x="260" y="189" font-size="8" fill="#9BA3B4">Posts a welcome message in #general</text>
    <circle class="pulse" cx="600" cy="172" r="3" fill="#4EA7FF"/>
    <text x="608" y="175" font-size="8" font-weight="600" fill="#9BA3B4">Active</text>

    <!-- slash command echo -->
    <rect x="244" y="208" width="150" height="16" rx="4" fill="#06070B" stroke="#1C2030"/>
    <text x="252" y="219" font-size="8.5" font-weight="600" fill="#9BC4FF">/automate onboarding</text>

    <!-- input bar -->
    <rect x="222" y="224" width="596" height="24" rx="6" fill="#14171F" stroke="#1C2030"/>
    <text x="232" y="240" font-size="9" fill="#5C6473">Message #general</text>
    <rect class="cur" x="316" y="231" width="1.5" height="10" fill="#9BA3B4"/>
    <circle cx="804" cy="236" r="7" fill="none" stroke="#5C6473" stroke-width="1"/>
    <path d="M801,236 L807,236 M804,233 L804,239" stroke="#5C6473" stroke-width="1" stroke-linecap="round"/>

    <!-- bottom text -->
    <line x1="64" y1="282" x2="826" y2="282" stroke="#1C2030"/>
    <g class="rise d1">
      <rect x="64" y="298" width="22" height="2" fill="#4EA7FF"/>
      <text x="94" y="306" font-size="11" letter-spacing="3" fill="#9BA3B4">DISCORD BOT &#183; IN DEVELOPMENT</text>
    </g>
    <text class="rise d2" x="62" y="352" font-size="32" font-weight="650" letter-spacing="-.4" fill="#F4F6FB">EliteZero</text>
    <g class="rise d3">
      <text x="64" y="384" font-size="15" fill="#9BA3B4">An AI-powered Discord bot for moderation, automation,</text>
      <text x="64" y="404" font-size="15" fill="#9BA3B4">and intelligent commands — built to run your server.</text>
    </g>
    <g class="rise d4">
      <text x="826" y="352" text-anchor="end" font-size="12.5" fill="#9BA3B4">Node.js &#183; TypeScript &#183; Python</text>
      <circle class="pulse" cx="700" cy="378" r="3" fill="#4EA7FF"/>
      <text x="710" y="382" font-size="12" fill="#9BA3B4">In Development</text>
      <text x="826" y="404" text-anchor="end" font-size="13" font-weight="500" fill="#4EA7FF">View repository &#8594;</text>
    </g>
  </g>
  <rect width="890" height="420" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
