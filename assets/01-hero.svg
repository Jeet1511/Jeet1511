<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 500" width="890" height="500" role="img" aria-label="Jeet Mondal — Full Stack Developer and AI Engineer">
  <defs>
    <radialGradient id="meshA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.16"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="meshB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2C6FCC" stop-opacity="0.12"/><stop offset="1" stop-color="#2C6FCC" stop-opacity="0"/></radialGradient>
    <radialGradient id="meshC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#5C6473" stop-opacity="0.10"/><stop offset="1" stop-color="#5C6473" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.32"/><stop offset="0.5" stop-color="#4EA7FF" stop-opacity="0.08"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.22"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="shell" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#9BC4FF" stop-opacity="0.10"/><stop offset="0.6" stop-color="#4EA7FF" stop-opacity="0.04"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0.12"/></radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#EAF2FF" stop-opacity="0.95"/><stop offset="0.35" stop-color="#9BC4FF" stop-opacity="0.55"/><stop offset="0.7" stop-color="#4EA7FF" stop-opacity="0.22"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="caustic" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#DCEBFF" stop-opacity="0.55"/><stop offset="1" stop-color="#DCEBFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="ray" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0"/><stop offset="0.5" stop-color="#4EA7FF" stop-opacity="0.16"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9BC4FF" stop-opacity="0"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0.16"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#9BC4FF" stop-opacity="0.05"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="11"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="500"/></clipPath>
  </defs>

  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.22,.61,.36,1) forwards}
    .d1{animation-delay:.10s}.d2{animation-delay:.26s}.d3{animation-delay:.42s}.d4{animation-delay:.58s}.d5{animation-delay:.74s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .meshA{animation:mA 22s ease-in-out infinite alternate}
    .meshB{animation:mB 26s ease-in-out infinite alternate}
    .meshC{animation:mC 30s ease-in-out infinite alternate}
    @keyframes mA{from{opacity:.7;transform:translate(0,0)}to{opacity:1;transform:translate(18px,10px)}}
    @keyframes mB{from{opacity:.6;transform:translate(0,0)}to{opacity:1;transform:translate(-16px,-8px)}}
    @keyframes mC{from{opacity:.5;transform:translate(0,0)}to{opacity:.9;transform:translate(10px,-12px)}}
    .orbIn{opacity:0;transform-origin:640px 250px;animation:orbIn 1.6s cubic-bezier(.22,.61,.36,1) .2s forwards}
    @keyframes orbIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
    .glow{animation:glow 6s ease-in-out infinite alternate;transform-origin:640px 250px}
    @keyframes glow{from{opacity:.85;transform:scale(1)}to{opacity:1;transform:scale(1.06)}}
    .core{animation:core 6.5s ease-in-out infinite alternate;transform-origin:640px 250px}
    @keyframes core{from{transform:scale(0.96)}to{transform:scale(1.05)}}
    .caustic1{animation:c1 9s ease-in-out infinite alternate}
    .caustic2{animation:c2 11s ease-in-out infinite alternate}
    @keyframes c1{from{transform:translate(0,0)}to{transform:translate(8px,6px)}}
    @keyframes c2{from{transform:translate(0,0)}to{transform:translate(-7px,-5px)}}
    .ringA{transform-origin:640px 250px;animation:rotA 48s linear infinite}
    .ringB{transform-origin:640px 250px;animation:rotB 64s linear infinite reverse}
    @keyframes rotA{from{transform:rotate(-18deg)}to{transform:rotate(342deg)}}
    @keyframes rotB{from{transform:rotate(24deg)}to{transform:rotate(384deg)}}
    .shardA{transform-origin:640px 250px;animation:shA 38s linear infinite}
    .shardB{transform-origin:640px 250px;animation:shB 52s linear infinite reverse}
    .shardC{transform-origin:640px 250px;animation:shC 44s linear infinite}
    @keyframes shA{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes shB{from{transform:rotate(40deg)}to{transform:rotate(400deg)}}
    @keyframes shC{from{transform:rotate(-30deg)}to{transform:rotate(330deg)}}
    .shaft{animation:shaft 9s ease-in-out infinite alternate;transform-origin:640px 250px}
    @keyframes shaft{from{opacity:.5;transform:scaleY(.96)}to{opacity:1;transform:scaleY(1.05)}}
    .pool{animation:pool 7s ease-in-out infinite alternate;transform-origin:640px 392px}
    @keyframes pool{from{transform:scaleX(.9)}to{transform:scaleX(1.08)}}
    .reflect{animation:refl 7s ease-in-out infinite alternate}
    @keyframes refl{from{opacity:.4}to{opacity:.75}}
    .dust{animation:dust 8s ease-in-out infinite alternate}
    @keyframes dust{from{transform:translateY(0)}to{transform:translateY(-6px)}}
    .sw{animation:sw 17s ease-in-out 1.6s forwards}
    @keyframes sw{0%{transform:translateX(-360px) skewX(-12deg)}55%{transform:translateX(1180px) skewX(-12deg)}100%{transform:translateX(1180px) skewX(-12deg)}}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="890" height="500" fill="#06070B"/>

    <!-- gradient mesh -->
    <circle class="meshA" cx="240" cy="160" r="260" fill="url(#meshA)"/>
    <circle class="meshB" cx="700" cy="380" r="280" fill="url(#meshB)"/>
    <circle class="meshC" cx="445" cy="250" r="320" fill="url(#meshC)"/>

    <!-- abstract terrain horizon -->
    <path d="M0,462 C160,440 300,478 445,460 C600,440 740,472 890,452 L890,500 L0,500 Z" fill="#0E1016" opacity="0.65"/>
    <path d="M0,470 C170,452 320,484 460,468 C610,452 750,478 890,462" fill="none" stroke="#1C2030" stroke-width="1" opacity="0.8"/>

    <!-- atmospheric particles -->
    <g fill="#9BA3B4">
      <circle cx="120" cy="80" r="0.9" opacity="0.5" class="dust" style="animation-delay:0s"/>
      <circle cx="210" cy="430" r="1.1" opacity="0.4" class="dust" style="animation-delay:1.2s"/>
      <circle cx="330" cy="120" r="0.8" opacity="0.5" class="dust" style="animation-delay:2.4s"/>
      <circle cx="80" cy="300" r="1.0" opacity="0.35" class="dust" style="animation-delay:3.1s"/>
      <circle cx="400" cy="420" r="0.9" opacity="0.4" class="dust" style="animation-delay:1.8s"/>
      <circle cx="500" cy="90" r="0.8" opacity="0.45" class="dust" style="animation-delay:0.6s"/>
      <circle cx="820" cy="120" r="1.0" opacity="0.4" class="dust" style="animation-delay:2.0s"/>
      <circle cx="850" cy="430" r="0.9" opacity="0.4" class="dust" style="animation-delay:3.6s"/>
      <circle cx="180" cy="220" r="0.7" opacity="0.4" class="dust" style="animation-delay:2.8s"/>
      <circle cx="460" cy="300" r="0.8" opacity="0.3" class="dust" style="animation-delay:1.5s"/>
    </g>

    <!-- volumetric light shaft + ray -->
    <polygon class="shaft" points="612,0 668,0 712,250 568,250" fill="url(#shaft)" opacity="0.7"/>
    <path d="M584,152 L520,40" stroke="url(#ray)" stroke-width="40" stroke-linecap="round" opacity="0.35" class="reflect"/>

    <!-- ============ THE ORB ============ -->
    <g class="orbIn">
      <circle class="glow" cx="640" cy="250" r="210" fill="url(#glow)"/>
      <ellipse class="pool" cx="640" cy="392" rx="150" ry="20" fill="url(#pool)"/>

      <g class="ringA"><ellipse cx="640" cy="250" rx="142" ry="46" fill="none" stroke="#9BC4FF" stroke-opacity="0.22" stroke-width="1"/></g>
      <g class="ringB"><ellipse cx="640" cy="250" rx="152" ry="38" fill="none" stroke="#9BC4FF" stroke-opacity="0.16" stroke-width="1"/></g>

      <!-- orbiting glass shards -->
      <g class="shardA"><polygon points="640,108 648,120 640,132 632,120" fill="#9BC4FF" fill-opacity="0.18" stroke="#9BC4FF" stroke-opacity="0.45" stroke-width="0.8"/></g>
      <g class="shardB"><polygon points="760,172 768,180 760,188 752,180" fill="#DCEBFF" fill-opacity="0.14" stroke="#9BC4FF" stroke-opacity="0.35" stroke-width="0.8"/></g>
      <g class="shardC"><polygon points="540,322 548,330 540,338 532,330" fill="#9BC4FF" fill-opacity="0.12" stroke="#9BC4FF" stroke-opacity="0.30" stroke-width="0.8"/></g>

      <circle cx="640" cy="250" r="112" fill="url(#shell)" stroke="#4EA7FF" stroke-opacity="0.20" stroke-width="1"/>

      <circle class="caustic1" cx="622" cy="234" r="44" fill="url(#caustic)"/>
      <circle class="caustic2" cx="660" cy="268" r="36" fill="url(#caustic)" opacity="0.7"/>

      <g class="core">
        <circle cx="640" cy="250" r="58" fill="url(#core)"/>
        <circle cx="640" cy="250" r="22" fill="#EAF2FF" opacity="0.85" class="reflect"/>
      </g>

      <path d="M578,196 A112,112 0 0,1 632,144" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="600" cy="178" r="2.2" fill="#FFFFFF" opacity="0.7" class="reflect"/>

      <g fill="#9BC4FF">
        <circle cx="540" cy="180" r="1.4" opacity="0.6" class="dust" style="animation-delay:0.2s"/>
        <circle cx="745" cy="170" r="1.2" opacity="0.55" class="dust" style="animation-delay:1.6s"/>
        <circle cx="770" cy="280" r="1.3" opacity="0.5" class="dust" style="animation-delay:2.8s"/>
        <circle cx="528" cy="300" r="1.2" opacity="0.5" class="dust" style="animation-delay:3.4s"/>
        <circle cx="700" cy="350" r="1.0" opacity="0.45" class="dust" style="animation-delay:1.0s"/>
        <circle cx="560" cy="360" r="1.1" opacity="0.4" class="dust" style="animation-delay:2.2s"/>
        <circle cx="760" cy="360" r="1.0" opacity="0.4" class="dust" style="animation-delay:0.8s"/>
      </g>
    </g>

    <rect class="sw" x="-220" y="0" width="170" height="500" fill="url(#sweep)"/>

    <!-- ============ TYPOGRAPHY ============ -->
    <g class="rise d1">
      <rect x="64" y="132" width="22" height="2" fill="#4EA7FF"/>
      <text x="94" y="140" font-size="11" letter-spacing="3" fill="#9BA3B4">FULL STACK DEVELOPER &#183; AI ENGINEER</text>
    </g>
    <text class="rise d2" x="62" y="244" font-size="96" font-weight="600" letter-spacing="-2.4" fill="#F4F6FB">Jeet</text>
    <text class="rise d3" x="62" y="338" font-size="96" font-weight="600" letter-spacing="-2.4" fill="#F4F6FB">Mondal</text>
    <g class="rise d4">
      <text x="64" y="382" font-size="19" fill="#9BA3B4">Building AI-powered products</text>
      <text x="64" y="406" font-size="19" fill="#9BA3B4">that solve real-world problems.</text>
    </g>
    <g class="rise d5">
      <circle class="pulse" cx="70" cy="450" r="3" fill="#4EA7FF"/>
      <text x="82" y="454" font-size="12" fill="#5C6473">Open to collaboration</text>
    </g>

    <!-- glass overlay -->
    <rect width="890" height="500" fill="url(#glass)"/>
  </g>

  <rect width="890" height="500" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
