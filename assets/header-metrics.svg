<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 64" width="890" height="64" role="img" aria-label="GitHub Metrics">
  <defs>
    <linearGradient id="hmbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#070a1c"/>
    </linearGradient>
    <linearGradient id="hmline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .mono{font-family:'Cascadia Code','Fira Code',Consolas,monospace}
      .scan{animation:scanA 5s linear infinite}
      @keyframes scanA{0%{transform:translateX(0);opacity:0}8%{opacity:1}60%{transform:translateX(590px);opacity:1}70%{opacity:0}100%{transform:translateX(590px);opacity:0}}
      .eq1{animation:eq 1.1s ease-in-out infinite}
      .eq2{animation:eq 1.1s ease-in-out infinite;animation-delay:-.35s}
      .eq3{animation:eq 1.1s ease-in-out infinite;animation-delay:-.7s}
      @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
    </style>
  </defs>
  <rect x="4" y="10" width="882" height="44" rx="12" fill="url(#hmbg)" stroke="#1b2340"/>
  <rect x="24" y="30" width="112" height="2" fill="url(#hmline)"/>
  <rect class="scan" x="24" y="29" width="26" height="4" fill="#a78bfa" opacity=".8"/>
  <text x="28" y="26" class="mono" font-size="11" letter-spacing="3" fill="#475569">05</text>
  <text x="164" y="41" font-size="17" font-weight="750" fill="#e2e8f0">GITHUB <tspan fill="#8b5cf6">METRICS</tspan></text>
  <g transform="translate(320,29)" fill="#22d3ee">
    <rect class="eq1" x="0" y="0" width="3" height="12" rx="1" style="transform-origin:1.5px 12px"/>
    <rect class="eq2" x="6" y="0" width="3" height="12" rx="1" style="transform-origin:7.5px 12px"/>
    <rect class="eq3" x="12" y="0" width="3" height="12" rx="1" style="transform-origin:13.5px 12px"/>
  </g>
  <text x="862" y="41" text-anchor="end" class="mono" font-size="11" fill="#475569">live &#8226; auto-updating</text>
</svg>
