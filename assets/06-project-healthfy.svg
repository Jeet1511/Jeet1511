<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 380" width="890" height="380" role="img" aria-label="healthfy — healthcare AI">
  <defs>
    <radialGradient id="mesh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.07"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="wf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.3"/><stop offset="0.5" stop-color="#4EA7FF"/><stop offset="1" stop-color="#9BC4FF"/></linearGradient>
    <linearGradient id="wfa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.18"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="18"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="380"/></clipPath>
    <clipPath id="mock"><rect x="480" y="48" width="346" height="300" rx="12"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.22,.61,.36,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.26s}.d3{animation-delay:.42s}.d4{animation-delay:.58s}.d5{animation-delay:.74s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .ecg{stroke-dasharray:10 6;animation:ecg 1.6s linear infinite}
    @keyframes ecg{from{stroke-dashoffset:0}to{stroke-dashoffset:-32}}
    .heart{animation:heart 1.1s ease-in-out infinite;transform-origin:506px 116px}
    @keyframes heart{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}50%{transform:scale(0.95)}}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .insight{animation:ins 5s ease-in-out infinite alternate}
    @keyframes ins{from{opacity:.7}to{opacity:1}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="890" height="380" fill="#06070B"/>
    <circle cx="200" cy="190" r="280" fill="url(#mesh)"/>
    <text x="826" y="270" text-anchor="end" font-size="120" font-weight="700" fill="#0E1016" opacity="0.5" letter-spacing="-4">06</text>

    <!-- text left -->
    <g class="rise d1">
      <rect x="64" y="78" width="22" height="2" fill="#4EA7FF"/>
      <text x="94" y="86" font-size="11" letter-spacing="3" fill="#9BA3B4">HEALTHCARE AI</text>
    </g>
    <text class="rise d2" x="62" y="134" font-size="32" font-weight="650" letter-spacing="-.4" fill="#F4F6FB">healthfy</text>
    <g class="rise d3">
      <text x="64" y="170" font-size="15" fill="#9BA3B4">An AI health companion for symptom</text>
      <text x="64" y="192" font-size="15" fill="#9BA3B4">guidance, vitals tracking, and daily care.</text>
    </g>
    <line class="rise d4" x1="64" y1="220" x2="420" y2="220" stroke="#1C2030"/>
    <text class="rise d4" x="64" y="244" font-size="12.5" fill="#9BA3B4">Next.js &#183; TypeScript &#183; Python</text>
    <g class="rise d5">
      <circle class="pulse" cx="70" cy="280" r="3" fill="#4EA7FF"/>
      <text x="80" y="284" font-size="12" fill="#9BA3B4">Active</text>
      <text x="64" y="312" font-size="13" font-weight="500" fill="#4EA7FF">View repository &#8594;</text>
    </g>

    <!-- mock health card -->
    <rect x="480" y="48" width="346" height="300" rx="12" fill="#0E1016" stroke="#1C2030"/>
    <circle cx="500" cy="64" r="3" fill="#1C2030"/><circle cx="516" cy="64" r="3" fill="#1C2030"/><circle cx="532" cy="64" r="3" fill="#1C2030"/>
    <rect x="566" y="56" width="120" height="14" rx="7" fill="#14171F"/>
    <text x="626" y="66" text-anchor="middle" font-size="8" fill="#5C6473">healthfy.ai</text>
    <line x1="480" y1="80" x2="826" y2="80" stroke="#1C2030"/>

    <!-- heart rate -->
    <g class="heart"><path d="M506,124 C500,117 491,117 491,109 C491,103 497,100 501,104 C505,100 511,103 511,109 C511,117 506,117 506,124 Z" fill="#4EA7FF"/></g>
    <text x="524" y="124" font-size="30" font-weight="700" letter-spacing="-.5" fill="#F4F6FB">72</text>
    <text x="562" y="124" font-size="11" fill="#5C6473">BPM</text>
    <text x="810" y="124" text-anchor="end" font-size="10" fill="#5C6473">resting</text>

    <!-- waveform -->
    <g clip-path="url(#mock)">
      <path d="M494,180 L540,180 L548,150 L556,214 L564,180 L610,180 L618,166 L626,196 L634,180 L680,180 L690,138 L700,224 L710,180 L820,180 L820,210 L494,210 Z" fill="url(#wfa)"/>
      <path class="ecg" d="M494,180 L540,180 L548,150 L556,214 L564,180 L610,180 L618,166 L626,196 L634,180 L680,180 L690,138 L700,224 L710,180 L820,180" fill="none" stroke="url(#wf)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- stat row -->
    <g>
      <text x="498" y="246" font-size="9" fill="#5C6473">SLEEP</text>
      <text x="498" y="262" font-size="14" font-weight="600" fill="#F4F6FB">7.4h</text>
      <text x="612" y="246" font-size="9" fill="#5C6473">STEPS</text>
      <text x="612" y="262" font-size="14" font-weight="600" fill="#F4F6FB">8,912</text>
      <text x="720" y="246" font-size="9" fill="#5C6473">HYDRATION</text>
      <text x="720" y="262" font-size="14" font-weight="600" fill="#9BA3B4">low</text>
    </g>

    <!-- AI insight bubble -->
    <g class="insight">
      <rect x="494" y="284" width="318" height="48" rx="8" fill="#14171F"/>
      <rect x="494" y="284" width="3" height="48" fill="#4EA7FF"/>
      <circle cx="510" cy="300" r="3" fill="#4EA7FF"/>
      <text x="522" y="303" font-size="9" font-weight="600" letter-spacing="1" fill="#9BA3B4">AI INSIGHT</text>
      <text x="510" y="322" font-size="11" fill="#F4F6FB">Hydration is low &#8212; consider drinking water soon.</text>
    </g>
  </g>
  <rect width="890" height="380" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
