<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 300" width="890" height="300" role="img" aria-label="Let's connect — contact Jeet Mondal">
  <defs>
    <radialGradient id="mesh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.08"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.30"/><stop offset="0.6" stop-color="#4EA7FF" stop-opacity="0.06"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="shell2" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#9BC4FF" stop-opacity="0.10"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0.12"/></radialGradient>
    <radialGradient id="core2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#EAF2FF" stop-opacity="0.95"/><stop offset="0.4" stop-color="#9BC4FF" stop-opacity="0.5"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="35"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="300"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.22,.61,.36,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.26s}.d3{animation-delay:.42s}.d4{animation-delay:.58s}.d5{animation-delay:.74s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .glow2{animation:g2 6s ease-in-out infinite alternate;transform-origin:700px 150px}
    @keyframes g2{from{opacity:.8;transform:scale(1)}to{opacity:1;transform:scale(1.06)}}
    .core2{animation:c2 6.5s ease-in-out infinite alternate;transform-origin:700px 150px}
    @keyframes c2{from{transform:scale(0.95)}to{transform:scale(1.05)}}
    .ring2{transform-origin:700px 150px;animation:r2 50s linear infinite}
    @keyframes r2{from{transform:rotate(-12deg)}to{transform:rotate(348deg)}}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="890" height="300" fill="#06070B"/>
    <circle class="mesh" cx="200" cy="150" r="280" fill="url(#mesh)"/>
    <text x="826" y="210" text-anchor="end" font-size="120" font-weight="700" fill="#0E1016" opacity="0.5" letter-spacing="-4">10</text>

    <!-- small Orb echo -->
    <circle class="glow2" cx="700" cy="150" r="100" fill="url(#glow2)"/>
    <g class="ring2"><ellipse cx="700" cy="150" rx="78" ry="26" fill="none" stroke="#9BC4FF" stroke-opacity="0.22" stroke-width="1"/></g>
    <circle cx="700" cy="150" r="44" fill="url(#shell2)" stroke="#4EA7FF" stroke-opacity="0.22" stroke-width="1"/>
    <g class="core2"><circle cx="700" cy="150" r="22" fill="url(#core2)"/></g>
    <path d="M676,130 A44,44 0 0,1 700,108" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.4" stroke-linecap="round"/>

    <!-- typography -->
    <g class="rise d1">
      <rect x="64" y="56" width="22" height="2" fill="#4EA7FF"/>
      <text x="94" y="64" font-size="11" letter-spacing="3" fill="#9BA3B4">CONTACT</text>
    </g>
    <text class="rise d2" x="62" y="148" font-size="60" font-weight="600" letter-spacing="-1.2" fill="#F4F6FB">Let's connect.</text>
    <text class="rise d3" x="64" y="186" font-size="16" fill="#9BA3B4">Open to products, AI, and good conversation.</text>

    <g class="rise d4">
      <line x1="64" y1="232" x2="826" y2="232" stroke="#1C2030"/>
      <circle class="pulse" cx="70" cy="262" r="3" fill="#4EA7FF"/>
      <text x="80" y="266" font-size="13" fill="#9BA3B4">Jeet Mondal &#183; Full Stack Developer &amp; AI Engineer</text>
      <text x="826" y="266" text-anchor="end" font-size="12" fill="#5C6473">jeetmondal1685@gmail.com</text>
    </g>
  </g>
  <rect width="890" height="300" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
