<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" overflow="hidden" role="img" aria-label="Project: EliteZero">
  <defs>
    <linearGradient id="p4Gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/><stop offset="50%" stop-color="#FFD700"/><stop offset="100%" stop-color="#B8860B"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="p4Shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <filter id="p4Glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="p4Clip"><rect x="0" y="0" width="400" height="200" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#p4Clip)">
    <rect x="1" y="1" width="398" height="198" rx="12" fill="#1E1F22" stroke="#36373B" stroke-width="2"/>
    <rect x="1" y="1" width="398" height="198" rx="12" fill="none" stroke="#D4AF37" stroke-width="1.2">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.4s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <!-- ambient gold fx -->
    <g fill="#FFE9A0">
      <circle cx="322" r="1.2" cy="205"><animate attributeName="cy" values="205;-5" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.45;0" keyTimes="0;0.12;0.85;1" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="356" r="1" cy="205" fill="#D4AF37"><animate attributeName="cy" values="205;-5" dur="13s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.45;0.4;0" keyTimes="0;0.12;0.85;1" dur="13s" begin="-5s" repeatCount="indefinite"/></circle>
      <circle cx="380" r="1.3" cy="205"><animate attributeName="cy" values="205;-5" dur="11.5s" begin="-2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.45;0" keyTimes="0;0.12;0.85;1" dur="11.5s" begin="-2.5s" repeatCount="indefinite"/></circle>
      <g transform="translate(334,58)"><path d="M0,-2.6 L0.7,-0.7 L2.6,0 L0.7,0.7 L0,2.6 L-0.7,0.7 L-2.6,0 L-0.7,-0.7 Z"/><animate attributeName="opacity" values="0;0.6;0" dur="3.4s" repeatCount="indefinite"/></g>
      <g transform="translate(372,96)"><path d="M0,-2.6 L0.7,-0.7 L2.6,0 L0.7,0.7 L0,2.6 L-0.7,0.7 L-2.6,0 L-0.7,-0.7 Z"/><animate attributeName="opacity" values="0;0.55;0" dur="4.3s" begin="-1.9s" repeatCount="indefinite"/></g>
      <g transform="translate(306,148)"><path d="M0,-2.6 L0.7,-0.7 L2.6,0 L0.7,0.7 L0,2.6 L-0.7,0.7 L-2.6,0 L-0.7,-0.7 Z"/><animate attributeName="opacity" values="0;0.5;0" dur="3.7s" begin="-2.6s" repeatCount="indefinite"/></g>
    </g>
    <rect x="1" y="1" width="398" height="30" fill="#0A0A0B"/>
    <circle cx="20" cy="16" r="4" fill="#FF5F56"/><circle cx="34" cy="16" r="4" fill="#FFBD2E"/><circle cx="48" cy="16" r="4" fill="#27C93F"/>
    <text x="390" y="20" font-family="Consolas, monospace" font-size="10" fill="#6E6F74" text-anchor="end">~/projects/elitezero</text>

    <!-- icon : discord bot -->
    <g transform="translate(44, 92)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#D4AF37" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <g filter="url(#p4Glow)">
        <animateTransform attributeName="transform" type="translate" values="0 -1.5; 0 1.5; 0 -1.5" dur="3s" repeatCount="indefinite" additive="sum"/>
        <path transform="scale(0.4) translate(-63.57,-48.18)" fill="#5865F2" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
      </g>
      <circle cx="20" cy="18" r="4" fill="#27C93F" stroke="#1E1F22" stroke-width="1.5">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="92" y="66" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="21" fill="url(#p4Gold)">ELITEZERO</text>
    <text x="92" y="90" font-family="Consolas, monospace" font-size="11" fill="#E8E8E8">Discord bot with advanced features —</text>
    <text x="92" y="106" font-family="Consolas, monospace" font-size="11" fill="#E8E8E8">moderation, automation &amp; much more.</text>

    <!-- tech tags -->
    <g font-family="Consolas, monospace" font-size="10" text-anchor="middle">
      <rect x="92" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#61DAFB" stroke-width="1"/><text x="123" y="136" fill="#61DAFB">React</text>
      <rect x="162" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#3776AB" stroke-width="1"/><text x="193" y="136" fill="#3776AB">Python</text>
      <rect x="232" y="122" width="62" height="20" rx="10" fill="#0A0A0B" stroke="#E76F00" stroke-width="1"/><text x="263" y="136" fill="#E76F00">Java</text>
    </g>

    <!-- footer -->
    <line x1="16" y1="158" x2="384" y2="158" stroke="#36373B" stroke-width="1"/>
    <text x="20" y="180" font-family="Consolas, monospace" font-size="10" fill="#6E6F74">$ elitezero --deploy bot <tspan fill="#FFD700">█<animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></tspan></text>
    <text x="384" y="180" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="10" fill="#D4AF37" text-anchor="end">VIEW REPO →</text>

    <!-- shine sweep (clipped) -->
    <rect x="-140" y="0" width="70" height="200" fill="url(#p4Shine)" transform="skewX(-18)">
      <animate attributeName="x" values="-605;475" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
