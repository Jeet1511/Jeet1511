<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" width="440" height="230" role="img" aria-label="EliteZero">
  <defs>
    <linearGradient id="zbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#070a1c"/>
    </linearGradient>
    <radialGradient id="zscene" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="zcore" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset=".6" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </radialGradient>
    <filter id="zglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="zclip"><rect x="4" y="4" width="432" height="222" rx="18"/></clipPath>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      @keyframes sp{to{transform:rotate(360deg)}}
      @keyframes spR{to{transform:rotate(-360deg)}}
      .pu{animation:puA 3s ease-in-out infinite;transform-origin:220px 54px}
      @keyframes puA{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
      .scan{animation:scanY 3.2s ease-in-out infinite alternate}
      @keyframes scanY{from{transform:translateY(-38px)}to{transform:translateY(38px)}}
      .tw{animation:twA 2.4s ease-in-out infinite}
      @keyframes twA{0%,100%{opacity:.15}50%{opacity:1}}
    </style>
  </defs>

  <rect x="4" y="4" width="432" height="222" rx="18" fill="url(#zbg)" stroke="#1b2340"/>
  <g clip-path="url(#zclip)">
    <rect x="4" y="4" width="432" height="104" fill="url(#zscene)"/>
    <circle class="tw" cx="70" cy="30" r="1.5" fill="#ddd6fe"/>
    <circle class="tw" cx="120" cy="80" r="1.3" fill="#ddd6fe" style="animation-delay:-.7s"/>
    <circle class="tw" cx="330" cy="76" r="1.4" fill="#ddd6fe" style="animation-delay:-1.3s"/>
    <circle class="tw" cx="380" cy="28" r="1.5" fill="#ddd6fe" style="animation-delay:-.4s"/>

    <!-- scan line -->
    <rect class="scan" x="60" y="53" width="320" height="1.6" fill="#a78bfa" opacity=".45"/>

    <!-- HUD -->
    <g style="transform-origin:220px 54px;animation:sp 7s linear infinite">
      <circle cx="220" cy="54" r="26" fill="none" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="6 5" opacity=".8"/>
    </g>
    <g style="transform-origin:220px 54px;animation:spR 11s linear infinite">
      <circle cx="220" cy="54" r="37" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2 6" opacity=".6"/>
      <circle cx="257" cy="54" r="2.6" fill="#c4b5fd"/>
    </g>
    <circle class="pu" cx="220" cy="54" r="15" fill="url(#zcore)" filter="url(#zglow)"/>
    <text x="220" y="59" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">EZ</text>

    <!-- brackets -->
    <path d="M150,38 v-8 h10 M150,70 v8 h10" fill="none" stroke="#8b5cf6" stroke-opacity=".7" stroke-width="1.6" transform="translate(-6,-8)"/>
    <path d="M290,38 v-8 h-10 M290,70 v8 h-10" fill="none" stroke="#8b5cf6" stroke-opacity=".7" stroke-width="1.6" transform="translate(6,-8)"/>

    <!-- status badge -->
    <rect x="296" y="18" width="126" height="24" rx="12" fill="#2e1065" fill-opacity=".7" stroke="#a78bfa" stroke-opacity=".55"/>
    <circle cx="312" cy="30" r="3" fill="#a78bfa"/>
    <text x="322" y="34" font-size="10.5" font-weight="600" fill="#c4b5fd">IN DEVELOPMENT</text>
  </g>
  <line x1="4" y1="108" x2="436" y2="108" stroke="#1b2340" stroke-width="1"/>

  <text x="24" y="140" font-size="19" font-weight="750" fill="#f1f5f9">EliteZero</text>
  <text x="24" y="162" font-size="12" fill="#94a3b8">Modular AI operating environment that orchestrates</text>
  <text x="24" y="179" font-size="12" fill="#94a3b8">models, automations and developer workflows.</text>

  <g font-size="10.5" fill="#cbd5e1">
    <rect x="24" y="192" width="58" height="20" rx="10" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-opacity=".35"/>
    <circle cx="36" cy="202" r="2.4" fill="#38bdf8"/><text x="44" y="206">React</text>
    <rect x="90" y="192" width="66" height="20" rx="10" fill="#6cc24a" fill-opacity=".08" stroke="#6cc24a" stroke-opacity=".35"/>
    <circle cx="102" cy="202" r="2.4" fill="#6cc24a"/><text x="110" y="206">Node.js</text>
    <rect x="164" y="192" width="82" height="20" rx="10" fill="#3178c6" fill-opacity=".08" stroke="#3178c6" stroke-opacity=".4"/>
    <circle cx="176" cy="202" r="2.4" fill="#3178c6"/><text x="184" y="206">TypeScript</text>
  </g>

  <circle cx="404" cy="202" r="14" fill="none" stroke="#334155" stroke-width="1.2"/>
  <text x="404" y="207" text-anchor="middle" font-size="12" fill="#94a3b8">&#8599;</text>
</svg>
