<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 380" width="890" height="380" role="img" aria-label="VM-Manager — infrastructure tooling">
  <defs>
    <radialGradient id="mesh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.07"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="shm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="27"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="380"/></clipPath>
    <clipPath id="bar1"><rect x="360" y="314" width="120" height="12" rx="2"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.22,.61,.36,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.26s}.d3{animation-delay:.42s}.d4{animation-delay:.58s}.d5{animation-delay:.74s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .shm{animation:shm 3.4s ease-in-out infinite}
    @keyframes shm{0%{transform:translateX(-40px)}60%{transform:translateX(120px)}100%{transform:translateX(120px)}}
    .pulse{animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="890" height="380" fill="#06070B"/>
    <circle cx="720" cy="120" r="260" fill="url(#mesh)"/>
    <text x="826" y="160" text-anchor="end" font-size="120" font-weight="700" fill="#0E1016" opacity="0.5" letter-spacing="-4">08</text>

    <!-- text top -->
    <g class="rise d1">
      <rect x="64" y="58" width="22" height="2" fill="#4EA7FF"/>
      <text x="94" y="66" font-size="11" letter-spacing="3" fill="#9BA3B4">INFRASTRUCTURE TOOLING</text>
    </g>
    <text class="rise d2" x="62" y="112" font-size="32" font-weight="650" letter-spacing="-.4" fill="#F4F6FB">VM-Manager</text>
    <g class="rise d3">
      <text x="64" y="146" font-size="15" fill="#9BA3B4">A clean control panel to create, monitor,</text>
      <text x="64" y="168" font-size="15" fill="#9BA3B4">and manage virtual machines at scale.</text>
    </g>
    <line class="rise d4" x1="64" y1="196" x2="826" y2="196" stroke="#1C2030"/>
    <text class="rise d4" x="64" y="220" font-size="12.5" fill="#9BA3B4">Python &#183; Docker &#183; Git</text>
    <g class="rise d5">
      <circle class="pulse" cx="70" cy="248" r="3" fill="#4EA7FF"/>
      <text x="80" y="252" font-size="12" fill="#9BA3B4">Maintained</text>
      <text x="826" y="252" text-anchor="end" font-size="13" font-weight="500" fill="#4EA7FF">View repository &#8594;</text>
    </g>

    <!-- table mock -->
    <rect x="64" y="278" width="762" height="86" rx="10" fill="#0E1016" stroke="#1C2030"/>
    <text x="84" y="298" font-size="8" letter-spacing="1.5" fill="#5C6473">INSTANCE</text>
    <text x="360" y="298" font-size="8" letter-spacing="1.5" fill="#5C6473">CPU</text>
    <text x="540" y="298" font-size="8" letter-spacing="1.5" fill="#5C6473">MEMORY</text>
    <text x="740" y="298" font-size="8" letter-spacing="1.5" fill="#5C6473">STATUS</text>
    <line x1="78" y1="306" x2="812" y2="306" stroke="#1C2030"/>

    <!-- row 1 -->
    <rect x="84" y="316" width="90" height="5" rx="2" fill="#9BA3B4"/>
    <rect x="84" y="325" width="52" height="3" rx="1.5" fill="#5C6473"/>
    <rect x="360" y="318" width="120" height="5" rx="2" fill="#1C2030"/>
    <rect x="360" y="318" width="84" height="5" rx="2" fill="#4EA7FF"/>
    <g clip-path="url(#bar1)"><rect class="shm" x="360" y="316" width="40" height="9" fill="url(#shm)"/></g>
    <rect x="540" y="318" width="100" height="5" rx="2" fill="#1C2030"/>
    <rect x="540" y="318" width="58" height="5" rx="2" fill="#9BA3B4"/>
    <circle class="pulse" cx="746" cy="320" r="3" fill="#4EA7FF"/>
    <text x="756" y="323" font-size="9" fill="#9BA3B4">running</text>
    <line x1="78" y1="338" x2="812" y2="338" stroke="#1C2030"/>

    <!-- row 2 -->
    <rect x="84" y="348" width="78" height="5" rx="2" fill="#9BA3B4"/>
    <rect x="84" y="357" width="44" height="3" rx="1.5" fill="#5C6473"/>
    <rect x="360" y="350" width="120" height="5" rx="2" fill="#1C2030"/>
    <rect x="360" y="350" width="62" height="5" rx="2" fill="#9BA3B4"/>
    <rect x="540" y="350" width="100" height="5" rx="2" fill="#1C2030"/>
    <rect x="540" y="350" width="40" height="5" rx="2" fill="#9BA3B4"/>
    <circle cx="746" cy="352" r="3" fill="#5C6473"/>
    <text x="756" y="355" font-size="9" fill="#5C6473">idle</text>
  </g>
  <rect width="890" height="380" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
