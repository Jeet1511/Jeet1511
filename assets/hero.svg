<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 400" width="890" height="400" role="img" aria-label="Jeet Mondal - Hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040218"/>
      <stop offset=".55" stop-color="#070b26"/>
      <stop offset="1" stop-color="#02010c"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nebC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebV" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".26"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#6366f1" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </radialGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="tg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="btnG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ringC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="ringV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="ringB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="waveG1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shootG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .mono{font-family:'Cascadia Code','Fira Code',Consolas,monospace}
      .st{animation:tw 2.8s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.12}50%{opacity:1}}
      @keyframes sp{to{transform:rotate(360deg)}}
      @keyframes spR{to{transform:rotate(-360deg)}}
      .pu{animation:pu 4.5s ease-in-out infinite;transform-origin:645px 195px}
      @keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
      .fl{animation:fl 5.5s ease-in-out infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      .fw{animation:fw 7s linear infinite}
      @keyframes fw{to{stroke-dashoffset:-140}}
      .sh{opacity:0;animation:shk 8s linear infinite}
      .sh2{animation-delay:3.6s}
      @keyframes shk{0%{transform:translate(0,0);opacity:0}3%{opacity:1}16%{transform:translate(-430px,172px);opacity:0}100%{transform:translate(-430px,172px);opacity:0}}
      .wh{animation:wh 1.9s ease-in-out infinite}
      @keyframes wh{0%,100%{transform:translateY(0);opacity:1}70%{transform:translateY(6px);opacity:.15}}
      .bar{transform-origin:58px 185px;animation:barA 3.6s ease-in-out infinite alternate}
      @keyframes barA{from{transform:scaleX(.5)}to{transform:scaleX(1)}}
      .neb{animation:nebA 9s ease-in-out infinite alternate}
      @keyframes nebA{from{opacity:.5}to{opacity:.85}}
    </style>
  </defs>

  <!-- panel -->
  <rect x="4" y="4" width="882" height="392" rx="24" fill="url(#bg)" stroke="#1b2340"/>
  <rect x="70" y="4" width="750" height="1.6" fill="url(#edge)" opacity=".8"/>

  <!-- nebulas -->
  <ellipse class="neb" cx="690" cy="88" rx="280" ry="130" fill="url(#nebC)"/>
  <ellipse class="neb" cx="560" cy="330" rx="300" ry="120" fill="url(#nebV)" style="animation-delay:-4s"/>
  <ellipse class="neb" cx="130" cy="60" rx="210" ry="95" fill="url(#nebV)" opacity=".5" style="animation-delay:-2s"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="st" cx="80" cy="120" r="1.4"/>
    <circle class="st" cx="150" cy="40" r="1.1" style="animation-delay:-.6s"/>
    <circle class="st" cx="240" cy="90" r="1.6" style="animation-delay:-1.2s"/>
    <circle class="st" cx="330" cy="50" r="1.2" style="animation-delay:-2s"/>
    <circle class="st" cx="410" cy="120" r="1.4" style="animation-delay:-.9s"/>
    <circle class="st" cx="470" cy="60" r="1.1" style="animation-delay:-1.7s"/>
    <circle class="st" cx="520" cy="140" r="1.5" style="animation-delay:-.3s"/>
    <circle class="st" cx="600" cy="40" r="1.2" style="animation-delay:-2.3s"/>
    <circle class="st" cx="700" cy="150" r="1.3" style="animation-delay:-1.4s"/>
    <circle class="st" cx="780" cy="60" r="1.7" style="animation-delay:-.8s"/>
    <circle class="st" cx="850" cy="120" r="1.2" style="animation-delay:-1.9s"/>
    <circle class="st" cx="840" cy="220" r="1.5" style="animation-delay:-.5s"/>
    <circle class="st" cx="860" cy="300" r="1.1" style="animation-delay:-2.5s"/>
    <circle class="st" cx="760" cy="330" r="1.4" style="animation-delay:-1.1s"/>
    <circle class="st" cx="660" cy="350" r="1.2" style="animation-delay:-.2s"/>
    <circle class="st" cx="540" cy="330" r="1.3" style="animation-delay:-1.6s"/>
    <circle class="st" cx="430" cy="300" r="1.1" style="animation-delay:-2.1s"/>
    <circle class="st" cx="380" cy="350" r="1.5" style="animation-delay:-.7s"/>
    <circle class="st" cx="250" cy="330" r="1.2" style="animation-delay:-1.3s"/>
    <circle class="st" cx="120" cy="300" r="1.4" style="animation-delay:-1.8s"/>
    <circle class="st" cx="60" cy="220" r="1.1" style="animation-delay:-.4s"/>
    <circle class="st" cx="500" cy="220" r="1.6" fill="#67e8f9" style="animation-delay:-.9s"/>
    <circle class="st" cx="730" cy="250" r="1.6" fill="#c4b5fd" style="animation-delay:-1.5s"/>
    <circle class="st" cx="300" cy="180" r="1.5" fill="#93c5fd" style="animation-delay:-2.4s"/>
  </g>

  <!-- shooting stars -->
  <g class="sh" transform="translate(820,54)">
    <line x1="0" y1="0" x2="72" y2="-29" stroke="url(#shootG)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.4" fill="#ffffff"/>
  </g>
  <g class="sh sh2" transform="translate(700,26)">
    <line x1="0" y1="0" x2="56" y2="-22" stroke="url(#shootG)" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#a5f3fc"/>
  </g>

  <!-- floating geometry -->
  <path class="fl" d="M424,74 l14,22 h-28 z" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.4"/>
  <circle class="fl" cx="392" cy="306" r="9" fill="none" stroke="#8b5cf6" stroke-opacity=".5" stroke-width="1.4" style="animation-delay:-2.6s"/>
  <path class="st" d="M842,330 v12 M836,336 h12" stroke="#f0abfc" stroke-width="2" stroke-linecap="round" style="animation-delay:-1s"/>

  <!-- ===== orbital system ===== -->
  <circle cx="645" cy="195" r="152" fill="url(#halo)"/>
  <ellipse cx="645" cy="195" rx="172" ry="46" fill="none" stroke="#22d3ee" stroke-opacity=".14" transform="rotate(-24 645 195)"/>
  <ellipse cx="645" cy="195" rx="172" ry="46" fill="none" stroke="#8b5cf6" stroke-opacity=".14" transform="rotate(18 645 195)"/>

  <g style="transform-origin:645px 195px;animation:sp 11s linear infinite">
    <circle cx="645" cy="195" r="78" fill="none" stroke="url(#ringC)" stroke-width="1" stroke-dasharray="3 6" opacity=".85"/>
    <circle cx="723" cy="195" r="6" fill="#22d3ee" filter="url(#glow)"/>
  </g>
  <g style="transform-origin:645px 195px;animation:spR 17s linear infinite">
    <circle cx="645" cy="195" r="112" fill="none" stroke="url(#ringV)" stroke-width="1" stroke-dasharray="4 8" opacity=".7"/>
    <circle cx="757" cy="195" r="8" fill="#8b5cf6" filter="url(#glow)"/>
    <g style="transform-origin:757px 195px;animation:sp 3.4s linear infinite">
      <circle cx="766" cy="195" r="2.6" fill="#e2e8f0"/>
    </g>
  </g>
  <g style="transform-origin:645px 195px;animation:sp 26s linear infinite">
    <circle cx="645" cy="195" r="146" fill="none" stroke="url(#ringB)" stroke-width="1" stroke-dasharray="2 7" opacity=".55"/>
    <circle cx="791" cy="195" r="4.6" fill="#3b82f6" filter="url(#glow)"/>
    <circle cx="499" cy="195" r="2.8" fill="#67e8f9"/>
  </g>

  <!-- core -->
  <circle class="pu" cx="645" cy="195" r="44" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="645" cy="195" r="44" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="1"/>
  <g style="transform-origin:645px 195px;animation:sp 9s linear infinite">
    <circle cx="645" cy="195" r="56" fill="none" stroke="#67e8f9" stroke-opacity=".6" stroke-width="1" stroke-dasharray="1 6"/>
  </g>
  <text x="645" y="210" text-anchor="middle" font-size="42" font-weight="800" fill="url(#tg2)">J</text>

  <!-- ===== left text block ===== -->
  <text x="56" y="46" class="mono" font-size="12" letter-spacing="4" fill="#475569">01 · HERO</text>

  <rect x="56" y="88" width="34" height="2.4" fill="#22d3ee"/>
  <text x="102" y="94" font-size="13" letter-spacing="5" fill="#22d3ee">WELCOME TO MY UNIVERSE</text>

  <text x="56" y="170" font-size="62" font-weight="800" letter-spacing="1" fill="#f8fafc">JEET<tspan fill="url(#tg)">1511</tspan></text>
  <rect class="bar" x="58" y="184" width="212" height="3" rx="1.5" fill="url(#tg)" opacity=".85"/>

  <text x="56" y="218" font-size="19" fill="#e2e8f0">Building AI-powered products</text>
  <text x="56" y="244" font-size="19" fill="#94a3b8">that solve real-world problems.</text>

  <!-- role pills -->
  <g font-size="12" fill="#cbd5e1">
    <rect x="56" y="264" width="88" height="26" rx="13" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".45"/>
    <circle cx="72" cy="277" r="3" fill="#22d3ee"/>
    <text x="82" y="281">Student</text>
    <rect x="152" y="264" width="166" height="26" rx="13" fill="#8b5cf6" fill-opacity=".1" stroke="#8b5cf6" stroke-opacity=".45"/>
    <circle cx="168" cy="277" r="3" fill="#a78bfa"/>
    <text x="178" y="281">Full Stack Developer</text>
    <rect x="326" y="264" width="116" height="26" rx="13" fill="#ec4899" fill-opacity=".1" stroke="#ec4899" stroke-opacity=".45"/>
    <circle cx="342" cy="277" r="3" fill="#f472b6"/>
    <text x="352" y="281">AI Engineer</text>
  </g>

  <!-- buttons -->
  <rect x="56" y="312" width="152" height="38" rx="10" fill="url(#btnG)"/>
  <text x="132" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Explore Projects &#8594;</text>
  <rect x="218" y="312" width="150" height="38" rx="10" fill="#0b1026" fill-opacity=".85" stroke="#334155"/>
  <g transform="translate(240,324) scale(.06)" fill="#e2e8f0">
    <path d="M120 0C53.7 0 0 53.7 0 120c0 53 34.4 98 82 113.8 6 1.2 8.2-2.6 8.2-5.8 0-2.8-.1-12.2-.2-22.2-33.4 7.2-40.4-14.2-40.4-14.2-5.4-13.8-13.3-17.5-13.3-17.5-10.8-7.4.8-7.2.8-7.2 12 .8 18.4 12.4 18.4 12.4 10.7 18.3 28 13 34.8 9.9 1-7.7 4.1-13 7.6-16-26.6-3-54.6-13.3-54.6-59.2 0-13.1 4.7-23.8 12.3-32.2-1.2-3-5.3-15.2 1.2-31.7 0 0 10-3.2 32.9 12.3a114 114 0 0 1 59.8 0c22.8-15.5 32.8-12.3 32.8-12.3 6.5 16.5 2.4 28.7 1.2 31.7 7.7 8.4 12.3 19.1 12.3 32.2 0 46-28.1 56.1-54.8 59.1 4.3 3.7 8.1 11 8.1 22.2 0 16-.2 29-.2 33 0 3.2 2.2 7 8.3 5.8A120.2 120.2 0 0 0 240 120C240 53.7 186.3 0 120 0z"/>
  </g>
  <text x="312" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">View on GitHub</text>

  <!-- scroll hint -->
  <rect x="56" y="362" width="16" height="26" rx="8" fill="none" stroke="#475569" stroke-width="1.4"/>
  <circle class="wh" cx="64" cy="369" r="1.8" fill="#22d3ee"/>
  <text x="80" y="379" font-size="11" fill="#64748b">Scroll to explore</text>

  <!-- flowing waves -->
  <path d="M4,378 C140,362 300,392 445,376 C590,360 740,392 886,374 L886,396 L4,396 Z" fill="url(#waveFill)"/>
  <path class="fw" d="M4,378 C140,362 300,392 445,376 C590,360 740,392 886,374" fill="none" stroke="url(#waveG1)" stroke-width="1.6" stroke-dasharray="8 10" stroke-linecap="round"/>
  <path class="fw" d="M4,388 C160,374 320,398 470,386 C620,374 760,398 886,384" fill="none" stroke="#8b5cf6" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 7" style="animation-duration:10s"/>
</svg>
