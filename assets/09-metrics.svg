<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 140" width="890" height="140" role="img" aria-label="GitHub Metrics">
  <defs>
    <radialGradient id="mesh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.07"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="glowseg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0"/><stop offset="0.5" stop-color="#4EA7FF"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></linearGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="31"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="140"/></clipPath>
    <clipPath id="line"><rect x="64" y="100" width="762" height="2" rx="1"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.22,.61,.36,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.26s}.d3{animation-delay:.42s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .seg{animation:seg 5s ease-in-out infinite}
    @keyframes seg{0%{transform:translateX(0)}50%{transform:translateX(620px)}100%{transform:translateX(0)}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="890" height="140" fill="#06070B"/>
    <circle cx="445" cy="70" r="220" fill="url(#mesh)"/>
    <text x="826" y="92" text-anchor="end" font-size="72" font-weight="700" fill="#0E1016" opacity="0.5" letter-spacing="-3">09</text>
    <g class="rise d1">
      <rect x="64" y="40" width="22" height="2" fill="#4EA7FF"/>
      <text x="94" y="48" font-size="11" letter-spacing="3" fill="#9BA3B4">GITHUB ACTIVITY</text>
    </g>
    <text class="rise d2" x="62" y="82" font-size="28" font-weight="600" letter-spacing="-.4" fill="#F4F6FB">Metrics</text>
    <text class="rise d3" x="826" y="82" text-anchor="end" font-size="12" fill="#5C6473">Live from GitHub</text>
    <line x1="64" y1="101" x2="826" y2="101" stroke="#1C2030" stroke-width="1"/>
    <g clip-path="url(#line)"><rect class="seg" x="64" y="100" width="140" height="2" fill="url(#glowseg)"/></g>
  </g>
  <rect width="890" height="140" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
