<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 200" width="890" height="200" role="img" aria-label="Technology — TypeScript, React, Next.js, Node.js, Python, MongoDB, Docker, Git">
  <defs>
    <radialGradient id="mesh" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4EA7FF" stop-opacity="0.08"/><stop offset="1" stop-color="#4EA7FF" stop-opacity="0"/></radialGradient>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" seed="5"/><feColorMatrix type="saturate" values="0"/></filter>
    <clipPath id="frame"><rect width="890" height="200"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
    .rise{opacity:0;animation:rise 1.1s cubic-bezier(.22,.61,.36,1) forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.26s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .mesh{animation:mx 26s ease-in-out infinite alternate}
    @keyframes mx{from{opacity:.6;transform:translate(0,0)}to{opacity:1;transform:translate(-12px,6px)}}
    .ic{stroke:#5C6473;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;animation:illum 9s ease-in-out infinite}
    @keyframes illum{0%,100%{stroke:#5C6473}50%{stroke:#F4F6FB}}
    .lbl{fill:#5C6473;animation:lbl 9s ease-in-out infinite}
    @keyframes lbl{0%,100%{fill:#5C6473}50%{fill:#9BA3B4}}
    .div{stroke-dasharray:760;stroke-dashoffset:760;animation:draw 2.2s cubic-bezier(.22,.61,.36,1) .5s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="890" height="200" fill="#06070B"/>
    <circle class="mesh" cx="445" cy="100" r="300" fill="url(#mesh)"/>
    <text x="826" y="132" text-anchor="end" font-size="120" font-weight="700" fill="#0E1016" opacity="0.55" letter-spacing="-4">03</text>
    <g class="rise d1">
      <rect x="64" y="40" width="22" height="2" fill="#4EA7FF"/>
      <text x="94" y="48" font-size="11" letter-spacing="3" fill="#9BA3B4">TECHNOLOGY</text>
    </g>

    <g class="rise d2">
      <!-- TypeScript -->
      <g class="ic" style="animation-delay:0s"><rect x="101" y="85" width="22" height="22" rx="5"/><line x1="107" y1="96" x2="117" y2="96"/></g>
      <text class="lbl" x="112" y="128" text-anchor="middle" font-size="11" style="animation-delay:0s">TypeScript</text>
      <!-- React (diamond, not orbit) -->
      <g class="ic" style="animation-delay:.45s"><path d="M207,82 L218,96 L207,110 L196,96 Z"/><circle cx="207" cy="96" r="1.8" fill="#5C6473" stroke="none"/></g>
      <text class="lbl" x="207" y="128" text-anchor="middle" font-size="11" style="animation-delay:.45s">React</text>
      <!-- Next.js (triangle) -->
      <g class="ic" style="animation-delay:.9s"><path d="M293,83 L315,96 L293,109 Z"/></g>
      <text class="lbl" x="302" y="128" text-anchor="middle" font-size="11" style="animation-delay:.9s">Next.js</text>
      <!-- Node.js (hexagon) -->
      <g class="ic" style="animation-delay:1.35s"><path d="M397,84 L405,84 L410,92 L410,100 L405,108 L397,108 L392,100 L392,92 Z"/></g>
      <text class="lbl" x="397" y="128" text-anchor="middle" font-size="11" style="animation-delay:1.35s">Node.js</text>
      <!-- Python (interlocking rects) -->
      <g class="ic" style="animation-delay:1.8s"><rect x="483" y="86" width="12" height="8" rx="2"/><rect x="491" y="94" width="12" height="8" rx="2"/></g>
      <text class="lbl" x="493" y="128" text-anchor="middle" font-size="11" style="animation-delay:1.8s">Python</text>
      <!-- MongoDB (leaf) -->
      <g class="ic" style="animation-delay:2.25s"><path d="M588,82 C596,92 596,104 588,112 C580,104 580,92 588,82 Z"/><line x1="588" y1="86" x2="588" y2="108"/></g>
      <text class="lbl" x="588" y="128" text-anchor="middle" font-size="11" style="animation-delay:2.25s">MongoDB</text>
      <!-- Docker (containers) -->
      <g class="ic" style="animation-delay:2.7s"><rect x="673" y="96" width="7" height="7" rx="1"/><rect x="682" y="96" width="7" height="7" rx="1"/><rect x="691" y="96" width="7" height="7" rx="1"/><line x1="669" y1="106" x2="699" y2="106"/></g>
      <text class="lbl" x="683" y="128" text-anchor="middle" font-size="11" style="animation-delay:2.7s">Docker</text>
      <!-- Git (branch) -->
      <g class="ic" style="animation-delay:3.15s"><circle cx="770" cy="104" r="2.2"/><circle cx="786" cy="90" r="2.2"/><circle cx="786" cy="104" r="2.2"/><path d="M770,104 L786,104 M786,104 L786,90"/></g>
      <text class="lbl" x="778" y="128" text-anchor="middle" font-size="11" style="animation-delay:3.15s">Git</text>
    </g>

    <line class="div" x1="64" y1="160" x2="826" y2="160" stroke="#1C2030" stroke-width="1"/>
  </g>
  <rect width="890" height="200" fill="#000000" opacity="0.03" filter="url(#grain)"/>
</svg>
