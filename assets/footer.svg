<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 150" width="890" height="150" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a1c"/>
      <stop offset="1" stop-color="#04061a"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#22d3ee" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="fhex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <clipPath id="fclip"><rect x="4" y="4" width="882" height="142" rx="20"/></clipPath>
    <style>
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .beat{animation:beatA 1.6s ease-in-out infinite;transform-origin:445px 105px}
      @keyframes beatA{0%,100%{transform:scale(1)}25%{transform:scale(1.25)}40%{transform:scale(1)}}
    </style>
  </defs>

  <rect x="4" y="4" width="882" height="142" rx="20" fill="url(#fbg)" stroke="#1b2340"/>

  <g clip-path="url(#fclip)">
    <g>
      <path d="M0,112 C148,96 296,126 445,112 C593,98 741,126 890,112 C1038,98 1186,126 1335,112 C1483,98 1631,126 1780,112 V146 H0 Z" fill="url(#w1)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-890 0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M0,124 C160,110 320,136 480,124 C640,112 800,138 890,126 C1038,112 1186,138 1335,126 C1483,114 1631,138 1780,126 V146 H0 Z" fill="url(#w2)">
        <animateTransform attributeName="transform" type="translate" from="-890 0" to="0 0" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- monogram -->
  <polygon points="461,34 454.5,45.3 436.5,45.3 430,34 436.5,22.7 454.5,22.7" fill="url(#fhex)" stroke="#22d3ee" stroke-opacity=".6"/>
  <text x="445.5" y="39" text-anchor="middle" font-size="12" font-weight="800" fill="#f8fafc">J</text>

  <text x="445" y="74" text-anchor="middle" font-size="15" fill="#94a3b8">Let&#8217;s build the future together.</text>

  <text x="436" y="108" text-anchor="end" font-size="12" fill="#64748b">Built with</text>
  <path class="beat" d="M445,110 c-2.2-3.2-8-1.6-8,2 0,2.6 4,5.6 8,8.2 4,-2.6 8,-5.6 8,-8.2 0,-3.6 -5.8,-5.2 -8,-2 z" fill="#f43f5e"/>
  <text x="454" y="108" text-anchor="start" font-size="12" fill="#64748b">by Jeet Mondal &#8226; 2026</text>
</svg>
